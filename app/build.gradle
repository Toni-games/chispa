plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cubiverso.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.cubiverso.app'
        minSdk 21
        targetSdk 34
        versionCode 16
        versionName '2.5'
    }

    signingConfigs {
        cubiverso {
            // Clave fija: así cada versión nueva se instala encima de la anterior
            storeFile file('cubiverso.jks')
            storePassword 'cubiverso123'
            keyAlias 'cubiverso'
            keyPassword 'cubiverso123'
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    // Dos versiones: «gratis» (con anuncios) y «pro» (de pago, sin anuncios)
    flavorDimensions 'version'
    productFlavors {
        gratis {
            dimension 'version'
            applicationId 'com.cubiverso.app'
            resValue 'string', 'app_name', 'Cubiverso'
        }
        pro {
            dimension 'version'
            applicationId 'com.cubiverso.app.pro'
            resValue 'string', 'app_name', 'Cubiverso Pro'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.cubiverso
        }
        debug {
            signingConfig signingConfigs.cubiverso
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

dependencies {
    // Anuncios de Google (AdMob), solo en la versión gratis
    gratisImplementation 'com.google.android.gms:play-services-ads:23.3.0'
}
