<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Noche de Zombis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Zombis: arena nocturna; oleada y vida arriba */
body{background:#0b1022}
#life{top:calc(env(safe-area-inset-top,0px) + 52px);left:50%;transform:translateX(-50%);pointer-events:none}
#life .j-bar{width:min(260px,60vw);height:16px}#life .j-bar i{background:#ff4f4f;width:100%}
#hurt{inset:0;pointer-events:none;box-shadow:inset 0 0 120px rgba(255,0,0,.7);opacity:0;transition:opacity .25s}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="life" class="k-ui"><div class="j-bar"><i id="hp"></i></div></div>
<div id="hurt" class="k-ui"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../avatar.js"></script>
<script src="../kit.js"></script>
<script src="../audio.js"></script>
<script src="comun.js"></script>
<script>
const K=Kit,J=Juego,$=s=>document.querySelector(s);
const {renderer,scene,camera,sun,hemi}=K.setup({sky:0x0b1022,fogNear:25,fogFar:80});
hemi.intensity=.45;sun.intensity=.35;sun.color.set(0x9fb4ff);
const ground=new THREE.Mesh(new THREE.BoxGeometry(120,1,120),K.M(0xffffff,{map:K.studs([60,60])}));ground.material.color.set(0x3d4a3a);ground.position.y=-.5;ground.receiveShadow=true;scene.add(ground);
const boxes=[];
function solid(w,h,d,col,x,z){const m=K.box(w,h,d,K.M(col),x,h/2,z,scene);m.castShadow=m.receiveShadow=true;boxes.push({x0:x-w/2,x1:x+w/2,z0:z-d/2,z1:z+d/2,top:h});return m}
const AR=28;
[[0,-AR,2*AR+2,1],[0,AR,2*AR+2,1],[AR,0,1,2*AR],[-AR,0,1,2*AR]].forEach(([x,z,w,d])=>solid(w,3,d,0x5d4037,x,z));
[[8,6],[-10,-8],[12,-14],[-14,12],[0,-18],[18,16]].forEach(([x,z])=>solid(3,2,3,0x8d6e63,x,z));
// farolas
[[-20,-20],[20,-20],[-20,20],[20,20],[0,0]].forEach(([x,z])=>{K.cyl(.2,.2,6,K.M(0x37474f),x+2,3,z+2,scene);K.sph(.5,new THREE.MeshBasicMaterial({color:0xfff3b0}),x+2,6.2,z+2,scene);const l=new THREE.PointLight(0xffe08a,.9,22);l.position.set(x+2,6,z+2);scene.add(l)});
// luna
const moon=K.sph(6,new THREE.MeshBasicMaterial({color:0xe8ecff,fog:false}),-60,60,-90,scene);
/* ---------- jugador ---------- */
const ctl=K.controls(renderer.domElement,{dist:14,pitch:.7,yaw:Math.PI,onTap:e=>{if(e.pointerType==='mouse'&&e.button===0)firing=true;return false}});
const P=J.player(scene,ctl,{x:0,z:4,speed:9,jump:10,boxes,bound:AR-1});K.emotes(P.a);
const gun=K.box(.25,.25,.9,K.M(0x263238),0,-.8,.35,P.a.armR);
let firing=false,hp=100,wave=0,kills=0,running=false,cd=0,triple=0,between=0,toSpawn=0,spawnT=0;
/* ---------- zombis: muñecos verdes hechos con cubos ---------- */
const Z=[];
function zombie(){const g=new THREE.Group();const skin=K.M(0x7cb342),cloth=K.M([0x5d4037,0x455a64,0x6a1b9a][Math.floor(Math.random()*3)]);
  const legL=new THREE.Group(),legR=new THREE.Group(),armL=new THREE.Group(),armR=new THREE.Group();legL.position.set(-.22,.7,0);legR.position.set(.22,.7,0);armL.position.set(-.62,1.5,0);armR.position.set(.62,1.5,0);
  K.box(.4,.7,.4,K.M(0x37474f),0,-.35,0,legL);K.box(.4,.7,.4,K.M(0x37474f),0,-.35,0,legR);K.box(.85,.85,.45,cloth,0,1.12,0,g);K.box(.35,.8,.35,skin,0,-.35,0,armL);K.box(.35,.8,.35,skin,0,-.35,0,armR);
  K.box(.6,.6,.6,skin,0,1.85,0,g);K.box(.12,.12,.05,K.M(0xff1744),-.14,1.9,.31,g);K.box(.12,.12,.05,K.M(0xff1744),.14,1.9,.31,g);g.add(legL,legR,armL,armR);
  armL.rotation.x=armR.rotation.x=-1.5;g.traverse(o=>{if(o.isMesh)o.castShadow=true});const s=1.15;g.scale.setScalar(s);
  const a=Math.random()*Math.PI*2;g.position.set(Math.cos(a)*(AR-2),0,Math.sin(a)*(AR-2));scene.add(g);
  const big=wave>=3&&Math.random()<.18;if(big)g.scale.setScalar(1.6);
  Z.push({g,legL,legR,hp:big?6:2+Math.floor(wave/4),speed:(big?2.4:3)+wave*.22+Math.random(),walk:Math.random()*6,hit:0,big})}
/* ---------- disparos ---------- */
const shots=[];const shotGeo=new THREE.SphereGeometry(.2,8,6),shotMat=new THREE.MeshBasicMaterial({color:0xffe066});
function aimDir(){// apunta solo al zombi más cercano que esté delante
  const yaw=ctl.look.yaw;let fx=-Math.sin(yaw),fz=-Math.cos(yaw);let best=null,bd=26;
  Z.forEach(z=>{const dx=z.g.position.x-P.x,dz=z.g.position.z-P.z,d=Math.hypot(dx,dz);if(d<bd&&(dx*fx+dz*fz)/d>.55){bd=d;best=[dx/d,dz/d]}});return best||[fx,fz]}
function shoot(){if(!running||cd>0)return;cd=triple>0?.22:.28;const [fx,fz]=aimDir();P.face=Math.atan2(fx,fz);P.a.root.rotation.y=P.face;
  const ang=Math.atan2(fx,fz);(triple>0?[-.18,0,.18]:[0]).forEach(o=>{const m=new THREE.Mesh(shotGeo,shotMat);m.position.set(P.x+Math.sin(ang+o)*.8,P.y+1.4,P.z+Math.cos(ang+o)*.8);scene.add(m);shots.push({m,vx:Math.sin(ang+o)*40,vz:Math.cos(ang+o)*40,t:0})});J.sfx('laser')}
J.action('DISPARAR',['e','f'],shoot,{col:'#ff4f4f'});
addEventListener('mouseup',()=>firing=false);
/* ---------- objetos ---------- */
const items=[];
function dropItem(x,z){if(Math.random()>.14)return;const kind=Math.random()<.6?'vida':'triple';const m=kind==='vida'?K.box(.9,.9,.9,K.M(0xff4f4f),x,.6,z,scene):K.sph(.5,K.M(0xffcc33),x,.7,z,scene);K.box(.25,.95,.25,new THREE.MeshBasicMaterial({color:0xffffff}),0,0,0,m).visible=kind==='vida';items.push({m,kind,t:0})}
function hurt(n){hp=Math.max(0,hp-n);$('#hp').style.width=hp+'%';$('#hurt').style.opacity=1;setTimeout(()=>$('#hurt').style.opacity=0,200);J.sfx('hit');if(hp<=0)die()}
function hud(){J.hud([['Oleada',wave],['Zombis',Z.length+toSpawn],['Eliminados',kills],triple>0?['Triple',Math.ceil(triple)+' s']:null])}
function nextWave(){wave++;toSpawn=4+wave*3;spawnT=0;K.toast('OLEADA '+wave,'¡Que vienen!','#ff4f4f');J.sfx('alarm');hud()}
function die(){running=false;J.sfx('lose');if(window.CubiAvatar)CubiAvatar.emote(P.a,'ge3');const rec=J.saveBest('zombis',wave,true);
  setTimeout(()=>J.end({title:'TE HAN PILLADO',col:'#ff4f4f',lines:[`Has llegado a la oleada <b style="color:#ffcc33">${wave}</b>`,`Zombis eliminados: ${kills}`,`Récord: oleada ${J.best('zombis')}`],record:rec}),1000)}
/* ---------- bucle ---------- */
let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;
  P.frozen=!running;P.update(dt,camera,1.5);if(running)P.a.armR.rotation.x=-1.5;
  sun.position.set(P.x+20,40,P.z+10);sun.target.position.set(P.x,0,P.z);
  if(running){cd-=dt;triple=Math.max(0,triple-dt);if(firing)shoot();
    if(toSpawn>0){spawnT-=dt;if(spawnT<=0){zombie();toSpawn--;spawnT=Math.max(.35,1.2-wave*.06);hud()}}
    else if(!Z.length){between+=dt;if(between>3){between=0;nextWave()}}}
  // zombis
  Z.forEach(z=>{const dx=P.x-z.g.position.x,dz=P.z-z.g.position.z,d=Math.hypot(dx,dz);
    if(running&&d>.9){let nx=z.g.position.x+dx/d*z.speed*dt,nz=z.g.position.z+dz/d*z.speed*dt;
      if(boxes.some(b=>nx>b.x0-.4&&nx<b.x1+.4&&nz>b.z0-.4&&nz<b.z1+.4)){nx=z.g.position.x+(-dz/d)*z.speed*dt;nz=z.g.position.z+(dx/d)*z.speed*dt}z.g.position.x=nx;z.g.position.z=nz}
    z.g.rotation.y=Math.atan2(dx,dz);z.walk+=dt*z.speed*1.6;const s=Math.sin(z.walk)*.6;z.legL.rotation.x=s;z.legR.rotation.x=-s;
    z.hit=Math.max(0,z.hit-dt);if(running&&d<1.3*(z.big?1.4:1)&&z.hit<=0){z.hit=.8;hurt(z.big?18:10)}});
  // disparos
  for(let i=shots.length-1;i>=0;i--){const s=shots[i];s.t+=dt;s.m.position.x+=s.vx*dt;s.m.position.z+=s.vz*dt;let gone=s.t>.9;const p=s.m.position;
    if(boxes.some(b=>p.x>b.x0&&p.x<b.x1&&p.z>b.z0&&p.z<b.z1&&p.y<b.top))gone=true;
    for(const z of Z){if(Math.hypot(p.x-z.g.position.x,p.z-z.g.position.z)<(z.big?1.1:.75)){z.hp--;gone=true;z.g.position.x+=s.vx*.006;z.g.position.z+=s.vz*.006;J.sfx('pop');
      if(z.hp<=0){scene.remove(z.g);Z.splice(Z.indexOf(z),1);kills++;dropItem(z.g.position.x,z.g.position.z);hud()}break}}
    if(gone){scene.remove(s.m);shots.splice(i,1)}}
  // objetos
  for(let i=items.length-1;i>=0;i--){const it=items[i];it.t+=dt;it.m.rotation.y+=dt*2;it.m.position.y=.7+Math.sin(it.t*3)*.15;
    if(Math.hypot(P.x-it.m.position.x,P.z-it.m.position.z)<1.3){if(it.kind==='vida'){hp=Math.min(100,hp+30);$('#hp').style.width=hp+'%';K.toast('+30 VIDA','','#3fd15c')}else{triple=10;K.toast('¡DISPARO TRIPLE!','10 segundos','#ffcc33')}J.sfx('lucky');scene.remove(it.m);items.splice(i,1);hud()}
    else if(it.t>15){scene.remove(it.m);items.splice(i,1)}}
  renderer.render(scene,camera);requestAnimationFrame(loop)}
hud();J.music('batalla');
J.start({title:'NOCHE DE ZOMBIS',col:'#ff4f4f',sub:'Aguanta en el patio todas las oleadas de zombis que puedas. Cada oleada trae más, más rápidos y alguno gigante.',
  howto:['Muévete con <b>WASD</b> o el joystick','Dispara con <b>clic</b>, <b>E</b> o DISPARAR (apunta solo al zombi que tengas delante)','Recoge cajas rojas (vida) y bolas amarillas (disparo triple)'],
  record:J.best('zombis')!=null?'oleada '+J.best('zombis'):null,onStart(){running=true;nextWave()}});
requestAnimationFrame(loop);
</script>
</body>
</html>
