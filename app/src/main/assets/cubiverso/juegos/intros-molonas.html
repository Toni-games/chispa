<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Intros Molonas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&family=Bungee&display=swap">
<style>
/* Estudio de intros: pantalla de cine a la izquierda, mesa de mezclas a la derecha; acento magenta de "en directo" */
:root{--bg:#0d0b16;--panel:#18142a;--panel2:#241e3d;--line:#382e5e;--ink:#f6f3ff;--muted:#a59cc9;--hot:#ff3d8b;--y:#ffd23f;--g:#3fd17a;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 Nunito,system-ui,sans-serif;overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input{font:inherit;color:inherit}button{cursor:pointer}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,410px)}
.left{display:flex;flex-direction:column;min-height:0;padding:12px;gap:10px}
.brief{background:var(--panel);border:3px solid #000;border-radius:14px;padding:10px 12px;display:flex;gap:12px;align-items:center}
.brief .lg{width:54px;height:54px;border-radius:10px;background:#fff;flex:none;background-size:cover}
.brief b{font:400 18px "Lilita One",sans-serif;letter-spacing:.02em}.brief p{margin:2px 0 0;font-size:14px}
.brief ul{margin:4px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px;color:var(--muted)}
.brief li.ok{color:var(--g)}.brief li::before{content:"○ "}.brief li.ok::before{content:"✓ "}
.screen{position:relative;flex:1;min-height:0;display:grid;place-items:center}
.cine{position:relative;width:320px;height:180px;background:#000;border:3px solid #000;border-radius:12px;overflow:hidden;box-shadow:0 0 0 2px var(--line),0 20px 50px #0008}
#cv{width:100%;height:100%;display:block}
.cine .rec{position:absolute;left:10px;top:8px;font:400 13px Bungee,sans-serif;color:var(--hot);letter-spacing:.06em}
.cine.full{position:fixed;inset:0;width:100vw!important;height:100vh!important;z-index:20;border:0;border-radius:0}
.ctrl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.b{border:3px solid #000;border-radius:12px;background:var(--panel2);padding:9px 14px;font-weight:900;white-space:nowrap}
.b.h{background:var(--hot);color:#fff}.b.y{background:var(--y);color:#1b1300}.b.g{background:var(--g);color:#03220f}
.b:focus-visible,.chip:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.side{background:var(--panel);border-left:3px solid #000;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:14px}
.side h1{margin:0;font:400 26px Bungee,"Arial Black",sans-serif;color:var(--hot);letter-spacing:.02em}
.sec h3{margin:0 0 6px;font:400 14px "Lilita One",sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--y)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:3px solid #000;border-radius:999px;background:var(--panel2);padding:6px 11px;font-weight:800;font-size:14px}
.chip.on{background:#fff;color:#000}
.chip:disabled{opacity:.45;cursor:not-allowed}
.logos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.logos button{border:3px solid #000;border-radius:12px;background:#fff;aspect-ratio:1;padding:0;background-size:cover}
.logos button.on{outline:4px solid var(--hot);outline-offset:1px}
.in{width:100%;border:3px solid #000;border-radius:10px;background:#0c0a14;padding:8px 10px;font-weight:800}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid #000}.sw.on{outline:3px solid #fff}
.ov{position:fixed;inset:0;z-index:30;background:rgba(5,3,10,.82);display:grid;place-items:center;padding:16px}
.card{width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border:3px solid #000;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px;text-align:center}
.card h2{margin:0;font:400 34px Bungee,sans-serif;color:var(--hot)}.card p{margin:0;color:var(--muted)}
.stars{font-size:38px;letter-spacing:6px;color:#3a3160}.stars i{font-style:normal;color:var(--y)}
#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#000;border:3px solid var(--hot);border-radius:12px;padding:8px 14px;font-weight:900;z-index:40;pointer-events:none}
@media (max-width:820px){.app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}.left{padding:8px}.side{border-left:0;border-top:3px solid #000}.brief .lg{width:40px;height:40px}}
@media (max-height:520px) and (min-width:821px){.app{grid-template-columns:minmax(0,1.6fr) minmax(250px,320px)}.brief p{display:none}.left{gap:6px;padding:8px}.brief{padding:6px 10px}.brief .lg{width:40px;height:40px}.side h1{font-size:20px}}
</style>
<script src="../cursor.js"></script>
</head>
<body>
<div class="app">
  <section class="left">
    <div class="brief" id="brief"></div>
    <div class="screen"><div class="cine" id="cine"><canvas id="cv" aria-label="Pantalla de la intro"></canvas><span class="rec">● INTRO</span></div></div>
    <div class="ctrl"><button class="b h" id="bPlay">▶ VER INTRO</button><button class="b y" id="bDeliver">Entregar al cliente</button><button class="b" id="bSaveI">Guardar intro</button><button class="b" id="bMode">Modo libre</button></div>
  </section>
  <aside class="side" id="side"></aside>
</div>
<div id="ovl"></div>
<div id="toast" hidden></div>
<input type="file" id="file" accept="image/*" hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=t=>{const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2400)};
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
/* ---------- empresas inventadas y sus logos ---------- */
function cnv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function wordmark(x,txt,col,y,size){x.font=`400 ${size||54}px Bungee,"Arial Black",sans-serif`;x.textAlign='center';x.textBaseline='middle';x.lineWidth=10;x.strokeStyle='#1a1430';x.strokeText(txt,256,y);x.fillStyle=col;x.fillText(txt,256,y)}
const CO={
 pato:{n:'Pato Pixel',col:'#ffd23f',draw(x){const P=['....YYYY....','...YYYYYY...','..YYYKYYYY..','..YYYYYYYOO.','..YYYYYYOOO.','...YYYYYY...','.YYYYYYYYYY.','YYYYYYYYYYYY','YYYYYYYYYYY.','.YYYYYYYYY..','..YYYYYYY...'],s=22,ox=256-6*s,oy=40;
   P.forEach((r,j)=>[...r].forEach((ch,i)=>{if(ch==='.')return;x.fillStyle={Y:'#ffd23f',K:'#1a1430',O:'#ff8a1e'}[ch];x.fillRect(ox+i*s,oy+j*s,s,s)}));wordmark(x,'PATO PIXEL','#ffd23f',400)}},
 cohete:{n:'Cohete Cubo',col:'#4dd2ff',draw(x){const b=(c,X,Y,W,H)=>{x.fillStyle=c;x.fillRect(X,Y,W,H)};b('#e8eef7',216,70,80,180);b('#ff3d8b',236,40,40,40);b('#4dd2ff',236,120,40,40);b('#ff3d8b',176,200,40,60);b('#ff3d8b',296,200,40,60);
   x.fillStyle='#ffd23f';x.beginPath();x.moveTo(226,250);x.lineTo(286,250);x.lineTo(256,320);x.fill();x.fillStyle='#ff8a1e';x.beginPath();x.moveTo(240,250);x.lineTo(272,250);x.lineTo(256,295);x.fill();wordmark(x,'COHETE CUBO','#4dd2ff',400)}},
 volcan:{n:'Volcán Studios',col:'#ff6a2a',draw(x){x.fillStyle='#5a3b2e';x.beginPath();x.moveTo(110,320);x.lineTo(220,110);x.lineTo(292,110);x.lineTo(402,320);x.fill();x.fillStyle='#ff6a2a';x.beginPath();x.moveTo(220,110);x.lineTo(292,110);x.lineTo(270,170);x.lineTo(250,140);x.lineTo(236,180);x.fill();
   [[230,70,16],[280,50,12],[250,30,10]].forEach(([a,c,r])=>{x.fillStyle='#ffd23f';x.beginPath();x.arc(a,c,r,0,7);x.fill()});wordmark(x,'VOLCÁN','#ff6a2a',385,60);wordmark(x,'STUDIOS','#ffffff',445,34)}},
 rayo:{n:'Rayo Azul',col:'#3d7bff',draw(x){x.fillStyle='#3d7bff';x.beginPath();x.arc(256,180,130,0,7);x.fill();x.fillStyle='#ffd23f';x.beginPath();x.moveTo(280,70);x.lineTo(200,200);x.lineTo(252,200);x.lineTo(226,300);x.lineTo(316,160);x.lineTo(262,160);x.closePath();x.fill();wordmark(x,'RAYO AZUL','#9fc0ff',400)}},
 nube:{n:'Nube Naranja',col:'#ff9a3c',draw(x){x.fillStyle='#ff9a3c';[[190,200,70],[260,160,90],[330,200,70],[256,230,80]].forEach(([a,c,r])=>{x.beginPath();x.arc(a,c,r,0,7);x.fill()});x.fillRect(150,200,220,90);
   x.fillStyle='#1a1430';x.beginPath();x.arc(230,200,10,0,7);x.arc(290,200,10,0,7);x.fill();x.lineWidth=8;x.strokeStyle='#1a1430';x.beginPath();x.arc(260,225,30,.2,PI-.2);x.stroke();wordmark(x,'NUBE NARANJA','#ff9a3c',400,46)}},
 burbuja:{n:'Burbuja Soft',col:'#b46bff',draw(x){[[200,190,80,'#b46bff'],[300,150,60,'#ff3d8b'],[310,250,50,'#4dd2ff']].forEach(([a,c,r,col])=>{x.fillStyle=col;x.globalAlpha=.9;x.beginPath();x.arc(a,c,r,0,7);x.fill();x.globalAlpha=1;x.fillStyle='#ffffff99';x.beginPath();x.arc(a-r*.35,c-r*.35,r*.22,0,7);x.fill()});wordmark(x,'BURBUJA SOFT','#d6b0ff',400,46)}}};
const PI=Math.PI;
function logoCanvas(key){const c=cnv(512,512),x=c.getContext('2d');CO[key].draw(x);return c}
function textLogo(txt,col){const c=cnv(512,512),x=c.getContext('2d');const t=(txt||'MI EMPRESA').toUpperCase().slice(0,16);x.fillStyle=col;x.beginPath();x.arc(256,170,110,0,7);x.fill();
  x.font='400 120px Bungee,"Arial Black",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillStyle='#1a1430';x.fillText(t[0]||'M',256,178);
  const sz=Math.min(64,900/Math.max(6,t.length));wordmark(x,t,col,390,sz);return c}
/* ---------- encargos ---------- */
const ENT={zoom:'Zoom',giro:'Girar',caida:'Caer y rebotar',volteo:'Darse la vuelta',piezas:'Por piezas',glitch:'Glitch'};
const FX={brillo:'Brillo',onda:'Onda expansiva',destello:'Destello',confeti:'Confeti',chispas:'Chispas',temblor:'Temblor'};
const FON={estrellas:'Estrellas',neon:'Rejilla neón',degradado:'Degradado',rayos:'Rayos de luz',humo:'Humo'};
const MUS={epica:'Épica',retro:'Retro',pop:'Pop',ninguna:'Sin música'};
const COLS=['#ff3d8b','#ffd23f','#4dd2ff','#3fd17a','#b46bff','#ff6a2a'];
const JOBS=[
 {co:'pato',txt:'Queremos que el pato caiga y rebote, con confeti y música pop.',req:[['ent','caida'],['fx','confeti'],['mus','pop']]},
 {co:'cohete',txt:'Que el logo gire como un cohete, con estrellas de fondo y chispas.',req:[['ent','giro'],['fon','estrellas'],['fx','chispas']]},
 {co:'volcan',txt:'¡Algo épico! Que tiemble todo, con música épica y nuestro eslogan.',req:[['fx','temblor'],['mus','epica'],['esl',1]]},
 {co:'rayo',txt:'Muy futurista: efecto glitch, fondo neón y música retro.',req:[['ent','glitch'],['fon','neon'],['mus','retro']]},
 {co:'nube',txt:'Suave y bonita: que aparezca con zoom, con brillo y fondo degradado.',req:[['ent','zoom'],['fx','brillo'],['fon','degradado']]},
 {co:'burbuja',txt:'Que el logo se monte por piezas, con onda expansiva, destello y rayos de luz.',req:[['ent','piezas'],['fx','onda'],['fx','destello'],['fon','rayos']]}];
const reqTxt=([t,v])=>t==='ent'?'Entrada: '+ENT[v]:t==='fx'?'Efecto: '+FX[v]:t==='fon'?'Fondo: '+FON[v]:t==='mus'?'Música: '+MUS[v]:'Con eslogan';
let save={job:0,cubos:0,best:{}};try{save=Object.assign(save,JSON.parse(localStorage.getItem('intros-molonas')||'{}'))}catch(e){}
const persist=()=>{try{localStorage.setItem('intros-molonas',JSON.stringify(save))}catch(e){}};
let mode='encargo',cfg={logo:'pato',src:'co',text:'MI EMPRESA',ent:'zoom',fx:[],fon:'estrellas',mus:'epica',col:'#ff3d8b',esl:''},watched=false,img=null;
function job(){return JOBS[save.job%JOBS.length]}
function reqMet(r){const [t,v]=r;if(t==='ent')return cfg.ent===v;if(t==='fx')return cfg.fx.includes(v);if(t==='fon')return cfg.fon===v;if(t==='mus')return cfg.mus===v;if(t==='esl')return cfg.esl.trim().length>2;return false}
/* ---------- panel ---------- */
const thumbs={};function thumb(k){return thumbs[k]||(thumbs[k]=logoCanvas(k).toDataURL())}
function drawBrief(){const b=$('#brief');if(mode==='libre'){b.innerHTML=`<div><b>MODO LIBRE</b><p>Haz la intro que quieras: con un logo inventado, tu propia imagen o un nombre.</p></div>`;return}
  const J=job();b.innerHTML=`<span class="lg" style="background-image:url(${thumb(J.co)})"></span><div style="min-width:0"><b>Encargo ${save.job+1} · ${esc(CO[J.co].n)}</b><p>«${esc(J.txt)}»</p><ul>${J.req.map(r=>`<li class="${reqMet(r)?'ok':''}">${reqTxt(r)}</li>`).join('')}</ul></div>`}
function side(){const lock=mode==='encargo';
  $('#side').innerHTML=`<h1>INTROS MOLONAS</h1>
  <div class="sec"><h3>1 · Logo</h3>${lock?`<p style="margin:0;color:var(--muted);font-size:13px">En los encargos se usa el logo del cliente.</p>`:`
    <div class="logos">${Object.keys(CO).map(k=>`<button class="${cfg.src==='co'&&cfg.logo===k?'on':''}" data-logo="${k}" aria-label="${esc(CO[k].n)}" style="background-image:url(${thumb(k)})"></button>`).join('')}</div>
    <div class="chips" style="margin-top:8px"><button class="chip ${cfg.src==='img'?'on':''}" data-a="up">Subir una imagen</button><button class="chip ${cfg.src==='txt'?'on':''}" data-a="txt">Escribir un nombre</button></div>
    ${cfg.src==='txt'?`<input class="in" id="tName" maxlength="16" value="${esc(cfg.text)}" style="margin-top:8px" aria-label="Nombre de la empresa">`:''}
    ${cfg.src==='img'?`<p style="margin:6px 0 0;color:var(--muted);font-size:12px">Usa un logo tuyo o inventado.</p>`:''}`}</div>
  <div class="sec"><h3>2 · Entrada del logo</h3><div class="chips">${Object.entries(ENT).map(([k,n])=>`<button class="chip ${cfg.ent===k?'on':''}" data-ent="${k}">${n}</button>`).join('')}</div></div>
  <div class="sec"><h3>3 · Efectos al llegar</h3><div class="chips">${Object.entries(FX).map(([k,n])=>`<button class="chip ${cfg.fx.includes(k)?'on':''}" data-fx="${k}" aria-pressed="${cfg.fx.includes(k)}">${n}</button>`).join('')}</div></div>
  <div class="sec"><h3>4 · Fondo</h3><div class="chips">${Object.entries(FON).map(([k,n])=>`<button class="chip ${cfg.fon===k?'on':''}" data-fon="${k}">${n}</button>`).join('')}</div></div>
  <div class="sec"><h3>5 · Música</h3><div class="chips">${Object.entries(MUS).map(([k,n])=>`<button class="chip ${cfg.mus===k?'on':''}" data-mus="${k}">${n}</button>`).join('')}</div></div>
  <div class="sec"><h3>6 · Color de las luces</h3><div class="chips">${COLS.map(c=>`<button class="sw ${cfg.col===c?'on':''}" data-col="${c}" style="background:${c}" aria-label="Color ${c}"></button>`).join('')}</div></div>
  <div class="sec"><h3>7 · Eslogan</h3><input class="in" id="esl" maxlength="32" placeholder="Ej.: ¡Jugamos a lo grande!" value="${esc(cfg.esl)}"></div>`;
  drawBrief()}
$('#side').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.logo){cfg.logo=d.logo;cfg.src='co';setLogo()}
  else if(d.a==='up'){$('#file').click();return}else if(d.a==='txt'){cfg.src='txt';setLogo()}
  else if(d.ent)cfg.ent=d.ent;else if(d.fx){cfg.fx=cfg.fx.includes(d.fx)?cfg.fx.filter(x=>x!==d.fx):cfg.fx.concat(d.fx)}else if(d.fon)cfg.fon=d.fon;else if(d.mus)cfg.mus=d.mus;else if(d.col){cfg.col=d.col;if(cfg.src==='txt')setLogo()}
  blip();side();rebuild()});
$('#side').addEventListener('input',e=>{if(e.target.id==='esl'){cfg.esl=e.target.value;drawBrief();rebuild()}if(e.target.id==='tName'){cfg.text=e.target.value;setLogo()}});
$('#file').onchange=()=>{const f=$('#file').files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=cnv(512,512),x=c.getContext('2d');const s=Math.min(480/im.width,480/im.height);x.drawImage(im,256-im.width*s/2,256-im.height*s/2,im.width*s,im.height*s);img=c;cfg.src='img';setLogo();side();rebuild()};im.src=r.result};r.readAsDataURL(f)};
/* ---------- la intro en 3D ---------- */
const cv=$('#cv'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true});R.setPixelRatio(Math.min(devicePixelRatio||1,2));
const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(45,16/9,.1,400);C.position.set(0,0,12);
let logoTex=null,G={},playT=-1,playStart=0;
function setLogo(){const c=cfg.src==='img'&&img?img:cfg.src==='txt'?textLogo(cfg.text,cfg.col):logoCanvas(mode==='encargo'?job().co:cfg.logo);if(logoTex)logoTex.dispose();logoTex=new THREE.CanvasTexture(c);rebuild()}
function radTex(col){const c=cnv(128,128),x=c.getContext('2d'),g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'#fff');g.addColorStop(.25,col);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,128,128);return new THREE.CanvasTexture(c)}
const ADD={transparent:true,blending:THREE.AdditiveBlending,depthWrite:false};
function rebuild(){while(S.children.length)S.remove(S.children[0]);G={};const col=new THREE.Color(cfg.col);
  // fondo
  if(cfg.fon==='estrellas'){const n=1400,p=new Float32Array(n*3);for(let i=0;i<n;i++){p[i*3]=rand(-60,60);p[i*3+1]=rand(-35,35);p[i*3+2]=rand(-200,10)}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));
    G.stars=new THREE.Points(g,new THREE.PointsMaterial({size:.35,map:radTex('#ffffff'),...ADD,color:0xffffff}));S.add(G.stars)}
  if(cfg.fon==='neon'){const gr=new THREE.GridHelper(200,80,col,col);gr.position.y=-6;gr.material.transparent=true;gr.material.opacity=.7;S.add(gr);G.grid=gr;
    const sun=new THREE.Mesh(new THREE.CircleGeometry(14,48),new THREE.MeshBasicMaterial({map:sunTex(cfg.col),transparent:true}));sun.position.set(0,2,-80);S.add(sun)}
  if(cfg.fon==='degradado'){const m=new THREE.Mesh(new THREE.PlaneGeometry(140,80),new THREE.MeshBasicMaterial({map:gradTex(cfg.col)}));m.position.z=-30;S.add(m);G.grad=m}
  if(cfg.fon==='rayos'){const m=new THREE.Mesh(new THREE.PlaneGeometry(90,90),new THREE.MeshBasicMaterial({map:rayTex(cfg.col),...ADD}));m.position.z=-20;S.add(m);G.rays=m}
  if(cfg.fon==='humo'){G.smoke=[];const t=radTex('#7a6aa8');for(let i=0;i<26;i++){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,opacity:.35,depthWrite:false}));s.position.set(rand(-22,22),rand(-12,12),rand(-30,-8));const k=rand(8,18);s.scale.set(k,k,1);s.userData.v=rand(.3,1);S.add(s);G.smoke.push(s)}}
  // logo
  const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:radTex(cfg.col),...ADD,opacity:0}));glow.scale.set(14,14,1);S.add(glow);G.glow=glow;
  const L=new THREE.Group();S.add(L);G.logo=L;
  if(cfg.ent==='piezas'){G.tiles=[];const N=6,sz=6/N;for(let j=0;j<N;j++)for(let i=0;i<N;i++){const g=new THREE.PlaneGeometry(sz,sz);const uv=g.attributes.uv;for(let k=0;k<uv.count;k++)uv.setXY(k,(i+uv.getX(k))/N,1-(j+1-uv.getY(k))/N);
      const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({map:logoTex,transparent:true,side:THREE.DoubleSide}));const tx=-3+sz/2+i*sz,ty=3-sz/2-j*sz;m.userData={tx,ty,fx:rand(-30,30),fy:rand(-18,18),fz:rand(-40,6),rx:rand(-6,6),ry:rand(-6,6),d:rand(0,.5)};L.add(m);G.tiles.push(m)}}
  else{const m=new THREE.Mesh(new THREE.PlaneGeometry(6,6),new THREE.MeshBasicMaterial({map:logoTex,transparent:true,side:THREE.DoubleSide}));L.add(m);G.face=m;
    if(cfg.ent==='glitch'){G.ghosts=['#ff2a6d','#2af7ff'].map(c=>{const g=new THREE.Mesh(new THREE.PlaneGeometry(6,6),new THREE.MeshBasicMaterial({map:logoTex,color:c,...ADD,opacity:0}));L.add(g);return g})}}
  // efectos
  if(cfg.fx.includes('onda')){G.ring=new THREE.Mesh(new THREE.RingGeometry(.9,1,64),new THREE.MeshBasicMaterial({color:col,...ADD,opacity:0,side:THREE.DoubleSide}));S.add(G.ring)}
  if(cfg.fx.includes('destello')){G.flare=new THREE.Sprite(new THREE.SpriteMaterial({map:radTex('#ffffff'),...ADD,opacity:0}));S.add(G.flare)}
  if(cfg.fx.includes('chispas')){const n=260,p=new Float32Array(n*3),v=[];for(let i=0;i<n;i++){const a=rand(0,6.28),b=rand(-1,1),s=rand(4,12);v.push([Math.cos(a)*s*Math.sqrt(1-b*b),b*s+2,Math.sin(a)*s*.6])}
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));G.sparks=new THREE.Points(g,new THREE.PointsMaterial({size:.25,color:new THREE.Color(cfg.col).lerp(new THREE.Color(0xffffff),.5),map:radTex('#ffffff'),...ADD,opacity:0}));G.sparks.userData.v=v;S.add(G.sparks)}
  if(cfg.fx.includes('confeti')){G.conf=[];const cs=[0xff3d8b,0xffd23f,0x4dd2ff,0x3fd17a,0xb46bff,0xffffff];for(let i=0;i<160;i++){const m=new THREE.Mesh(new THREE.PlaneGeometry(.22,.38),new THREE.MeshBasicMaterial({color:cs[i%6],side:THREE.DoubleSide,transparent:true,opacity:0}));
    m.userData={x:rand(-16,16),y:rand(9,22),z:rand(-6,4),vy:rand(2.5,5),rx:rand(1,6),ry:rand(1,6),sw:rand(0,6)};S.add(m);G.conf.push(m)}}
  if(cfg.fx.includes('brillo')){G.shine=new THREE.Mesh(new THREE.PlaneGeometry(1.1,9),new THREE.MeshBasicMaterial({color:0xffffff,...ADD,opacity:0}));G.shine.rotation.z=-.35;G.shine.position.z=.05;G.logo.add(G.shine)}
  // eslogan
  if(cfg.esl.trim()){G.sloganC=cnv(1024,128);G.sloganT=new THREE.CanvasTexture(G.sloganC);const m=new THREE.Mesh(new THREE.PlaneGeometry(12,1.5),new THREE.MeshBasicMaterial({map:G.sloganT,transparent:true}));m.position.set(0,-3.5,1);S.add(m);G.slogan=m;G.slN=-1}
  G.fade=new THREE.Mesh(new THREE.PlaneGeometry(100,60),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0,depthTest:false}));G.fade.position.z=6;G.fade.renderOrder=9;S.add(G.fade);
  if(playT<0)frameAt(4.4)}
function sunTex(col){const c=cnv(256,256),x=c.getContext('2d'),g=x.createLinearGradient(0,0,0,256);g.addColorStop(0,'#ffd23f');g.addColorStop(1,col);x.fillStyle=g;x.beginPath();x.arc(128,128,128,0,7);x.fill();x.fillStyle='#000';for(let i=0;i<7;i++)x.fillRect(0,140+i*16,256,4+i*1.2);return new THREE.CanvasTexture(c)}
function gradTex(col){const c=cnv(512,256),x=c.getContext('2d'),g=x.createLinearGradient(0,0,512,256);g.addColorStop(0,'#14062a');g.addColorStop(.55,col);g.addColorStop(1,'#ffd23f');x.fillStyle=g;x.fillRect(0,0,512,256);return new THREE.CanvasTexture(c)}
function rayTex(col){const c=cnv(512,512),x=c.getContext('2d');x.translate(256,256);for(let i=0;i<18;i++){x.rotate(PI*2/18);const g=x.createLinearGradient(0,0,256,0);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.globalAlpha=.55;x.beginPath();x.moveTo(0,0);x.lineTo(256,-22);x.lineTo(256,22);x.fill()}return new THREE.CanvasTexture(c)}
/* tiempo de la intro (segundos): 0–0.6 fondo · 0.6–2.2 entrada · 2.2 golpe · 2.8–3.6 brillo · 3.0 eslogan · 5.4–6 fundido */
const T_IN=.6,T_HIT=2.2,T_END=6;
const eOut=t=>1-Math.pow(1-t,3),eBack=t=>{const c=1.7;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
function bounce(t){const n=7.5625,d=2.75;if(t<1/d)return n*t*t;if(t<2/d)return n*(t-=1.5/d)*t+.75;if(t<2.5/d)return n*(t-=2.25/d)*t+.9375;return n*(t-=2.625/d)*t+.984375}
function frameAt(t){const p=clamp((t-T_IN)/(T_HIT-T_IN),0,1),L=G.logo;if(!L)return;L.position.set(0,.6,0);L.rotation.set(0,0,0);L.scale.setScalar(1);
  const vis=t>=T_IN;if(G.face)G.face.material.opacity=vis?1:0;
  switch(cfg.ent){
    case 'zoom':L.scale.setScalar(Math.max(.001,eBack(p)));L.position.z=-20*(1-eOut(p));break;
    case 'giro':L.rotation.y=(1-eOut(p))*PI*6;L.scale.setScalar(Math.max(.001,eOut(p)));break;
    case 'caida':L.position.y=.6+(1-bounce(p))*11;break;
    case 'volteo':L.rotation.x=(1-eOut(p))*PI*1.5;L.position.z=-6*(1-eOut(p));break;
    case 'glitch':{const on=p>=1||Math.random()<.25+p*.6;if(G.face)G.face.material.opacity=vis&&on?1:0;L.position.x=p<1?rand(-.6,.6)*(1-p):0;
      G.ghosts.forEach((g,i)=>{g.material.opacity=vis?(p<1?.8:Math.max(0,.6-(t-T_HIT)*1.5)):0;g.position.x=(i?.18:-.18)*(p<1?3:1)+(p<1?rand(-.3,.3):0)});break}
    case 'piezas':G.tiles.forEach(m=>{const u=m.userData,k=eOut(clamp((p-u.d)/(1-u.d+.0001),0,1));m.position.set(u.fx+(u.tx-u.fx)*k,u.fy+(u.ty-u.fy)*k,u.fz*(1-k));m.rotation.set(u.rx*(1-k),u.ry*(1-k),0);m.material.opacity=vis?Math.min(1,k*3):0});break}
  if(t>T_HIT+.3){L.position.y+=Math.sin((t-T_HIT)*2)*.12;L.rotation.y+=Math.sin((t-T_HIT)*1.3)*.08}
  const h=t-T_HIT;
  G.glow.material.opacity=t<T_HIT?p*.5:.55+Math.max(0,.6-h)*.8;G.glow.position.copy(L.position).setZ(-1);
  // cámara y temblor
  C.position.set(0,0,12+(t<T_HIT?(1-p)*2:0));if(cfg.fx.includes('temblor')&&h>0&&h<.7){const k=(.7-h)/.7;C.position.x+=rand(-.5,.5)*k;C.position.y+=rand(-.4,.4)*k}C.lookAt(0,.3,0);
  if(G.ring){const k=clamp(h/.9,0,1);G.ring.scale.setScalar(.5+k*13);G.ring.material.opacity=h>0?(1-k):0}
  if(G.flare){const k=h>0&&h<.6?Math.sin(h/.6*PI):0;G.flare.scale.set(4+k*20,4+k*20,1);G.flare.material.opacity=k;G.flare.position.set(1.8,2.2,1)}
  if(G.sparks){const a=G.sparks.geometry.attributes.position,v=G.sparks.userData.v;const k=Math.max(0,h);for(let i=0;i<v.length;i++)a.setXYZ(i,v[i][0]*k,.6+v[i][1]*k-4.9*k*k,v[i][2]*k);a.needsUpdate=true;G.sparks.material.opacity=h>0?Math.max(0,1-h/1.4):0}
  if(G.conf)G.conf.forEach(m=>{const u=m.userData;if(h<0){m.material.opacity=0;return}m.material.opacity=1;m.position.set(u.x+Math.sin(h*2+u.sw)*.8,u.y-u.vy*h*1.6-6,u.z);m.rotation.set(h*u.rx,h*u.ry,0)});
  if(G.shine){const k=clamp((t-2.8)/.8,0,1);G.shine.position.x=-5+k*10;G.shine.material.opacity=k>0&&k<1?.65:0}
  if(G.slogan){const n=Math.floor(clamp((t-3)/1.2,0,1)*cfg.esl.length);if(n!==G.slN){G.slN=n;const x=G.sloganC.getContext('2d');x.clearRect(0,0,1024,128);x.font='400 64px Bungee,"Arial Black",sans-serif';x.textAlign='center';x.textBaseline='middle';x.lineWidth=10;x.strokeStyle='#000';x.strokeText(cfg.esl.slice(0,n),512,66);x.fillStyle='#fff';x.fillText(cfg.esl.slice(0,n),512,66);G.sloganT.needsUpdate=true}}
  if(G.stars){G.stars.position.z=t*(t<T_HIT?14:4)%120}
  if(G.grid)G.grid.position.z=(t*8)%2.5;
  if(G.rays)G.rays.rotation.z=t*.25;
  if(G.grad)G.grad.material.color.setHSL(0,0,clamp(t/T_IN,0,1));
  if(G.smoke)G.smoke.forEach(s=>{s.position.x+=s.userData.v*.01});
  const fin=clamp((t-5.4)/.6,0,1),fin0=1-clamp(t/T_IN,0,1);G.fade.material.opacity=playT>=0?Math.max(fin,fin0*.9):0;
  R.render(S,C)}
function resize(){const cn=$('#cine');if(!cn.classList.contains('full')){const bx=$('.screen').getBoundingClientRect(),W=Math.max(120,Math.min(bx.width,bx.height*16/9));const ws=Math.floor(W)+'px',hs=Math.floor(W*9/16)+'px';if(cn.style.width!==ws){cn.style.width=ws;cn.style.height=hs}}
  const w=cv.clientWidth,h=cv.clientHeight;if(!w||!h)return;if(cv.width!==Math.round(w*R.getPixelRatio())||cv.height!==Math.round(h*R.getPixelRatio())){R.setSize(w,h,false);C.aspect=w/h;C.updateProjectionMatrix()}}
let idleT=0;function loop(now){resize();if(playT>=0){playT=Math.max(0,(performance.now()-playStart)/1000);if(playT>=T_END){playT=-1;endPlay()}else frameAt(playT)}else{idleT+=.016;frameAt(4.4+Math.sin(idleT)*.0001)}requestAnimationFrame(loop)}
requestAnimationFrame(loop);
/* ---------- música ---------- */
let AC=null;const ac=()=>{if(!AC)try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}if(AC&&AC.state==='suspended')AC.resume();return AC};
function osc(f,t0,d,type,v,f2,dest){const a=AC,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g).connect(dest||a.destination);o.start(t0);o.stop(t0+d+.05)}
function nz(t0,d,v,fq,type){const a=AC,n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=Math.random()*2-1;const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type=type||'lowpass';f.frequency.setValueAtTime(fq,t0);const g=a.createGain();g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);s.connect(f).connect(g).connect(a.destination);s.start(t0);return f}
const kick=t=>osc(150,t,.35,'sine',.7,40),clap=t=>nz(t,.18,.35,1800,'bandpass'),hat=t=>nz(t,.05,.12,7000,'highpass');
function music(){const a=ac();if(!a)return;const t=a.currentTime+.05,hit=t+T_HIT;
  // sonidos de la intro (siempre)
  const sw=nz(t+T_IN,1.6,.15,400,'bandpass');sw.frequency.exponentialRampToValueAtTime(5000,t+T_HIT);osc(60,hit,1.2,'sine',.8,30);nz(hit,.8,.4,900);
  if(cfg.mus==='epica'){[65.4,98,130.8].forEach(f=>osc(f,t,T_HIT,'sawtooth',.06,f*1.02));[0,.55,1.1,1.65].forEach(d=>kick(t+d+.1));
    [[130.8,164.8,196],[110,130.8,164.8]].forEach((ch,i)=>ch.forEach(f=>osc(f,hit+i*1.6,1.8,'sawtooth',.05)));osc(523,hit+.1,2.5,'triangle',.08)}
  if(cfg.mus==='retro'){const sc=[220,261.6,329.6,392,440,392,329.6,261.6];for(let i=0;i<40;i++)osc(sc[i%8]*(i>=16?1.5:1),t+i*.13,.12,'square',.05);for(let i=0;i<10;i++)kick(t+i*.52);osc(880,hit,.8,'square',.06,440)}
  if(cfg.mus==='pop'){for(let i=0;i<12;i++){kick(t+i*.48);if(i%2)clap(t+i*.48);hat(t+i*.48+.24)}[[261.6,329.6,392],[293.7,370,440]].forEach((ch,i)=>ch.forEach(f=>{osc(f,hit+i*.96,.4,'square',.04);osc(f,hit+i*.96+.48,.4,'square',.04)}));for(let i=0;i<8;i++)osc([65.4,65.4,73.4,82.4][i%4],t+i*.48+.24,.3,'triangle',.18)}}
/* ---------- reproducir y entregar ---------- */
function blip(){const a=ac();if(a)osc(900,a.currentTime,.06,'square',.05)}
function startIntro(){rebuild();playStart=performance.now();playT=0;$('#cine').classList.add('full');music();watched=true}
$('#bPlay').onclick=()=>{rebuild();playStart=performance.now();playT=0;$('#cine').classList.add('full');music();watched=true};
$('#cine').addEventListener('click',()=>{if(playT>=0){playT=-1;endPlay()}});
function endPlay(){if(PLAYER){try{parent.postMessage({introEnd:1},'*')}catch(e){}return}$('#cine').classList.remove('full');rebuild()}
function cubiEnd(){try{if(parent!==window)parent.postMessage({cubiEvt:'end'},'*')}catch(e){}}
$('#bDeliver').onclick=()=>{if(mode==='libre'){toast('En modo libre no hay cliente: ¡disfruta tu intro!');return}if(!watched){toast('Primero mira tu intro con ▶ VER INTRO');return}
  const J=job(),met=J.req.filter(reqMet).length,stars=met===J.req.length?3:met>=J.req.length-1?2:met>0?1:0,pay=stars*20+(stars===3?20:0);
  save.cubos+=pay;save.best[J.co]=Math.max(save.best[J.co]||0,stars);const next=stars>0;if(next)save.job++;persist();cubiEnd();
  $('#ovl').innerHTML=`<div class="ov"><div class="card" role="dialog" aria-modal="true"><h2>${stars===3?'¡BRUTAL!':stars===2?'¡MOLA!':stars===1?'¡VALE!':'¡UPS!'}</h2>
    <div class="stars" aria-label="${stars} estrellas"><i>${'★'.repeat(stars)}</i>${'★'.repeat(3-stars)}</div>
    <p>${esc(CO[J.co].n)}: ${stars===3?'«¡Es justo lo que queríamos!»':stars===0?'«Esto no se parece a lo que pedimos.»':'«Nos gusta, aunque faltan cosas.»'}</p>
    <p>${J.req.map(r=>(reqMet(r)?'✓ ':'✗ ')+reqTxt(r)).join(' · ')}</p><p><b style="color:#fff">+${pay} puntos</b> · Total: ${save.cubos}</p>
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="b h" id="oNext">${next?'Siguiente encargo':'Volver a intentarlo'}</button></div></div></div>`;
  $('#oNext').onclick=()=>{$('#ovl').innerHTML='';watched=false;if(next){cfg.fx=[];cfg.esl=''}setLogo();side()}};
$('#bMode').onclick=()=>{mode=mode==='encargo'?'libre':'encargo';$('#bMode').textContent=mode==='encargo'?'Modo libre':'Encargos';$('#bDeliver').hidden=mode==='libre';setLogo();side()};
addEventListener('keydown',e=>{if(e.key==='Escape'&&playT>=0){playT=-1;endPlay()}});
document.fonts&&document.fonts.ready.then(()=>{for(const k in thumbs)delete thumbs[k];if(!new URLSearchParams(location.search).get('ver')){setLogo();side()}else if(playT<0)setLogo()});
/* ---------- guardar intros para usarlas en otros juegos (Creador de videojuegos 2D) ---------- */
const IKEY='cubi-intros';const loadIntros=()=>{try{return JSON.parse(localStorage.getItem(IKEY)||'[]')||[]}catch(e){return []}};
$('#bSaveI').onclick=()=>{const def=mode==='encargo'?'Intro de '+CO[job().co].n:cfg.src==='txt'?'Intro de '+cfg.text:'Mi intro';
  $('#ovl').innerHTML=`<div class="ov"><div class="card" role="dialog" aria-modal="true" aria-labelledby="sv"><h2 id="sv" style="font-size:26px">GUARDAR INTRO</h2><p>Podrás ponerla al principio de tus juegos en el Creador de videojuegos 2D.</p>
    <input class="in" id="iName" maxlength="28" value="${esc(def)}" aria-label="Nombre de la intro"><div style="display:flex;gap:8px;justify-content:center"><button class="b h" id="iOk">Guardar</button><button class="b" id="iNo">Cancelar</button></div></div></div>`;
  $('#iNo').onclick=()=>$('#ovl').innerHTML='';
  $('#iOk').onclick=()=>{const name=($('#iName').value||'').trim()||'Mi intro';const c=Object.assign({},cfg,{fx:cfg.fx.slice()});if(mode==='encargo'){c.src='co';c.logo=job().co}
    let imgData=null;if(c.src==='img'&&img){const k=cnv(256,256);k.getContext('2d').drawImage(img,0,0,256,256);imgData=k.toDataURL('image/png')}
    const L=loadIntros().filter(i=>i.name!==name);L.unshift({id:'in'+Date.now().toString(36),name,cfg:c,imgData,created:Date.now()});
    try{localStorage.setItem(IKEY,JSON.stringify(L.slice(0,20)));toast('Intro guardada: «'+name+'»')}catch(e){toast('No se ha podido guardar (¿imagen muy grande?)')}$('#ovl').innerHTML=''}};
/* ---------- modo reproductor: otro juego abre esta página con ?ver=ID ---------- */
const PLAYER=new URLSearchParams(location.search).get('ver');
if(PLAYER){const it=loadIntros().find(i=>i.id===PLAYER);document.querySelector('.side').hidden=true;document.querySelector('.brief').hidden=true;document.querySelector('.ctrl').hidden=true;
  if(!it){try{parent.postMessage({introEnd:1},'*')}catch(e){}}
  else{mode='libre';cfg=Object.assign(cfg,it.cfg);const go=()=>{$('#cine').classList.add('full');const a=ac();if(a&&a.state!=='running'){$('#ovl').innerHTML='<div class="ov" id="tapGo" style="cursor:pointer"><button class="b h" style="font-size:22px">▶ Ver la intro</button></div>';$('#tapGo').onclick=()=>{$('#ovl').innerHTML='';ac();startIntro()}}else startIntro()};
    if(it.imgData){const im=new Image();im.onload=()=>{const c=cnv(512,512);c.getContext('2d').drawImage(im,0,0,512,512);img=c;setLogo();go()};im.src=it.imgData}else{setLogo();go()}}}
else{setLogo();side()}
