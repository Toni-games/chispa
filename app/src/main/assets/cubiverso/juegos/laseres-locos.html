<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Láseres Locos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
body{background:#120a24}
.pad{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:20;display:none;gap:12px}
body.k-touch .pad{display:flex}
.pad button{width:74px;height:74px;border-radius:50%;border:3px solid #000;font:900 26px system-ui;color:#000;touch-action:none;box-shadow:inset 0 -5px 0 rgba(0,0,0,.25)}

</style>
<script src="../cursor.js"></script>
</head>
<body>
<canvas id="c"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../graficos.js"></script>
<script src="../avatar.js"></script>
<script src="../kit.js"></script>
<script src="../audio.js"></script>
<script src="comun.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="../multi.js"></script>
<script src="../sala.js"></script>
<script>
const K=Kit,J=Juego,$=s=>document.querySelector(s);
addEventListener('touchstart',()=>document.body.classList.add('k-touch'),{once:true,passive:true});

/* Láseres Locos: arena redonda con láseres que barren el suelo (sáltalos) y muros láser con un hueco que cruzan la arena (pasa por el hueco). */
const {renderer,scene,camera,sun,hemi}=K.setup({sky:0x120a24,fogNear:50,fogFar:120});hemi.intensity=.9;
const AR=13;
const floor=K.cyl(AR,AR,1,K.M(0x2b3047),0,-.5,0,scene,48);floor.receiveShadow=true;
for(let i=0;i<4;i++){const r=new THREE.Mesh(new THREE.RingGeometry(3+i*2.6,3.15+i*2.6,48),new THREE.MeshBasicMaterial({color:0x5a6390}));r.rotation.x=-Math.PI/2;r.position.y=.02;scene.add(r)}
const edge=new THREE.Mesh(new THREE.TorusGeometry(AR,.25,8,64),new THREE.MeshBasicMaterial({color:0x22d3ee}));edge.rotation.x=Math.PI/2;edge.position.y=.1;scene.add(edge);
const tower=K.cyl(1.1,1.4,2.4,K.M(0x1f2937),0,1.2,0,scene);const eye=K.sph(.6,new THREE.MeshBasicMaterial({color:0xff2d55}),0,2.6,0,scene);
const ctl=K.controls(renderer.domElement,{dist:17,pitch:.75,yaw:0});
const P=J.player(scene,ctl,{speed:8.5,jump:11,grav:30,bound:999,floorFn:(x,z)=>Math.hypot(x,z)<AR?0:null,noFloor:true,boxes:[{x0:-1.1,x1:1.1,z0:-1.1,z1:1.1,top:2.4}]});K.emotes(P.a);
P.x=0;P.z=7;
const LM=new THREE.MeshBasicMaterial({color:0xff2d55}),LM2=new THREE.MeshBasicMaterial({color:0xff2d55,transparent:true,opacity:.35});
let beams=[],walls=[],coins=[],running=false,T=0,lives=3,inv=0,got=0,next=2,R=Math.random,phase=1;
function sweep(speed,h){const g=new THREE.Group();const core=K.box(AR,.18,.18,LM,AR/2,0,0,g);const glow=K.box(AR,.5,.5,LM2,AR/2,0,0,g);g.position.y=h;scene.add(g);
  const b={g,ang:R()*6,speed,h,life:10+R()*6,t:0};beams.push(b);J.sfx('laser');return b}
function wall(){const g=new THREE.Group();const gap=3.2,gp=(R()*2-1)*(AR-4),dir=R()<.5?1:-1,axis=R()<.5?'x':'z';
  [[-AR,gp-gap/2],[gp+gap/2,AR]].forEach(([u0,u1])=>{for(let k=0;k<4;k++){const len=u1-u0;const m=K.box(len,.12,.12,LM,(u0+u1)/2,.35+k*.75,0,g);K.box(len,.35,.35,LM2,(u0+u1)/2,.35+k*.75,0,g)}});
  if(axis==='z')g.rotation.y=Math.PI/2;g.position[axis==='x'?'z':'x']=-dir*(AR+1);scene.add(g);walls.push({g,axis,dir,pos:-dir*(AR+1),gp,gap,speed:4+phase*.4});J.sfx('alarm');K.toast('¡MURO LÁSER!','Busca el hueco','#ff2d55')}
function coin(){const a=R()*6,d=3+R()*(AR-4);const m=K.cyl(.45,.45,.12,K.M(0xffcc33,{emissive:0x553300}),Math.cos(a)*d,1,Math.sin(a)*d,scene);m.rotation.x=Math.PI/2;coins.push(m)}
function reset(sd){R=sd?Sala.rng(sd):Math.random;beams.forEach(b=>scene.remove(b.g));walls.forEach(w=>scene.remove(w.g));coins.forEach(c=>scene.remove(c));beams=[];walls=[];coins=[];
  T=0;lives=3;inv=0;got=0;next=2;phase=1;P.x=0;P.z=7;P.y=0;P.vx=P.vz=P.vy=0;for(let i=0;i<5;i++)coin()}
function hurt(){if(inv>0)return;lives--;inv=1.5;J.sfx('hit');P.vy=7;K.toast('¡ZAS!',lives>0?'Te quedan '+lives+(lives===1?' vida':' vidas'):'','#ff2d55');if(lives<=0)over()}
function over(){running=false;J.sfx('lose');const score=Math.floor(T)*10+got*15;const rec=J.saveBest('laseres',score,true);if(window.Sala)Sala.score(score,Math.floor(T)+' s');
  setTimeout(()=>J.end({title:'¡FRITO POR LOS LÁSERES!',col:'#ff2d55',lines:[`Aguantaste <b style="color:#ffcc33">${Math.floor(T)} s</b> · Monedas: ${got}`,`Puntos: <b style="color:#ffcc33">${score}</b>`,`Récord: ${J.best('laseres')}`],record:rec,onAgain(){reset();running=true}}),800)}
let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;
  if(running){T+=dt;inv=Math.max(0,inv-dt);phase=1+Math.floor(T/20);next-=dt;
    if(next<=0){const r=R();if(r<.62||T<8)sweep((R()<.5?1:-1)*(1+phase*.25+R()*.4),R()<.3&&T>25?1.7:.45);else wall();next=Math.max(1.6,4.2-phase*.45)+R()*1.5}
    if(coins.length<5&&R()<dt*.6)coin()}
  P.frozen=!running;P.update(dt,camera,1.2);if(running&&P.y<-4){P.x=0;P.z=6;P.y=0;P.vy=0;hurt()}
  P.a.root.visible=!(inv>0&&Math.floor(t/90)%2);
  const pa=Math.atan2(P.z,P.x),pd=Math.hypot(P.x,P.z);
  for(let i=beams.length-1;i>=0;i--){const b=beams[i];b.t+=dt;b.ang+=b.speed*dt;b.g.rotation.y=-b.ang;
    if(running&&pd>1.3){let d=Math.abs(((pa-b.ang)%(Math.PI*2)+Math.PI*3)%(Math.PI*2)-Math.PI);const arc=d*pd;
      const tall=b.h>1;if(arc<.45&&(tall?P.y+1.6>b.h-.2&&P.y<b.h+.2&&P.y<1.2:P.y<b.h+.15))hurt()}
    if(b.t>b.life){b.g.scale.y=Math.max(.01,1-(b.t-b.life)*3);if(b.t>b.life+.35){scene.remove(b.g);beams.splice(i,1)}}}
  for(let i=walls.length-1;i>=0;i--){const w=walls[i];if(running)w.pos+=w.dir*w.speed*dt;if(w.axis==='x')w.g.position.z=w.pos;else w.g.position.x=w.pos;
    const across=w.axis==='x'?P.z:P.x,along=w.axis==='x'?P.x:P.z;const sgn=w.axis==='x'?1:-1;
    if(running&&Math.abs(across-w.pos)<.4&&Math.abs(along*sgn-w.gp)>w.gap/2-.35&&P.y<3)hurt();
    if(Math.abs(w.pos)>AR+2&&Math.sign(w.pos)===w.dir){scene.remove(w.g);walls.splice(i,1)}}
  for(let i=coins.length-1;i>=0;i--){const c=coins[i];c.rotation.z+=dt*3;if(running&&Math.hypot(P.x-c.position.x,P.z-c.position.z)<1.1&&P.y<2){got++;J.sfx('coin');scene.remove(c);coins.splice(i,1)}}
  eye.scale.setScalar(1+Math.sin(t/150)*.1);edge.material.color.setHSL((t/4000)%1,.8,.6);
  if(running){J.hud([['Tiempo',Math.floor(T)+' s'],['Monedas',got],['Vidas','♥'.repeat(Math.max(0,lives))],['Nivel',phase]]);if(window.Sala&&Math.floor(T)!==Math.floor(T-dt))Sala.score(Math.floor(T)*10+got*15,Math.floor(T)+' s')}
  renderer.render(scene,camera);requestAnimationFrame(loop)}
Sala.init({game:'laseres',scene,me:P.a,getState:()=>({x:+P.x.toFixed(2),y:+P.y.toFixed(2),z:+P.z.toFixed(2),ry:+P.face.toFixed(2),air:!P.ground}),board:{label:'Puntos'},
  shared:'Al empezar todos a la vez, los láseres salen igual para todos. ¡A ver quién aguanta más!',onStart(sd){J.closePanels();reset(sd);running=true}});
reset();J.music('neon');
J.start({title:'LÁSERES LOCOS',col:'#ff2d55',sub:'La torre del centro dispara láseres que barren la arena. Salta los que van por el suelo, quédate abajo con los altos y pasa por el hueco de los muros láser.',
  howto:['<b>WASD</b> o joystick para moverte, <b>ESPACIO</b> para saltar','Láser bajo: sáltalo · Láser alto: quédate en el suelo','Muro láser: colócate en el hueco antes de que llegue','3 vidas. Cada segundo vale 10 puntos y cada moneda 15'],
  record:J.best('laseres')!=null?J.best('laseres')+' puntos':null,onStart(){running=true}});
requestAnimationFrame(loop);

</script>
</body>
</html>
