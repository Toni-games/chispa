<body>
<title>Barrio Tycoon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap">
<style>
/* Layout: estilo tycoon de Roblox. Mundo 3D a pantalla completa, dinero arriba al centro, botones cuadrados a la izquierda, tienda de construcción abajo */
:root{
  --panel:rgba(25,27,32,.86); --panel2:rgba(255,255,255,.08); --stroke:#000; --ink:#ffffff; --muted:#c9ced8;
  --green:#3fd15c; --green2:#22a33a; --gold:#ffcc33; --red:#ff4f4f; --red2:#c42b2b; --blue:#3fa7ff; --blue2:#1f7fd1;
  --f:"Montserrat","Arial Black","Segoe UI",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;margin:0}
body{background:#8fd0ff;color:var(--ink);font-family:var(--f);font-weight:800;font-size:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.ui{position:fixed;z-index:5}
.out{-webkit-text-stroke:1.5px #000;paint-order:stroke fill;text-shadow:0 2px 0 #000}
/* dinero */
#cashbox{top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none}
#cash{font-size:clamp(28px,5vw,40px);font-weight:900;color:var(--green);line-height:1;font-variant-numeric:tabular-nums}
#rate{font-size:14px;color:#fff;margin-top:2px}
#lvlpill{margin-top:6px;display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:999px;padding:4px 12px 4px 4px;border:2px solid #000}
#lvlpill b{background:var(--gold);color:#3a2600;border-radius:999px;min-width:28px;height:28px;display:grid;place-items:center;font-weight:900}
#lvlpill .xb{width:110px;height:8px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden}
#lvlpill .xb i{display:block;height:100%;background:var(--gold)}
/* botones laterales */
#side{left:max(10px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px}
.sq{width:68px;height:68px;border-radius:14px;border:3px solid #000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:900;box-shadow:inset 0 -6px 0 rgba(0,0,0,.25)}
.sq svg{width:28px;height:28px}
.sq.g{background:var(--green)}.sq.b{background:var(--blue)}.sq.y{background:var(--gold);color:#3a2600}.sq.r{background:var(--red)}.sq.k{background:#555c6a}
.sq.on{outline:3px solid #fff;outline-offset:2px}
/* tienda de construcción */
#build{left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);width:min(900px,calc(100vw - 20px));background:var(--panel);border:3px solid #000;border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px}
.bhead{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tab{border:2px solid #000;background:#3a3f4a;border-radius:10px;padding:6px 12px;font-size:12px;font-weight:900;box-shadow:inset 0 -3px 0 rgba(0,0,0,.3)}
.tab.on{background:var(--blue)}
.spacer{flex:1}
.tbtn{border:2px solid #000;border-radius:10px;padding:6px 12px;font-size:12px;font-weight:900;box-shadow:inset 0 -3px 0 rgba(0,0,0,.3)}
.tbtn.on{outline:2px solid #fff;outline-offset:1px}
.close{width:34px;height:34px;border-radius:10px;border:2px solid #000;background:var(--red);font-weight:900;font-size:16px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.3)}
.items{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.item{flex:0 0 118px;border:3px solid #000;border-radius:12px;background:#2b2f38;padding:6px;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.3)}
.item.on{background:#2d5e9a;border-color:#fff}
.item .pv{width:100%;height:58px;border-radius:8px;display:grid;place-items:end center;overflow:hidden;position:relative}
.item .nm{font-size:12px;font-weight:900;text-align:center;line-height:1.1}
.item .pr{font-size:13px;font-weight:900;color:var(--green)}
.item .in{font-size:10px;color:var(--muted)}
/* ficha */
#info{right:max(10px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 12px);width:min(250px,calc(100vw - 110px));background:var(--panel);border:3px solid #000;border-radius:14px;padding:12px}
#info h3{margin:0;font-size:18px;font-weight:900}
#info p{margin:4px 0 8px;color:var(--muted);font-size:12px;line-height:1.35;font-weight:700}
.stars{color:var(--gold);font-size:18px;letter-spacing:2px}
.kv{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-top:1px solid rgba(255,255,255,.12)}
.big{display:block;width:100%;border:3px solid #000;border-radius:12px;padding:10px;font-weight:900;font-size:14px;margin-top:8px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.25)}
.big.g{background:var(--green)}.big.r{background:var(--red)}.big.b{background:var(--blue)}
/* prompt y táctil */
#prompt{left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:var(--panel);border:2px solid #000;border-radius:12px;padding:8px 12px;font-size:13px}
#prompt kbd{background:#fff;color:#000;border-radius:6px;padding:2px 8px;font-family:var(--f);font-weight:900}
#joy{left:max(18px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 24px);width:124px;height:124px;border-radius:50%;background:rgba(0,0,0,.25);border:3px solid rgba(255,255,255,.4);display:none;touch-action:none}
#joy i{position:absolute;left:36px;top:36px;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.6)}
#jump{right:max(22px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 34px);width:86px;height:86px;border-radius:50%;background:rgba(255,255,255,.75);color:#000;border:3px solid #000;font-weight:900;display:none;touch-action:none}
body.touch.walk #joy,body.touch.walk #jump,body.touch.build #joy,body.touch.build #jump,body.touch.drive #joy{display:block}
body.build #joy,body.build #jump{bottom:calc(env(safe-area-inset-bottom,0px) + 215px)}
body.build #hint{bottom:calc(env(safe-area-inset-bottom,0px) + 200px)}
body.build #prompt{bottom:calc(env(safe-area-inset-bottom,0px) + 230px)}
body.touch.drive #jump{display:block}
#speedo{bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:50%;transform:translateX(-50%);font-size:24px;font-weight:900;display:none}
body.drive #speedo{display:block}
body.touch.drive #speedo{bottom:calc(env(safe-area-inset-bottom,0px) + 160px)}
#tip{pointer-events:none;background:#000;color:#fff;border-radius:8px;padding:4px 8px;font-size:12px;white-space:nowrap;transform:translate(14px,14px)}
#toast{top:24%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;transition:opacity .3s;opacity:0;width:90vw}
#toast b{display:block;font-size:clamp(24px,5vw,36px);font-weight:900;color:var(--gold)}
#toast span{font-size:15px}
#hint{bottom:calc(env(safe-area-inset-bottom,0px) + 12px);left:50%;transform:translateX(-50%);font-size:12px;white-space:nowrap;pointer-events:none}
body.touch #hint{display:none}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:20;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.panel{background:#22252c;border:4px solid #000;border-radius:18px;padding:0;max-width:540px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 10px 0 rgba(0,0,0,.4)}
.ph{display:flex;align-items:center;justify-content:space-between;background:var(--blue);border-bottom:4px solid #000;padding:10px 14px;border-radius:14px 14px 0 0}
.ph h2{margin:0;font-size:24px;font-weight:900}
.pb{padding:16px}
.pb p{line-height:1.5;margin:0 0 10px;font-weight:700;color:var(--muted)}
.pb ul{padding-left:18px;line-height:1.6;margin:0 0 14px;font-weight:700}
.maps{display:grid;gap:10px}
.mapc{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center;border:3px solid #000;border-radius:12px;padding:8px;background:#2b2f38}
.mapc.cur{border-color:#fff}
.mapc .sw{width:76px;height:56px;border-radius:8px;border:2px solid #000}
.mapc b{font-size:17px;font-weight:900}
.mapc span{display:block;color:var(--muted);font-size:12px;font-weight:700}
.sbtn{border:3px solid #000;border-radius:10px;padding:8px 14px;font-weight:900;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25);background:var(--green)}
.sbtn.k{background:#555c6a}.sbtn.r{background:var(--red)}
.pay{margin-top:4px;width:160px;height:8px;border-radius:4px;background:rgba(0,0,0,.35);border:2px solid #000;overflow:hidden}
.pay i{display:block;height:100%;background:var(--green)}
#cog{right:max(10px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 10px)}
body.build #cog{display:none}
.stat{display:grid;grid-template-columns:110px 1fr 46px;gap:10px;align-items:center;padding:6px 0;border-top:1px solid rgba(255,255,255,.08);font-size:13px}
.stat .bar{height:14px;border-radius:7px;background:rgba(255,255,255,.1);border:2px solid #000;overflow:hidden}
.stat .bar i{display:block;height:100%}
.stat b{text-align:right;font-variant-numeric:tabular-nums}
.pass{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:10px;border:3px solid #000;border-radius:12px;background:#2b2f38;margin-bottom:8px}
.pass .ic{width:56px;height:56px;border-radius:10px;border:2px solid #000;display:grid;place-items:center;font-size:20px;font-weight:900}
.pass span{display:block;color:var(--muted);font-size:12px;font-weight:700}
.price{color:var(--green);font-size:12px}
.code{display:flex;gap:8px;margin:6px 0 12px}
.code input{flex:1;min-width:0;border:3px solid #000;border-radius:10px;padding:8px 10px;font:inherit;font-weight:800;background:#fff;color:#000;text-transform:uppercase}
.chip{display:inline-block;background:rgba(255,255,255,.1);border-radius:6px;padding:1px 6px;font-size:10px;margin-top:1px}
@media (max-width:640px){
  .sq{width:56px;height:56px;font-size:9px}.sq svg{width:22px;height:22px}
  #side{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 160px);transform:none}
  body.build #side{display:none}
  #info{top:calc(env(safe-area-inset-top,0px) + 96px)}
  .item{flex-basis:100px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

let income=0,prod=[],stats={},happy=1,pop=0,jobs=0;
function connected(x,z){return isRoad(x+1,z)||isRoad(x-1,z)||isRoad(x,z+1)||isRoad(x,z-1)}
function parkBoost(x,z){let n=0;for(let dz=-1;dz<=1;dz++)for(let dx=-1;dx<=1;dx++){if((dx||dz)&&inb(x+dx,z+dz)&&grid[idx(x+dx,z+dz)].t==='park')n++}return 1+Math.min(.6,n*.2)}
function baseIncome(x,z){const c=grid[idx(x,z)];if(!B[c.t]||!B[c.t].inc||!connected(x,z))return 0;return incOf(c.t,c.lv)*parkBoost(x,z)*MAP.mult}
const happyMult=()=>.4+.9*happy;
let demand=0;
const NEEDS=t=>{const T=B[t];return T&&T.inc&&(T.cat==='comer'||T.cat==='ocio')};
function tileFactor(t){const T=B[t];if(!T)return 0;if(T.pop)return stats.empleo||0;if(NEEDS(t))return demand;return 1}
function tileIncome(x,z){return baseIncome(x,z)*happyMult()*tileFactor(grid[idx(x,z)].t)}
function popNear(x,z,r){let n=0;for(let dz=-r;dz<=r;dz++)for(let dx=-r;dx<=r;dx++){const a=x+dx,b=z+dz;if(!inb(a,b))continue;const c=grid[idx(a,b)],T=B[c.t];if(T&&T.pop&&connected(a,b))n+=T.pop[c.lv]}return n}
function recalc(){
  pop=0;jobs=0;const cap={agua:0,luz:0,salud:0,edu:0,seg:0,fuego:0,fun:0,trans:0};
  grid.forEach((c,i)=>{const x=i%N,z=Math.floor(i/N),T=B[c.t];if(!T||c.t==='deco')return;const ok=c.t==='road'||c.t==='park'||T.cat==='trans'||connected(x,z);if(!ok)return;
    if(T.pop)pop+=T.pop[c.lv];if(T.jobs)jobs+=T.jobs*c.lv;if(T.svc)cap[T.svc]+=T.cap*c.lv});
  (vehs||[]).forEach(v=>cap.trans+=VEH[v.k].cap);
  stats={empleo:pop?Math.min(1,jobs/pop):1};for(const k in cap)stats[k]=pop?Math.min(1,cap[k]/pop):1;
  if(!pop)stats.empleo=0;
  happy=Object.values(stats).reduce((a,b)=>a+b,0)/Object.keys(stats).length;
  let need=0;grid.forEach((c,i)=>{if(NEEDS(c.t)&&connected(i%N,Math.floor(i/N)))need+=incOf(c.t,c.lv)*3});
  demand=need?Math.min(1,pop/need):0;
  income=0;prod=[];
  grid.forEach((c,i)=>{const x=i%N,z=Math.floor(i/N);const pb=B[c.t]&&B[c.t].inc&&c.t!=='deco',ok=!pb||connected(x,z);
    if(pb){const v=tileIncome(x,z);income+=v;if(v)prod.push(i)}
    if(warns[i]&&ok){scene.remove(warns[i]);warns[i]=null}
    if(pb&&!ok&&!warns[i]){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:warnTex,depthTest:false}));s.scale.set(1.6,1.6,1);s.renderOrder=5;const[wx,wz]=tpos(x,z);s.position.set(wx,6,wz);scene.add(s);warns[i]=s}});
  if(has('x2'))income*=2;
}

function moverStep(m,dt){
  if(!isRoad(m.x,m.z))return false;
  m.t+=dt*m.sp;
  while(m.t>=1){
    const nx=m.x+m.outD[0],nz=m.z+m.outD[1];
    if(!isRoad(nx,nz))return false;
    m.x=nx;m.z=nz;m.inD=[-m.outD[0],-m.outD[1]];m.t-=1;
    let o=roadNb(m.x,m.z).filter(([a,b])=>!(a===m.inD[0]&&b===m.inD[1]));if(!o.length)o=roadNb(m.x,m.z);
    m.outD=pick(o);
  }
  // bezier entre bordes
  const[cx,cz]=tpos(m.x,m.z),h=TS/2;
  const p0=[cx+m.inD[0]*h,cz+m.inD[1]*h],p2=[cx+m.outD[0]*h,cz+m.outD[1]*h],t=m.t,u=1-t;
  const px=u*u*p0[0]+2*u*t*cx+t*t*p2[0],pz=u*u*p0[1]+2*u*t*cz+t*t*p2[1];
  const tx=2*u*(cx-p0[0])+2*t*(p2[0]-cx),tz=2*u*(cz-p0[1])+2*t*(p2[1]-cz);
  const l=Math.hypot(tx,tz)||1,nx=-tz/l,nz=tx/l;
  m.g.position.set(px-nx*m.off,0,pz-nz*m.off);m.g.rotation.y=Math.atan2(tx,tz);
  return true;
}

function vehStep(v,dt){

  if(v.wait>0){v.wait-=dt;return}
  if(!isT(v.x,v.z))return;
  v.t+=dt*v.sp;
  while(v.t>=1){
    const nx=v.x+v.outD[0],nz=v.z+v.outD[1];
    if(!isT(nx,nz)){const o=dirs4.filter(([a,b])=>isT(v.x+a,v.z+b));if(!o.length){v.t=.5;break}v.inD=[...v.outD];v.outD=pick(o);v.t=0;break}

    let o=dirs4.filter(([a,b])=>!(a===v.inD[0]&&b===v.inD[1])&&isT(v.x+a,v.z+b));if(!o.length)o=[v.inD];

function placeVeh(v){

  const tx=2*u*(cx-p0[0])+2*t*(p2[0]-cx),tz=2*u*(cz-p0[1])+2*t*(p2[1]-cz);
  const l=Math.hypot(tx,tz)||1,nx=-tz/l,nz=tx/l;

  const[wx,wz]=tpos(x,z);selRing.visible=true;selRing.position.set(wx,.08,wz);
  const ok=!T.inc||connected(x,z),boost=parkBoost(x,z);
  let h=`<h3 class="out">${T.name}</h3><div class="stars out">${'★'.repeat(c.lv)}${'☆'.repeat(T.max-c.lv)}</div>`;
  if(T.inc)h+=`<div class="kv"><span>Gana</span><b style="color:${ok?'var(--green)':'var(--red)'}">${ok?fmt(tileIncome(x,z)*5)+' / 5 s':'Sin carretera'}</b></div>`;
  if(T.inc&&ok&&tileIncome(x,z)<=0)h+=`<p style="color:var(--red)">${T.pop?'Sus vecinos no tienen trabajo: construye tiendas, cafeterías u oficinas.':'No tiene clientes: construye casas o pisos cerca.'}</p>`;
  else if(T.inc&&ok&&T.pop&&stats.empleo<1)h+=`<p>Solo trabaja el ${Math.round(stats.empleo*100)}% de los vecinos.</p>`;
  else if(T.inc&&ok&&NEEDS(c.t)&&demand<1)h+=`<p>Solo tiene el ${Math.round(demand*100)}% de los clientes que necesita.</p>`;
  if(boost>1&&T.inc)h+=`<div class="kv"><span>Bonus parques</span><b>+${Math.round((boost-1)*100)}%</b></div>`;
  if(T.pop)h+=`<div class="kv"><span>Vecinos</span><b>${T.pop[c.lv]}</b></div>`;
  if(T.jobs)h+=`<div class="kv"><span>Trabajos</span><b>${T.jobs*c.lv}</b></div>`;
  if(T.svc)h+=`<div class="kv"><span>Cubre</span><b>${T.cap*c.lv} vecinos</b></div>`;
  if(c.lv<T.max){const nc=upCost(c.t,c.lv);h+=`<button class="big g out" data-act="upgrade" ${S.cash<nc?'disabled':''}>MEJORAR · ${nc?fmt(nc):'GRATIS'}</button>`}
  else if(T.max>1)h+=`<p>Nivel máximo.</p>`;
  if(c.t!=='road')h+=`<button class="big b out" data-act="rotate">GIRAR</button>`;
  h+=`<button class="big r out" data-act="demolish">DERRIBAR</button>`;
  el.hidden=false;el.innerHTML=h;
}
function toast(a,b){const t=document.getElementById('toast');document.getElementById('tb').textContent=a;document.getElementById('ts').textContent=b||'';t.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.opacity=0,2400)}
const ov=document.getElementById('ov');
const panel=(title,body,col)=>`<div class="overlay"><div class="panel"><div class="ph" style="${col?'background:'+col:''}"><h2 class="out">${title}</h2><button class="close out" data-act="close" aria-label="Cerrar">X</button></div><div class="pb">${body}</div></div></div>`;
function mapsHTML(){return panel('MAPAS',`<p>Cada mapa guarda su propia ciudad. Están todos desbloqueados.</p><div class="maps">${MAPS.map(m=>{const cur=m.id===MAP.id,sk='#'+m.sky.toString(16).padStart(6,'0'),gr='#'+m.ground.toString(16).padStart(6,'0');
  return `<div class="mapc ${cur?'cur':''}"><div class="sw" style="background:linear-gradient(180deg,${sk} 50%,${gr} 50%)"></div><div><b class="out">${m.name}</b><span>${m.desc}</span></div>${cur?'<button class="sbtn k out" disabled>AQUÍ</button>':`<button class="sbtn out" data-act="gomap" data-id="${m.id}">IR</button>`}</div>`}).join('')}</div>`,'var(--gold)')}
function statsHTML(){
  return panel('ESTADÍSTICAS',`<div class="kv" style="border:0"><span>Vecinos</span><b>${pop}</b></div><div class="kv"><span>Trabajos</span><b>${jobs}</b></div>
  <div class="stat" style="font-size:15px"><span>Felicidad</span><span class="bar"><i style="width:${happy*100}%;background:linear-gradient(90deg,#ff4f4f,#ffcc33,#3fd15c)"></i></span><b>${Math.round(happy*100)}%</b></div>
  ${STATS.map(([k,n,col])=>`<div class="stat"><span>${n}</span><span class="bar"><i style="width:${stats[k]*100}%;background:${col}"></i></span><b>${Math.round(stats[k]*100)}%</b></div>`).join('')}
  <p style="margin-top:12px">Cuanto más alta la felicidad, más cobras: ahora mismo ganas un <b style="color:var(--green)">${Math.round(happyMult()*100)}%</b>. Construye servicios cuando se queden cortos.</p>`,'var(--gold)')}
function shopHTML(){
  return panel('TIENDA',`<p>En Roblox estos pases costarían Robux. Aquí puedes activarlos gratis para probarlos.</p>
  ${PASSES.map(p=>`<div class="pass"><div class="ic out" style="background:${p.col}">${p.ic}</div><div><b class="out">${p.name}</b> <span class="price" style="display:inline">R$ ${p.price}</span><span>${p.desc}</span></div>
  <button class="sbtn ${has(p.id)?'k':''} out" data-act="pass" data-id="${p.id}">${has(p.id)?'QUITAR':'PROBAR'}</button></div>`).join('')}`,'var(--red)')}
function introHTML(off){return panel('BARRIO TYCOON',`${off?`<p style="color:var(--green)">Mientras no estabas has ganado ${fmt(off)}.</p>`:''}
  <p>Empiezas en un terreno completamente vacío, con todo desbloqueado y $250.000. ¡Construye la ciudad más grande!</p>
  <ul><li>Anda por el mapa con tu personaje (WASD, Espacio para saltar). Puedes atravesarlo todo.</li><li>Pulsa <b>Construir</b> (o la tecla B): sigues andando y construyes donde apuntas con el ratón.</li><li>Con <b>Tamaño</b> (o la tecla Z) te haces Mini, Normal, Grande o Gigante. En Mini o Normal puedes <b>entrar en casas</b>, tiendas, colegios, hospitales, estaciones…</li><li>En <b>Transporte</b> compras vías, estaciones, trenes, tranvías, autobuses y taxis. Colócalos sobre las vías o carreteras y harán su recorrido, cobrando en cada parada.</li><li>Solo puedes construir dentro de tu terreno (el borde blanco). Amplíalo desde la tienda de construcción.</li><li>Cobras cada 5 segundos, pero solo si tu ciudad tiene vida: las casas pagan si sus vecinos tienen trabajo, las tiendas y el ocio necesitan clientes, y los transportes necesitan pasajeros cerca. Mira los <b>Datos</b>: si faltan agua, luz, colegios o diversión, tus vecinos están menos felices y cobras menos.</li><li>Pulsa R para girar edificios y usa Mover para cambiarlos de sitio.</li><li>Pulsa <b>Coche</b> para conducir y recoger bolsas de dinero. Con E te bajas y te subes.</li></ul>
  <button class="sbtn out" data-act="play">¡JUGAR!</button>`)}
function menuHTML(){return panel('AJUSTES',`<p>Códigos</p>
  <div class="code"><input id="codein" maxlength="20" placeholder="Escribe un código" autocomplete="off"><button class="sbtn out" data-act="code" aria-label="Canjear">✓</button></div>
  <p style="font-size:12px">Prueba: BARRIO, CIUDAD, TYCOON.</p>
  <p>La partida se guarda sola en este navegador. Mientras no juegas, la ciudad gana la mitad (máx. 2 horas).</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="sbtn out" data-act="full">Pantalla completa</button><button class="sbtn out" data-act="money">+$1.000.000</button><button class="sbtn r out" data-act="resetask">Empezar de cero</button></div><div id="confirm"></div>`,'#555c6a')}
function enterCar(){myCarParked=false;setMode('drive');document.getElementById('prompt').hidden=true}
function goFull(on){if(typeof PLAT!=='undefined'&&PLAT)return;const d=document,el=d.documentElement;try{if(on){const f=el.requestFullscreen||el.webkitRequestFullscreen;if(f&&!(d.fullscreenElement||d.webkitFullscreenElement)){const r=f.call(el);if(r&&r.catch)r.catch(()=>toast('PANTALLA COMPLETA','Tu navegador no lo permite aquí'))}}else{const x=d.exitFullscreen||d.webkitExitFullscreen;if(x&&(d.fullscreenElement||d.webkitFullscreenElement))x.call(d)}}catch(e){}}
const ACT={
  close(){ov.innerHTML=''},
  play(){ov.innerHTML='';goFull(true)},
  full(){const on=!(document.fullscreenElement||document.webkitFullscreenElement);goFull(on);ov.innerHTML=''},
  build(){if(mode==='drive')exitCar();setMode(mode==='build'?'walk':'build')},
  car(){if(mode==='drive'){exitCar();return}if(mode==='build')setMode('walk');if(nearCar())enterCar();else spawnCar()},
  enter(){enterCar()},
  maps(){ov.innerHTML=mapsHTML()},
  stats(){ov.innerHTML=statsHTML()},
  shop(){ov.innerHTML=shopHTML()},
  pass(id){if(has(id))delete S.passes[id];else S.passes[id]=1;recalc();renderTop();if(mode==='build')renderBuild();persist();ov.innerHTML=shopHTML()},
  size(){sizeIdx=(sizeIdx+1)%SIZES.length;applySize();toast(SIZES[sizeIdx].n.toUpperCase(),sizeIdx===3?'¡Ideal para construir!':sizeIdx===0?'Admira la ciudad desde abajo':sizeIdx<=1?'Puedes entrar en los edificios':'')},
  code(){const el=document.getElementById('codein');const v=(el&&el.value||'').trim().toUpperCase();if(!v)return;
    if(!CODES[v]){toast('CÓDIGO NO VÁLIDO','');return}if(S.codes[v]){toast('YA USADO','Ese código ya lo canjeaste');return}
    S.codes[v]=1;S.cash+=CODES[v];persist();renderTop();toast('¡CÓDIGO CANJEADO!','+'+fmt(CODES[v]));el.value=''},
  expand(){const c=plotCost();if(plotSize()>=N||S.cash<c)return;S.cash-=c;S.plots[S.map]=plotSize()+2;updatePlot();renderBuild();renderTop();persist();toast('¡TERRENO AMPLIADO!',`${plotSize()}×${plotSize()} casillas`)},
  rotate(){if(!selected)return;const[x,z]=selected,c=grid[idx(x,z)];c.r=c.r==null?1:(c.r+1)%4;buildMesh(x,z);showInfo()},
  menu(){ov.innerHTML=menuHTML()},
  cat(id){cat=id;renderBuild()},
  tool(id){setTool(id)},
  money(){S.cash+=1e6;renderTop();toast('+$1.000.000','')},
  gomap(id){if(mode==='drive')exitCar();if(myCar){scene.remove(myCar);myCar=null}
    saveVehs();S.maps[S.map]=grid;S.map=id;insideI=-1;MAP=MAPS.find(m=>m.id===id);if(!S.maps[id])S.maps[id]=emptyGrid();grid=S.maps[id];
    cars.splice(0).forEach(c=>scene.remove(c.g));peds.splice(0).forEach(c=>scene.remove(c.g));warns.forEach((w,i)=>{if(w){scene.remove(w);warns[i]=null}});
    applyMapLook();rebuildAll();loadVehs();recalc();updatePlot();spawnPlayer();renderTop();if(mode==='build')renderBuild();ov.innerHTML='';persist();toast(MAP.name.toUpperCase(),MAP.mult>1?`Todo gana x${MAP.mult}`:'')},
  upgrade(){if(!selected)return;const[x,z]=selected,c=grid[idx(x,z)],nc=upCost(c.t,c.lv);if(S.cash<nc||c.lv>=B[c.t].max)return;S.cash-=nc;c.lv++;addXP(Math.round(nc/6));buildMesh(x,z);puff(x,z);recalc();renderTop();showInfo()},
  demolish(){if(!selected)return;const t=tool;tool='bull';place(...selected);tool=t;selected=null;showInfo()},
  resetask(){document.getElementById('confirm').innerHTML=`<p style="margin-top:12px">¿Seguro? Se borrarán todas tus ciudades.</p><button class="sbtn r out" data-act="resetgo">SÍ, BORRAR</button>`},
  resetgo(){clearVehs();insideI=-1;S=DEF();S.maps.pradera=emptyGrid();grid=S.maps.pradera;MAP=MAPS[0];if(myCar){scene.remove(myCar);myCar=null}cars.splice(0).forEach(c=>scene.remove(c.g));peds.splice(0).forEach(c=>scene.remove(c.g));warns.forEach((w,i)=>{if(w){scene.remove(w);warns[i]=null}});applyMapLook();rebuildAll();recalc();updatePlot();spawnPlayer();setMode('walk');renderTop();persist();ov.innerHTML=''}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;ACT[b.dataset.act]&&ACT[b.dataset.act](b.dataset.id)});

/* ================= ARRANQUE Y BUCLE ================= */
applyMapLook();rebuildAll();loadVehs();recalc();spawnPlayer();
let offline=0;{const el=Math.min(7200,(Date.now()-(S.last||Date.now()))/1000);if(el>30&&income>0){offline=Math.round(income*el*.5);S.cash+=offline}}
setMode('walk');updatePlot();plotLine.visible=plotFill.visible=false;renderTop();ov.innerHTML=introHTML(offline);
let last=performance.now(),saveT=0,popT=0,infoT=0,payT=0;
function loop(t){
  const dt=Math.min((t-last)/1000,.05);last=t;
  payT+=dt;if(payT>=5){payT-=5;const amt=income*5;if(amt>0){S.cash+=amt;const px=mode==='drive'?car.x:P.x,pz=mode==='drive'?car.z:P.z;popCash(px,pz,'+'+fmt(amt));renderTop();if(mode==='build')renderBuild()}}
  document.getElementById('payb').style.width=(payT/5*100)+'%';
  meshes.forEach(m=>{if(m&&m.userData.spin)m.userData.spin.rotation.z+=dt*.5});
  saveT+=dt;if(saveT>5){saveT=0;persist()}
  infoT+=dt;if(infoT>.25){infoT=0;renderTop();if(selected)showInfo()}
  popT-=dt;if(popT<=0&&prod.length){popT=.5;const i=pick(prod);const[wx,wz]=tpos(i%N,Math.floor(i/N));const s=new THREE.Sprite(new THREE.SpriteMaterial({map:cashTex,transparent:true}));s.scale.set(1.1,1.1,1);s.position.set(wx,3,wz);scene.add(s);pops.push({s,l:1})}
  const nb=grid.filter(c=>B[c.t]&&B[c.t].inc).length,nr=grid.filter(c=>c.t==='road').length;
  const wantC=Math.min(40,Math.floor(nb*.7)+(nr?3:0)),wantP=Math.min(36,Math.floor(nb*.8)+(nr?4:0));
  if(cars.length<wantC&&Math.random()<.08)spawnMover(cars,()=>carModel(pick(CAR_COLS)),.6+Math.random()*.4,.75);
  if(peds.length<wantP&&Math.random()<.08)spawnMover(peds,pedModel,.15+Math.random()*.1,1.7);
  [cars,peds].forEach(list=>{for(let k=list.length-1;k>=0;k--){if(!moverStep(list[k],dt)||list.length>(list===cars?wantC:wantP)+4){scene.remove(list[k].g);list.splice(k,1)}}});
  peds.forEach((p,k)=>{const s=Math.sin(t/120+k)*.4;p.g.children[2].rotation.x=s;p.g.children[3].rotation.x=-s});
  for(let k=puffs.length-1;k>=0;k--){const p=puffs[k];p.userData.l-=dt;p.userData.v.y-=14*dt;p.position.addScaledVector(p.userData.v,dt);p.rotation.x+=dt*5;p.material.opacity=p.userData.l*1.5;if(p.userData.l<=0){scene.remove(p);puffs.splice(k,1)}}
  for(let k=pops.length-1;k>=0;k--){const p=pops[k];p.l-=dt;p.s.position.y+=dt*2.5;p.s.material.opacity=Math.min(1,p.l*2);if(p.l<=0){scene.remove(p.s);pops.splice(k,1)}}
  vehs.forEach(v=>vehStep(v,ov.innerHTML?0:dt));
  if(!ov.innerHTML){if(mode==='walk'||mode==='build')walkUpdate(dt);else if(mode==='drive')driveUpdate(dt)}
  else if(mode!=='drive'){avatar.position.set(P.x,P.y,P.z)}
  updateInside();
  if(mode!=='drive'&&ov.innerHTML){const cp=Math.cos(look.pitch);camera.position.set(P.x+Math.sin(look.yaw)*cp*look.dist,1.5+Math.sin(look.pitch)*look.dist,P.z+Math.cos(look.yaw)*cp*look.dist);camera.lookAt(P.x,1.4,P.z)}
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
addEventListener('beforeunload',persist);
if(window.CubiAudio){CubiAudio.gameMusic('bienvenida');['place','placeTile','build','buyVehicle','placeVehicle','placeVeh'].forEach(n=>CubiAudio.wrap(n,'place'));['bulldoze','demolish','removeTile'].forEach(n=>CubiAudio.wrap(n,'remove'))}
Sala.init({game:'barrio',scene,me:Object.assign(AV,{root:avatar}),scale:.55,emotes:true,getState:()=>({x:+P.x.toFixed(2),y:+P.y.toFixed(2),z:+P.z.toFixed(2),ry:+P.face.toFixed(2),air:!P.ground}),board:{label:'Dinero'},shared:'Paseáis juntos por el barrio; cada uno construye y gana su propio dinero.'});
setInterval(()=>Sala.score(Math.floor(S.cash),'$'+Math.floor(S.cash).toLocaleString('es')),1000);
requestAnimationFrame(loop);
</script>

<script>
if(typeof PLAT!=='undefined'&&PLAT&&window.CubiPases){
  const syncP=()=>{S.passes={};['sandbox','x2','turbo'].forEach(id=>{if(CubiPases.has('barrio',id))S.passes[id]=1});recalc();renderTop();if(mode==='build')renderBuild();persist()};
  CubiPases.init({game:'barrio',onChange:syncP});
  ACT.shop=()=>CubiPases.open();
  syncP();
}
</script>
