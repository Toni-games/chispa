<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Serpiente</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; }
  html { overflow: auto; }
  body { background: #0e1a12; color: #e6f4ea; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: safe center; gap: 12px; outline: 0; user-select: none; }
  .marcador { display: flex; gap: 28px; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .marcador span { opacity: .7; font-weight: 500; }
  canvas { background: #15261a; border-radius: 14px; box-shadow: 0 0 0 1px #24402c; width: min(440px, 92vw, 74vh); height: auto; aspect-ratio: 1; }
  .aviso { font-size: 13px; opacity: .75; text-align: center; padding: 0 16px; }
</style>
</head>
<body tabindex="0">
  <div class="marcador"><div><span>Puntos</span> <b id="puntos">0</b></div><div><span>Récord</span> <b id="record">0</b></div></div>
  <canvas id="lienzo" width="440" height="440"></canvas>
  <div class="aviso" id="aviso">Flechas o WASD para moverte · Espacio o clic para empezar</div>
<script>
const lienzo = document.getElementById('lienzo'), x = lienzo.getContext('2d');
const elPuntos = document.getElementById('puntos'), elRecord = document.getElementById('record'), aviso = document.getElementById('aviso');
const N = 20, T = lienzo.width / N;
let serp, dir, cola = [], comida, puntos = 0, vivo = false, pausa = false, temp, vel;
let record = 0; try { record = +localStorage.getItem('serpiente.record') || 0; } catch (e) {}
elRecord.textContent = record;

function nuevaComida() {
  do { comida = { x: Math.random() * N | 0, y: Math.random() * N | 0 }; }
  while (serp.some(s => s.x === comida.x && s.y === comida.y));
}
function iniciar() {
  serp = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
  dir = { x: 1, y: 0 }; cola = []; puntos = 0; vel = 130; vivo = true; pausa = false;
  elPuntos.textContent = 0; aviso.textContent = 'Come las manzanas · P para pausar';
  nuevaComida(); clearTimeout(temp); paso();
}
function paso() {
  if (pausa) return;
  if (cola.length) dir = cola.shift();
  const cab = { x: serp[0].x + dir.x, y: serp[0].y + dir.y };
  if (cab.x < 0 || cab.y < 0 || cab.x >= N || cab.y >= N || serp.some(s => s.x === cab.x && s.y === cab.y)) return fin();
  serp.unshift(cab);
  if (cab.x === comida.x && cab.y === comida.y) { puntos++; elPuntos.textContent = puntos; vel = Math.max(60, vel - 3); nuevaComida(); }
  else serp.pop();
  dibujar();
  temp = setTimeout(paso, vel);
}
function fin() {
  vivo = false;
  if (puntos > record) { record = puntos; try { localStorage.setItem('serpiente.record', record); } catch (e) {} elRecord.textContent = record; }
  aviso.textContent = `Fin de la partida: ${puntos} puntos · Espacio para jugar otra vez`;
  dibujar(true);
}
function redondo(px, py, w, h, r) { x.beginPath(); x.roundRect ? x.roundRect(px, py, w, h, r) : x.rect(px, py, w, h); x.fill(); }
function dibujar(muerto) {
  x.clearRect(0, 0, lienzo.width, lienzo.height);
  x.fillStyle = '#183020';
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) if ((i + j) % 2) x.fillRect(i * T, j * T, T, T);
  // manzana
  x.fillStyle = '#ff453a'; x.beginPath(); x.arc(comida.x * T + T / 2, comida.y * T + T / 2 + 1, T * .38, 0, 7); x.fill();
  x.fillStyle = '#5ce07a'; x.beginPath(); x.ellipse(comida.x * T + T / 2 + 3, comida.y * T + 4, 4, 2, -.6, 0, 7); x.fill();
  // serpiente
  serp.forEach((s, i) => {
    const k = 1 - i / (serp.length + 6);
    x.fillStyle = muerto ? `rgba(160,160,160,${k})` : `hsl(${135 - i}, 70%, ${38 + k * 22}%)`;
    redondo(s.x * T + 1.5, s.y * T + 1.5, T - 3, T - 3, i === 0 ? 7 : 5);
  });
  // ojos
  const c = serp[0];
  x.fillStyle = '#0e1a12';
  const ox = dir.y !== 0 ? 5 : 0, oy = dir.x !== 0 ? 5 : 0;
  x.beginPath(); x.arc(c.x * T + T / 2 + dir.x * 4 - ox, c.y * T + T / 2 + dir.y * 4 - oy, 2.2, 0, 7); x.fill();
  x.beginPath(); x.arc(c.x * T + T / 2 + dir.x * 4 + ox, c.y * T + T / 2 + dir.y * 4 + oy, 2.2, 0, 7); x.fill();
  if (muerto || pausa) {
    x.fillStyle = 'rgba(0,0,0,.45)'; x.fillRect(0, 0, lienzo.width, lienzo.height);
    x.fillStyle = '#fff'; x.font = '700 30px -apple-system, Segoe UI, sans-serif'; x.textAlign = 'center';
    x.fillText(muerto ? 'Fin de la partida' : 'Pausa', lienzo.width / 2, lienzo.height / 2);
  }
}
const DIRS = { arrowup: [0, -1], w: [0, -1], arrowdown: [0, 1], s: [0, 1], arrowleft: [-1, 0], a: [-1, 0], arrowright: [1, 0], d: [1, 0] };
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === ' ' || k === 'enter') { e.preventDefault(); if (!vivo) iniciar(); return; }
  if (k === 'p' && vivo) { pausa = !pausa; aviso.textContent = pausa ? 'En pausa · P para seguir' : 'Come las manzanas · P para pausar'; if (!pausa) paso(); else dibujar(); return; }
  const m = DIRS[k];
  if (m && vivo) {
    e.preventDefault();
    const ultima = cola.length ? cola[cola.length - 1] : dir;
    if (m[0] !== -ultima.x || m[1] !== -ultima.y) if (cola.length < 3) cola.push({ x: m[0], y: m[1] });
  }
});
lienzo.addEventListener('click', () => { window.focus(); if (!vivo) iniciar(); });
serp = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }]; dir = { x: 1, y: 0 }; comida = { x: 14, y: 10 };
dibujar();
window.addEventListener('load', () => { window.focus(); document.body.focus(); });
</script>
</body>
</html>
