<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ping Pong</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b3d22; }
  body { display: grid; place-items: center; user-select: none; }
  canvas { max-width: 100vw; max-height: 100vh; aspect-ratio: 720 / 440; width: 100%; touch-action: none; }
</style>
</head>
<body tabindex="0">
<canvas id="c" width="720" height="440"></canvas>
<script>
const cv = document.getElementById('c'), x = cv.getContext('2d'), W = 720, H = 440, PH = 76, META = 7;
let yo, cpu, bola, pYo, pCpu, estado = 'listo', teclas = {}, ratonY = null, ultimo = 0;
let victorias = 0; try { victorias = +localStorage.getItem('pingpong.record') || 0; } catch (e) {}
function saque(dir) { bola = { x: W / 2, y: H / 2, vx: 5.2 * dir, vy: (Math.random() * 2 - 1) * 3.2, r: 8 }; }
function reiniciar() { yo = H / 2 - PH / 2; cpu = H / 2 - PH / 2; pYo = 0; pCpu = 0; saque(Math.random() < .5 ? 1 : -1); estado = 'jugando'; }
function actualizar() {
  if (estado !== 'jugando') return;
  if (teclas.ArrowUp || teclas.w) yo -= 7; if (teclas.ArrowDown || teclas.s) yo += 7;
  if (ratonY != null) yo += (ratonY - PH / 2 - yo) * .35;
  yo = Math.max(0, Math.min(H - PH, yo));
  const objetivo = bola.vx > 0 ? bola.y - PH / 2 : H / 2 - PH / 2;
  cpu += Math.max(-4.6, Math.min(4.6, (objetivo - cpu) * .12));
  cpu = Math.max(0, Math.min(H - PH, cpu));
  bola.x += bola.vx; bola.y += bola.vy;
  if (bola.y < bola.r || bola.y > H - bola.r) { bola.vy *= -1; bola.y = Math.max(bola.r, Math.min(H - bola.r, bola.y)); }
  const golpe = (px, py) => { const rel = (bola.y - (py + PH / 2)) / (PH / 2); bola.vx = -bola.vx * 1.05; bola.vy = rel * 6; bola.vx = Math.sign(bola.vx) * Math.min(13, Math.abs(bola.vx)); };
  if (bola.vx < 0 && bola.x - bola.r < 34 && bola.x > 20 && bola.y > yo - 4 && bola.y < yo + PH + 4) { golpe(24, yo); bola.x = 34 + bola.r; }
  if (bola.vx > 0 && bola.x + bola.r > W - 34 && bola.x < W - 20 && bola.y > cpu - 4 && bola.y < cpu + PH + 4) { golpe(W - 34, cpu); bola.x = W - 34 - bola.r; }
  if (bola.x < -20) { pCpu++; saque(1); }
  if (bola.x > W + 20) { pYo++; saque(-1); }
  if (pYo >= META || pCpu >= META) {
    estado = 'fin';
    if (pYo >= META) { victorias++; try { localStorage.setItem('pingpong.record', victorias); } catch (e) {} try { parent.postMessage({ bahiaPuntos: victorias }, '*'); } catch (e) {} }
  }
}
function texto(t, y, tam) { x.fillStyle = '#fff'; x.textAlign = 'center'; x.font = `700 ${tam}px -apple-system, Segoe UI, sans-serif`; x.fillText(t, W / 2, y); }
function dibujar() {
  x.fillStyle = '#12613a'; x.fillRect(0, 0, W, H);
  x.strokeStyle = 'rgba(255,255,255,.75)'; x.lineWidth = 4; x.strokeRect(8, 8, W - 16, H - 16);
  x.setLineDash([10, 12]); x.beginPath(); x.moveTo(W / 2, 8); x.lineTo(W / 2, H - 8); x.stroke(); x.setLineDash([]);
  x.fillStyle = 'rgba(255,255,255,.18)'; x.font = '800 72px -apple-system, Segoe UI, sans-serif'; x.textAlign = 'center';
  x.fillText(pYo ?? 0, W / 2 - 80, 92); x.fillText(pCpu ?? 0, W / 2 + 80, 92);
  const pala = (px, py, c) => { x.fillStyle = c; x.beginPath(); x.roundRect ? x.roundRect(px, py, 12, PH, 6) : x.rect(px, py, 12, PH); x.fill(); };
  pala(22, yo, '#ff453a'); pala(W - 34, cpu, '#0a84ff');
  if (bola) { x.fillStyle = '#fff8e1'; x.beginPath(); x.arc(bola.x, bola.y, bola.r, 0, 7); x.fill(); }
  if (estado === 'listo') { texto('Ping Pong', H / 2 - 20, 44); texto('Clic o Espacio para empezar · ↑ ↓ o el ratón para mover', H / 2 + 24, 16); texto(`Victorias: ${victorias}`, H / 2 + 56, 15); }
  if (estado === 'fin') { x.fillStyle = 'rgba(0,0,0,.5)'; x.fillRect(0, 0, W, H); texto(pYo >= META ? '¡Has ganado!' : 'Gana el ordenador', H / 2 - 10, 40); texto('Clic o Espacio para la revancha', H / 2 + 30, 16); }
}
function bucle(t) { const dt = t - ultimo; ultimo = t; actualizar(); if (dt > 22) actualizar(); dibujar(); requestAnimationFrame(bucle); }
document.addEventListener('keydown', e => { teclas[e.key] = true; if ((e.key === ' ' || e.key === 'Enter') && estado !== 'jugando') { e.preventDefault(); reiniciar(); } if (e.key.startsWith('Arrow')) e.preventDefault(); });
document.addEventListener('keyup', e => { teclas[e.key] = false; });
cv.addEventListener('pointermove', e => { const r = cv.getBoundingClientRect(); ratonY = (e.clientY - r.top) / r.height * H; });
cv.addEventListener('pointerleave', () => { ratonY = null; });
cv.addEventListener('pointerdown', e => { window.focus(); if (estado !== 'jugando') reiniciar(); });
yo = cpu = H / 2 - PH / 2; requestAnimationFrame(bucle);
window.addEventListener('load', () => { window.focus(); document.body.focus(); });
</script>
</body>
</html>
