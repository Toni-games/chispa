<body>

<!-- Pantalla de arranque -->
<div id="arranque">
  <div class="arranque-centro">
    <svg class="logo-grande" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="24" r="13" fill="currentColor"/><path d="M6 43q6.5-6 13 0t13 0 13 0 13 0" stroke="currentColor" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M6 55q6.5-6 13 0t13 0 13 0 13 0" stroke="currentColor" stroke-width="5" fill="none" stroke-linecap="round"/></svg>
    <div class="progreso"><i></i></div>
  </div>
</div>

<!-- Pantalla de bloqueo -->
<div id="bloqueo" hidden>
  <div class="bl-fondo"></div>
  <div class="bl-fecha" id="bl-fecha"></div>
  <div class="bl-hora" id="bl-hora"></div>
  <div class="bl-usuario">
    <div class="avatar" id="bl-avatar">U</div>
    <div class="bl-nombre" id="bl-nombre">Usuario</div>
    <button class="bl-entrar" id="bl-entrar">Entrar <span aria-hidden="true">→</span></button>
    <div class="bl-pista">Haz clic o pulsa Intro</div>
  </div>
</div>

<!-- Escritorio -->
<div id="escritorio">
  <div id="fondo"></div>

  <header id="barra-menu">
    <div class="mb-izq">
      <button class="mb-item mb-logo" data-menu="sistema" aria-label="Menú del sistema"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="24" r="13" fill="currentColor"/><path d="M6 43q6.5-6 13 0t13 0 13 0 13 0" stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M6 55q6.5-6 13 0t13 0 13 0 13 0" stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round"/></svg></button>
      <button class="mb-item mb-app" data-menu="app" id="mb-app">Archivos</button>
      <button class="mb-item" data-menu="archivo">Archivo</button>
      <button class="mb-item" data-menu="edicion">Edición</button>
      <button class="mb-item" data-menu="visualizacion">Visualización</button>
      <button class="mb-item" data-menu="ventana">Ventana</button>
      <button class="mb-item" data-menu="ayuda">Ayuda</button>
    </div>
    <div class="mb-der">
      <span class="mb-item mb-bateria" id="mb-bateria" title="Batería"></span>
      <button class="mb-item" id="mb-wifi" aria-label="Wi‑Fi"></button>
      <button class="mb-item" id="mb-buscar" aria-label="Buscar"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12.6 12.6 17 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      <button class="mb-item" id="mb-cc" aria-label="Centro de control"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="3.5" width="16" height="5.5" rx="2.75" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="14.7" cy="6.25" r="1.7" fill="currentColor"/><rect x="2" y="11" width="16" height="5.5" rx="2.75" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="5.3" cy="13.75" r="1.7" fill="currentColor"/></svg></button>
      <button class="mb-item mb-reloj" id="mb-reloj"></button>
    </div>
  </header>

  <div id="iconos-escritorio"></div>
  <div id="ventanas"></div>

  <nav id="dock" aria-label="Dock"></nav>

  <div id="lanzador" hidden>
    <label class="lz-buscar"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12.6 12.6 17 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><input id="lz-input" placeholder="Buscar" autocomplete="off"></label>
    <div class="lz-rejilla" id="lz-rejilla"></div>
  </div>

  <div id="buscador" hidden>
    <div class="sp-caja">
      <div class="sp-fila">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12.6 12.6 17 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input id="sp-input" placeholder="Buscar apps, juegos, notas o calcular…" autocomplete="off">
      </div>
      <div class="sp-resultados" id="sp-resultados"></div>
    </div>
  </div>

  <div id="centro-control" class="panel-flotante" hidden></div>
  <div id="centro-notif" class="panel-flotante" hidden></div>
  <div id="avisos"></div>
</div>

<div id="brillo"></div>
<div id="apagado" hidden><span id="apagado-texto"></span></div>

<script src="juegos/lista.js"></script>
<script src="juegos/auto.js"></script>
<script src="tienda/lista.js"></script>
<script src="sistema/sistema.js"></script>
</body>
</html>
