<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Corre Cubo Corre</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
body{background:#8fd6ff}
.pad{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:20;display:none;gap:12px}
body.k-touch .pad{display:flex}
.pad button{width:74px;height:74px;border-radius:50%;border:3px solid #000;font:900 26px system-ui;color:#000;touch-action:none;box-shadow:inset 0 -5px 0 rgba(0,0,0,.25)}
.pad.l{left:max(18px,env(safe-area-inset-left,0px))}.pad.r{right:max(18px,env(safe-area-inset-right,0px))}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="pad l"><button data-k="l" style="background:#7ab8ff" aria-label="Izquierda">◀</button><button data-k="r" style="background:#7ab8ff" aria-label="Derecha">▶</button></div><div class="pad r"><button data-k="j" style="background:#3fd15c" aria-label="Saltar">▲</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../graficos.js"></script>
<script src="../avatar.js"></script>
<script src="../kit.js"></script>
<script src="../audio.js"></script>
<script src="comun.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="../multi.js"></script>
<script src="../sala.js"></script>
<script>
const K=Kit,J=Juego,$=s=>document.querySelector(s);
addEventListener('touchstart',()=>document.body.classList.add('k-touch'),{once:true,passive:true});

/* Corre Cubo Corre: corredor sin fin con 3 carriles. El mundo viene hacia ti; cambia de carril, salta y coge monedas. */
const {renderer,scene,camera,sun,hemi}=K.setup({sky:0x8fd6ff,fogNear:50,fogFar:150});
const LANES=[-2.6,0,2.6];
const road=new THREE.Group();scene.add(road);
for(let i=0;i<14;i++){const z=-i*12;K.box(9,.4,12,K.M(i%2?0x5b6475:0x535b6b),0,-.2,z,road).receiveShadow=true;
  [-1.3,1.3].forEach(x=>K.box(.15,.05,4,K.M(0xffffff),x,.03,z,road));
  [-6,6].forEach(x=>K.box(3,.5,12,K.M(0x6fcf5a),x,-.25,z,road))}
const deco=new THREE.Group();scene.add(deco);
for(let i=0;i<24;i++){const s=i%2?-1:1,x=s*(7+Math.random()*5),z=-i*7;
  if(i%3===0){K.cyl(.3,.3,2,K.M(0x8d5a2b),x,1,z,deco);K.sph(1.4,K.M(0x3fbf4a),x,2.8,z,deco)}else{const h=4+Math.random()*8;K.box(3,h,3,K.M([0xff7a7a,0x7ab8ff,0xffd166,0xb48cff][i%4]),x+s*2,h/2,z,deco)}}
const a=K.person(scene,null,null,.75);
let lane=1,x=0,y=0,vy=0,run=0,running=false,speed=14,dist=0,coins=0,lives=1,objs=[],nextZ=-40,shield=0,magnet=0,R=Math.random;
const box=(w,h,d,c)=>{const m=K.box(w,h,d,K.M(c),0,0,0,scene);m.castShadow=true;return m};
function spawnRow(z){const kind=R();const free=[0,1,2];const take=()=>free.splice(Math.floor(R()*free.length),1)[0];
  const n=speed>22&&R()<.5?2:1;
  for(let i=0;i<n;i++){const l=take();const t=R();let o;
    if(t<.4){o={m:box(2.2,.8,.6,0xffcc33),type:'low',l};o.m.position.y=.4;K.box(2.2,.15,.62,K.M(0x222222),0,.15,0,o.m)}
    else if(t<.75){o={m:box(2.2,3,.8,0xe5484d),type:'tall',l};o.m.position.y=1.5;K.box(1.2,.4,.82,K.M(0xffffff),0,.6,0,o.m)}
    else{o={m:box(2.3,2.6,7,0x3fa7ff),type:'tall',l,len:7};o.m.position.y=1.3;for(let k=-2;k<=2;k++)K.box(.5,.6,.1,K.M(0xd6f0ff),0,1.7,k*1.4,o.m).position.x=k%2?-.6:.6}
    o.m.position.x=LANES[l];o.z=z;objs.push(o)}
  // fila de monedas en un carril libre
  if(free.length&&R()<.75){const l=free[Math.floor(R()*free.length)];for(let k=0;k<5;k++){const m=K.cyl(.45,.45,.12,K.M(0xffcc33,{emissive:0x553300}),LANES[l],1,0,scene);m.rotation.x=Math.PI/2;objs.push({m,type:'coin',l,z:z-3-k*2})}}
  if(R()<.06){const l=free.length?free[0]:Math.floor(R()*3);const m=K.sph(.6,K.M(R()<.5?0x7ef0ff:0xff6fae,{emissive:0x222222}),LANES[l],1.2,0,scene);objs.push({m,type:R()<.5?'shield':'magnet',l,z:z-6})}}
function reset(sd){R=sd?Sala.rng(sd):Math.random;objs.forEach(o=>scene.remove(o.m));objs=[];lane=1;x=0;y=0;vy=0;speed=14;dist=0;coins=0;shield=0;magnet=0;nextZ=-40;for(let z=-40;z>-150;z-=16)spawnRow(z);nextZ=-150}
function move(d){if(!running)return;lane=Math.max(0,Math.min(2,lane+d));J.sfx('whoosh')}
function jump(){if(!running)return;if(y<=0.01){vy=11;J.sfx('jump')}}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='a'||k==='arrowleft')move(-1);if(k==='d'||k==='arrowright')move(1);if(k===' '||k==='w'||k==='arrowup'){e.preventDefault();jump()}});
let sw=null;renderer.domElement.addEventListener('pointerdown',e=>{sw={x:e.clientX,y:e.clientY}});
renderer.domElement.addEventListener('pointerup',e=>{if(!sw)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;if(Math.abs(dx)>30&&Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);else if(dy<-30)jump();else if(Math.abs(dx)<10&&Math.abs(dy)<10)jump();sw=null});
document.querySelectorAll('.pad [data-k]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();const k=b.dataset.k;if(k==='l')move(-1);if(k==='r')move(1);if(k==='j')jump()}));
function crash(){if(shield>0){shield=0;J.sfx('pop');K.toast('¡ESCUDO ROTO!','','#7ef0ff');return false}
  running=false;J.sfx('boom');J.sfx('lose');a.root.rotation.x=-1.2;const score=Math.floor(dist)+coins*10;const rec=J.saveBest('runner',score,true);if(window.Sala)Sala.score(score);
  setTimeout(()=>J.end({title:'¡CHOCASTE!',col:'#e5484d',lines:[`Distancia: <b style="color:#ffcc33">${Math.floor(dist)} m</b> · Monedas: ${coins}`,`Puntos: <b style="color:#ffcc33">${score}</b>`,`Récord: ${J.best('runner')}`],record:rec,onAgain(){a.root.rotation.x=0;reset();running=true}}),900);return true}
let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;
  if(running){speed=Math.min(34,speed+dt*.35);dist+=speed*dt;const mv=speed*dt;
    x+=(LANES[lane]-x)*Math.min(1,dt*14);vy-=30*dt;y=Math.max(0,y+vy*dt);if(y===0)vy=Math.max(0,vy);run+=dt*speed*.9;
    shield=Math.max(0,shield-dt);magnet=Math.max(0,magnet-dt);
    road.children.forEach(m=>{m.position.z+=mv;if(m.position.z>12)m.position.z-=168});deco.children.forEach(m=>{m.position.z+=mv;if(m.position.z>14)m.position.z-=168});
    nextZ+=mv;while(nextZ>-150){spawnRow(nextZ-16);nextZ-=16}
    for(let i=objs.length-1;i>=0;i--){const o=objs[i];o.z+=mv;o.m.position.z=o.z;if(o.type==='coin'||o.type==='shield'||o.type==='magnet')o.m.rotation.z+=dt*4;
      if(o.type==='coin'&&magnet>0&&o.z>-14&&o.z<1){o.m.position.x+=(x-o.m.position.x)*Math.min(1,dt*8);o.l=-1}
      const half=(o.len||.8)/2+.35,near=Math.abs(o.z)<half,sameLane=o.l===-1?Math.abs(o.m.position.x-x)<1.4:Math.abs(LANES[o.l]-x)<1.3;
      if(near&&sameLane){if(o.type==='coin'){coins++;J.sfx('coin');scene.remove(o.m);objs.splice(i,1);continue}
        if(o.type==='shield'){shield=10;J.sfx('levelup');K.toast('ESCUDO','Aguanta un choque','#7ef0ff');scene.remove(o.m);objs.splice(i,1);continue}
        if(o.type==='magnet'){magnet=10;J.sfx('levelup');K.toast('IMÁN','Atrae las monedas','#ff6fae');scene.remove(o.m);objs.splice(i,1);continue}
        if(o.type==='low'&&y>.9)continue;
        if(crash()){break}else{scene.remove(o.m);objs.splice(i,1);continue}}
      if(o.z>10){scene.remove(o.m);objs.splice(i,1)}}
    if(Math.floor(dist/25)!==Math.floor((dist-mv)/25)&&window.Sala)Sala.score(Math.floor(dist)+coins*10);
    J.hud([['Metros',Math.floor(dist)],['Monedas',coins],['Velocidad',Math.round(speed*3.6)+' km/h'],shield>0?['Escudo',Math.ceil(shield)+' s']:null,magnet>0?['Imán',Math.ceil(magnet)+' s']:null])}
  a.root.position.set(x,y,0);a.root.rotation.y=Math.PI+(LANES[lane]-x)*-.15;K.walkAnim(a,run,y>.05);
  if(!a._sh){a._sh=K.sph(1.2,new THREE.MeshBasicMaterial({color:0x7ef0ff,transparent:true,opacity:.25}),0,1.2,0,a.root)}a._sh.visible=shield>0;
  camera.position.set(x*.6,4.6,7.5);camera.lookAt(x*.6,1.2,-6);sun.position.set(x+10,30,10);sun.target.position.set(x,0,-10);
  renderer.render(scene,camera);requestAnimationFrame(loop)}
Sala.init({game:'runner',remote:false,board:{label:'Puntos'},shared:'Al empezar todos a la vez, los obstáculos salen igual para todos.',onStart(sd){J.closePanels();a.root.rotation.x=0;reset(sd);running=true}});
reset();J.music('batalla');K.emotes(a);
J.start({title:'CORRE CUBO CORRE',col:'#3fa7ff',sub:'Corre sin parar por la calle: cambia de carril, salta las vallas y coge todas las monedas. Cada vez vas más rápido.',
  howto:['<b>A / D</b> o flechas para cambiar de carril, <b>ESPACIO</b> para saltar','En el móvil: desliza a los lados o hacia arriba, o usa los botones','Vallas amarillas: sáltalas · Muros rojos y autobuses azules: esquívalos','Bola azul = escudo · Bola rosa = imán de monedas'],
  record:J.best('runner')!=null?J.best('runner')+' puntos':null,onStart(){running=true}});
requestAnimationFrame(loop);

</script>
</body>
</html>
