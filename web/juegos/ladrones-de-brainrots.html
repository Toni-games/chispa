<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ladrones de Brainrots</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: mundo 3D a pantalla completa; dinero arriba al centro, tu base a la izquierda, acción abajo */
:root{--ink:#fff;--panel:rgba(20,18,34,.82);--green:#3fd15c;--gold:#ffcc33;--red:#ff4f4f;--blue:#3fa7ff;
  --f-d:"Lilita One","Arial Black",sans-serif;--f-b:"Nunito","Segoe UI",system-ui,sans-serif;color-scheme:dark}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#8fd0ff;font-family:var(--f-b);color:var(--ink);user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.ui{position:fixed;z-index:5}
.out{-webkit-text-stroke:1.5px #000;paint-order:stroke fill;text-shadow:0 3px 0 #000}
#money{top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);text-align:center;pointer-events:none}
#cash{font-family:var(--f-d);font-size:clamp(30px,6vw,46px);color:var(--green);line-height:1}
#rate{font-size:15px;font-weight:900}
#base{top:calc(env(safe-area-inset-top,0px) + 10px);left:max(10px,env(safe-area-inset-left,0px));background:var(--panel);border:3px solid #000;border-radius:14px;padding:10px 12px;width:min(230px,42vw)}
#base h3{margin:0;font-family:var(--f-d);font-weight:400;font-size:18px}
#base p{margin:4px 0 8px;font-size:13px;font-weight:700;color:#d6d3e8}
.btn{border:3px solid #000;border-radius:12px;padding:8px 12px;font-weight:900;background:#555c6a;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.btn.g{background:var(--green)}.btn.r{background:var(--red)}.btn.b{background:var(--blue)}.btn.y{background:var(--gold);color:#3a2600}
.btn:disabled{opacity:.5;cursor:not-allowed}
#lockbtn{width:100%}
#prompt{bottom:calc(env(safe-area-inset-bottom,0px) + 28px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--panel);border:3px solid #000;border-radius:14px;padding:8px 10px 8px 14px;font-weight:900;max-width:calc(100vw - 24px)}
#prompt kbd{background:#fff;color:#000;border-radius:6px;padding:2px 8px;font-family:var(--f-b);font-weight:900}
#alert{top:calc(env(safe-area-inset-top,0px) + 96px);left:50%;transform:translateX(-50%);background:var(--red);border:3px solid #000;border-radius:12px;padding:6px 14px;font-weight:900;pointer-events:none;white-space:nowrap}
#toast{top:30%;left:50%;transform:translate(-50%,-50%);font-family:var(--f-d);font-size:clamp(26px,5vw,40px);text-align:center;pointer-events:none;transition:opacity .3s;opacity:0;width:90vw}
#toast small{display:block;font-family:var(--f-b);font-size:16px;font-weight:900}
#joy{left:max(18px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 24px);width:124px;height:124px;border-radius:50%;background:rgba(0,0,0,.25);border:3px solid rgba(255,255,255,.4);display:none;touch-action:none}
#joy i{position:absolute;left:36px;top:36px;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.6)}
#jump{right:max(22px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 34px);width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.75);color:#000;border:3px solid #000;font-weight:900;display:none;touch-action:none}
body.touch #joy,body.touch #jump{display:block}
body.touch #prompt{bottom:calc(env(safe-area-inset-bottom,0px) + 160px)}
#hint{bottom:calc(env(safe-area-inset-bottom,0px) + 8px);left:50%;transform:translateX(-50%);font-size:12px;font-weight:800;white-space:nowrap;pointer-events:none}
body.touch #hint{display:none}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:20;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.panel{background:#221d38;border:4px solid #000;border-radius:18px;max-width:540px;width:100%;max-height:88vh;overflow:auto}
.ph{background:var(--red);border-bottom:4px solid #000;padding:10px 16px;border-radius:14px 14px 0 0}
.ph h2{margin:0;font-family:var(--f-d);font-weight:400;font-size:28px}
.pb{padding:16px}.pb p{margin:0 0 10px;line-height:1.45;font-weight:700;color:#d6d3e8}.pb ul{margin:0 0 14px;padding-left:18px;line-height:1.6;font-weight:700}
.rar{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}.rar span{border:2px solid #000;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:900}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="money" class="ui"><div id="cash" class="out">$0</div><div id="rate" class="out">+$0/s</div></div>
<div id="base" class="ui"><h3 class="out">Tu base</h3><p id="basetxt"></p><button class="btn b out" id="lockbtn" data-act="lock">Bloquear base</button><button class="btn y out" id="pasesbtn" data-act="pases" hidden style="width:100%;margin-top:6px">Pases</button></div>
<div id="alert" class="ui out" hidden></div>

<div id="ov"></div>

<script src="../avatar.js"></script>
<script src="../pases.js"></script>
<script src="../audio.js"></script>
<script src="../kit.js"></script>

<script src="../multi.js"></script>

<script>
/* ================= DATOS ================= */
const RAR={comun:['Común','#b0bec5',60],raro:['Raro','#42a5f5',25],epico:['Épico','#ab47bc',10],leg:['Legendario','#ffca28',4],mit:['Mítico','#ff4f4f',.9],sec:['Secreto','#111111',.1]};
const BR=[
 {id:'tostadin',name:'Tostadín Patinetín',r:'comun',price:50,inc:1},
 {id:'pepino',name:'Pepinillo Bailarín',r:'comun',price:90,inc:2},
 {id:'calcetin',name:'Calcetín Gruñón',r:'comun',price:150,inc:3},
 {id:'sarten',name:'Sartenazo Cantarín',r:'raro',price:600,inc:9},
 {id:'brocoli',name:'Brócoli Turbinoli',r:'raro',price:1000,inc:15},
 {id:'tostadora',name:'Tostadora Voladora',r:'epico',price:4500,inc:50},
 {id:'patogelato',name:'Pato Gelato',r:'epico',price:7500,inc:75},
 {id:'cactus',name:'Cactus Saxofonus',r:'leg',price:30000,inc:260},
 {id:'bombillo',name:'Bombillo Trombillo',r:'leg',price:55000,inc:430},
 {id:'tiburon',name:'Tiburón Patatón',r:'mit',price:250000,inc:1700},
 {id:'nube',name:'Nube Pirulina',r:'mit',price:420000,inc:2600},
 {id:'croqueton',name:'Rey Croquetón',r:'sec',price:2500000,inc:13000},
 {id:'paellon',name:'Dragón Paellón',r:'sec',price:0,inc:20000,excl:1}
];
const BY={};BR.forEach(b=>BY[b.id]=b);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const passOk=id=>!!(window.CubiPases&&location.hash==='#plataforma'&&CubiPases.has('ladrones',id));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const fmt=n=>'$'+(n>=1e9?(n/1e9).toFixed(2)+'B':n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e4?(n/1e3).toFixed(1)+'K':Math.floor(n).toLocaleString('es-ES'));
function weighted(){const BRs=BR.filter(b=>!b.excl);const tot=BRs.reduce((a,b)=>a+RAR[b.r][2]/BR.filter(x=>x.r===b.r).length,0);let r=Math.random()*tot;for(const b of BRs){r-=RAR[b.r][2]/BR.filter(x=>x.r===b.r).length;if(r<=0)return b}return BR[0]}

/* ================= ESCENA ================= */
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8fd0ff);scene.fog=new THREE.Fog(0x8fd0ff,90,200);
const camera=new THREE.PerspectiveCamera(60,1,.2,400);
scene.add(new THREE.HemisphereLight(0xffffff,0x6a8a5a,.75));
const sun=new THREE.DirectionalLight(0xfff2dd,.8);sun.position.set(30,60,20);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-60,right:60,top:60,bottom:-60,far:160});scene.add(sun);
const M=(c,o)=>new THREE.MeshLambertMaterial(Object.assign({color:c},o||{}));
function box(w,h,d,m,x,y,z,p){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);p.add(o);return o}
function cyl(rt,rb,h,m,x,y,z,p,seg){const o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||16),m);o.position.set(x,y,z);p.add(o);return o}
function sph(r,m,x,y,z,p){const o=new THREE.Mesh(new THREE.SphereGeometry(r,14,12),m);o.position.set(x,y,z);p.add(o);return o}
function shadowAll(o){o.traverse(m=>{if(m.isMesh){m.castShadow=true;m.receiveShadow=true}})}
// suelo con studs
const st=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,64,64);[[16,16],[48,16],[16,48],[48,48]].forEach(([x,y])=>{g.fillStyle='#f0f0f0';g.beginPath();g.arc(x,y,10,0,7);g.fill();g.strokeStyle='rgba(0,0,0,.08)';g.stroke()});const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(60,50);return t})();
const ground=new THREE.Mesh(new THREE.PlaneGeometry(130,110),M(0x6fcf4f,{map:st}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
// alfombra central
const carpet=new THREE.Mesh(new THREE.PlaneGeometry(100,5),M(0xc62828));carpet.rotation.x=-Math.PI/2;carpet.position.y=.03;carpet.receiveShadow=true;scene.add(carpet);
[-2.6,2.6].forEach(z=>{const e=new THREE.Mesh(new THREE.PlaneGeometry(100,.4),M(0xffcc33));e.rotation.x=-Math.PI/2;e.position.set(0,.035,z);scene.add(e)});
// carteles de la tienda
function textTex(lines,w,h,bg){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');if(bg){g.fillStyle=bg;g.fillRect(0,0,w,h)}g.textAlign='center';g.textBaseline='middle';
  lines.forEach(([t,size,col,y])=>{g.font=`900 ${size}px Nunito, Arial`;g.lineWidth=Math.max(4,size/6);g.strokeStyle='#000';g.strokeText(t,w/2,y);g.fillStyle=col;g.fillText(t,w/2,y)});return new THREE.CanvasTexture(c)}
function sprite(tex,w,h){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,depthTest:false,transparent:true}));s.scale.set(w,h,1);s.renderOrder=6;return s}
[-48,48].forEach(x=>{const t=sprite(textTex([['TIENDA DE BRAINROTS',44,'#ffcc33',40],['Compra los que pasan por la alfombra',24,'#fff',86]],600,120),12,2.4);t.position.set(x,4,0);scene.add(t)});

/* ================= BRAINROTS (personajes originales) ================= */
function eyes(g,x,y,z,s,ry){const e=new THREE.Group();e.position.set(x,y,z);if(ry)e.rotation.y=ry;g.add(e);[-1,1].forEach(k=>{sph(.11*s,M(0xffffff),k*.13*s,0,0,e);sph(.055*s,M(0x111111),k*.13*s,0,.07*s,e)});return e}
function mouth(g,x,y,z,w,open){if(open){sph(w*.4,M(0x5a1010),x,y,z,g).scale.set(1,1.2,.4)}else box(w,.04,.03,M(0x111111),x,y,z,g)}
function legs(g,col,y,sep){const L=[];[-1,1].forEach(k=>{const l=new THREE.Group();l.position.set(k*(sep||.18),y,0);g.add(l);box(.1,y,.1,M(col),0,-y/2,0,l);box(.16,.06,.2,M(0x222222),0,-y+.03,.04,l);L.push(l)});g.userData.legs=L}
function makeBR(id){
  const g=new THREE.Group(),b=new THREE.Group();g.add(b);g.userData.body=b;
  switch(id){
    case 'tostadin':{box(.9,.9,.28,M(0xd9a25a),0,.95,0,b);box(.98,.98,.22,M(0x8a5a2a),0,.95,-.04,b);eyes(b,0,1.05,.15,1);mouth(b,0,.82,.15,.25,true);
      box(1.1,.07,.4,M(0xe53935),0,.42,0,b);[[-.4,.13],[.4,.13],[-.4,-.13],[.4,-.13]].forEach(([x,z])=>{const w=cyl(.07,.07,.08,M(0xffffff),x,.33,z,b,10);w.rotation.z=Math.PI/2});break}
    case 'pepino':{cyl(.28,.3,1.1,M(0x5a9a3a),0,1.05,0,b);sph(.28,M(0x5a9a3a),0,1.6,0,b);for(let k=0;k<8;k++)sph(.05,M(0x3f7a2a),Math.cos(k)*.28,.7+k*.11,Math.sin(k)*.28,b);
      eyes(b,0,1.45,.25,1);mouth(b,0,1.28,.27,.2,false);[-1,1].forEach(k=>{const a=box(.08,.5,.08,M(0x5a9a3a),k*.38,1.35,0,b);a.rotation.z=-k*.9});legs(g,0x3f7a2a,.5);break}
    case 'calcetin':{const w=M(0xf5f5f5),r=M(0xe53935);cyl(.3,.3,.9,w,0,.95,0,b);cyl(.305,.305,.1,r,0,1.25,0,b);cyl(.305,.305,.1,r,0,1.05,0,b);box(.6,.36,.62,w,0,.32,.16,b);
      eyes(b,0,1.15,.27,1);[-1,1].forEach(k=>{const br=box(.16,.04,.03,M(0x111111),k*.13,1.28,.29,b);br.rotation.z=k*.4});mouth(b,0,.95,.3,.2,false);break}
    case 'sarten':{const pan=cyl(.55,.55,.1,M(0x37474f),0,1.15,0,b,24);pan.rotation.x=Math.PI/2;cyl(.47,.47,.11,M(0x263238),0,1.15,.01,b,24).rotation.x=Math.PI/2;
      box(.12,.7,.08,M(0x5d4037),0,.45,-.02,b);eyes(b,0,1.28,.08,1.1);mouth(b,0,1.0,.08,.22,true);legs(g,0x37474f,.35,.25);break}
    case 'brocoli':{cyl(.18,.24,.6,M(0x9ccc65),0,.6,0,b);[[0,1.15,0,.32],[.28,1.05,0,.24],[-.28,1.05,0,.24],[0,1.05,.25,.24],[0,1.05,-.25,.24]].forEach(([x,y,z,r])=>sph(r,M(0x2e7d32),x,y,z,b));
      eyes(b,0,.75,.2,.9);mouth(b,0,.58,.22,.18,false);cyl(.03,.03,.3,M(0x777777),0,1.55,0,b);const pr=new THREE.Group();pr.position.y=1.7;b.add(pr);box(.9,.03,.12,M(0xff4f4f),0,0,0,pr);box(.12,.03,.9,M(0xffcc33),0,0,0,pr);g.userData.spin=pr;legs(g,0x9ccc65,.3);break}
    case 'tostadora':{box(.95,.7,.6,M(0xcfd8dc),0,.95,0,b);box(.6,.05,.12,M(0x263238),0,1.31,-.12,b);box(.6,.05,.12,M(0x263238),0,1.31,.12,b);box(.5,.3,.08,M(0xd9a25a),0,1.4,-.12,b);box(.5,.3,.08,M(0xd9a25a),0,1.45,.12,b);
      eyes(b,0,1.0,.31,1);mouth(b,0,.8,.31,.22,true);const W=[];[-1,1].forEach(k=>{const w=new THREE.Group();w.position.set(k*.48,1.05,0);b.add(w);const f=box(.7,.05,.4,M(0xffffff),k*.35,0,0,w);W.push(w)});g.userData.wings=W;break}
    case 'patogelato':{const c=new THREE.Mesh(new THREE.ConeGeometry(.35,.9,16),M(0xd9a25a));c.rotation.x=Math.PI;c.position.y=.55;b.add(c);sph(.38,M(0xff8fc7),0,1.1,0,b);sph(.3,M(0xfff3e0),0,1.42,0,b);
      sph(.25,M(0xffeb3b),0,1.78,0,b);box(.2,.07,.18,M(0xff9800),0,1.74,.25,b);eyes(b,0,1.85,.2,.8);break}
    case 'cactus':{const g2=M(0x388e3c);cyl(.3,.32,1.4,g2,0,.9,0,b);sph(.3,g2,0,1.6,0,b);[-1,1].forEach(k=>{cyl(.13,.13,.4,g2,k*.45,1.1,0,b);const t=cyl(.13,.13,.4,g2,k*.3,1.1,0,b);t.rotation.z=Math.PI/2});
      eyes(b,0,1.45,.27,1);const sx=new THREE.Group();sx.position.set(.25,1.05,.35);sx.rotation.z=-.5;b.add(sx);const gd=M(0xffcc33,{emissive:0x553300,emissiveIntensity:.3});cyl(.06,.06,.6,gd,0,0,0,sx);const bell=new THREE.Mesh(new THREE.ConeGeometry(.15,.25,12,1,true),gd);bell.position.y=-.38;bell.rotation.x=Math.PI;sx.add(bell);break}
    case 'bombillo':{sph(.45,M(0xfff59d,{emissive:0xffcc00,emissiveIntensity:.6}),0,1.25,0,b);cyl(.2,.22,.35,M(0x9e9e9e),0,.72,0,b);eyes(b,0,1.3,.4,1);mouth(b,0,1.1,.42,.2,true);
      const gd=M(0xffcc33);const t=cyl(.04,.04,.9,gd,.55,1.05,.2,b);t.rotation.z=Math.PI/2;const bell=new THREE.Mesh(new THREE.ConeGeometry(.16,.3,12,1,true),gd);bell.rotation.z=-Math.PI/2;bell.position.set(1.05,1.05,.2);b.add(bell);legs(g,0x9e9e9e,.5);break}
    case 'tiburon':{const p=sph(.6,M(0xb58a4a),0,.9,0,b);p.scale.set(1.15,.75,.85);const fin=new THREE.Mesh(new THREE.ConeGeometry(.22,.55,4),M(0x78909c));fin.position.set(0,1.45,-.1);b.add(fin);
      const tail=new THREE.Mesh(new THREE.ConeGeometry(.25,.5,4),M(0x78909c));tail.rotation.z=Math.PI/2;tail.position.set(-.85,.95,0);b.add(tail);eyes(b,.2,1.05,.45,1);
      for(let k=0;k<5;k++){const tt=new THREE.Mesh(new THREE.ConeGeometry(.04,.1,4),M(0xffffff));tt.rotation.x=Math.PI;tt.position.set(.05+k*.1,.8,.5);b.add(tt)}legs(g,0x8a6a3a,.4,.3);break}
    case 'nube':{[[0,1.2,0,.45],[.42,1.1,0,.35],[-.42,1.1,0,.35],[.2,1.45,0,.32],[-.2,1.45,0,.3]].forEach(([x,y,z,r])=>sph(r,M(0xffffff),x,y,z,b));eyes(b,0,1.25,.42,1);mouth(b,0,1.08,.44,.18,false);
      cyl(.03,.03,.9,M(0xffffff),.65,.9,.2,b);const lol=cyl(.25,.25,.06,M(0xff4fa0),.65,1.4,.2,b,20);lol.rotation.x=Math.PI/2;cyl(.15,.15,.07,M(0x3fa7ff),.65,1.4,.21,b,20).rotation.x=Math.PI/2;g.userData.float=1;break}
    case 'paellon':{const pan=cyl(.75,.65,.18,M(0x37474f),0,.75,0,b,24);cyl(.68,.68,.06,M(0xf2b632),0,.86,0,b,24);
      [[.3,.1,0xd32f2f],[-.25,.2,0x43a047],[.1,-.35,0xd32f2f],[-.35,-.2,0xffe082],[.4,-.2,0x43a047]].forEach(([x,z,c])=>box(.16,.06,.1,M(c),x,.9,z,b));
      [-1,1].forEach(k=>box(.4,.06,.1,M(0x37474f),k*.85,.75,0,b));
      const gr=M(0x2e9e45);const neck=cyl(.16,.22,.9,gr,0,1.3,-.35,b);neck.rotation.x=-.35;const hd=box(.45,.36,.55,gr,0,1.8,-.1,b);box(.3,.16,.25,gr,0,1.72,.25,b);
      eyes(b,0,1.9,.18,.9);[-1,1].forEach(k=>{const h=new THREE.Mesh(new THREE.ConeGeometry(.06,.25,6),M(0xffe082));h.position.set(k*.14,2.08,-.15);b.add(h);
        const w=box(.7,.04,.4,M(0x1b5e20),k*.55,1.35,-.4,b);w.rotation.z=k*.5});

  }
  // bloqueo de las bases de los bots
  if(B.lock>0){B.lock-=dt}else{B.lockCd-=dt;if(B.lockCd<=0&&!(P.carry&&P.carry.from===B)&&!inBase(B,P.x,P.z)){B.lock=14+Math.random()*8;B.lockCd=28+Math.random()*25}}
  o.a.root.position.set(o.x,0,o.z);let df=(o.face||0)-o.a.root.rotation.y;df=Math.atan2(Math.sin(df),Math.cos(df));o.a.root.rotation.y+=df*Math.min(1,dt*10);
  animPerson(o.a,o.walk,false);if(o.carry){o.a.armL.rotation.x=o.a.armR.rotation.x=-3}
}
function lockVisual(B){B.laser.visible=B.lock>0;B.laser.material.opacity=.3+Math.abs(Math.sin(performance.now()/300))*.3;
  const txt=B.lock>0?String(Math.ceil(B.lock)):'';if(txt!==B.lockTxt){B.lockTxt=txt;B.lockSign.material.map.dispose();B.lockSign.material.map=textTex([[B.lock>0?`BLOQUEADA ${Math.ceil(B.lock)} s`:'',40,'#ff6b6b',40]],400,80);B.lockSign.visible=B.lock>0}}

/* ================= BUCLE ================= */
let last=performance.now(),acc=0,saveT=0,hudT=0,popT=0;
function loop(t){const dt=Math.min((t-last)/1000,.05);last=t;
  if(!ov.innerHTML){
    playerUpdate(dt);BOTS.forEach(o=>botUpdate(o,dt));
    if(ME.lock>0){ME.lock-=dt;if(ME.lock<=0)ME.lockCd=30}else if(ME.lockCd>0)ME.lockCd-=dt;
    acc+=dt;if(acc>=1){acc-=1;cash+=income()}
    spawnT-=dt;if(spawnT<=0&&walkers.length<12){spawnT=2.6+Math.random()*1.6;spawnWalker()}
    for(let k=walkers.length-1;k>=0;k--){const w=walkers[k];w.x+=dt*2.4;w.t+=dt;w.m.position.x=w.x;animBR(w.m,w.t,true);if(w.x>50){scene.remove(w.m);walkers.splice(k,1)}}
    for(let k=flying.length-1;k>=0;k--){const f=flying[k];f.t+=dt;const[sx,sz]=slotWorld(ME,f.slot);const from=f.from;const p=Math.min(1,f.t/1.6);
      f.m.position.set(from[0]+(sx-from[0])*p,Math.sin(p*Math.PI)*6+.86*p,from[1]+(sz-from[1])*p);if(p>=1){scene.remove(f.m);ME.slots[f.slot]=null;setSlot(ME,f.slot,f.id);flying.splice(k,1);persist()}}
    action=findAction();
    saveT+=dt;if(saveT>5){saveT=0;persist()}
  }
  BASES.forEach(B=>{lockVisual(B);B.models.forEach((m,i)=>{if(m)animBR(m,t/1000+i,false)})});
  hudT+=dt;if(hudT>.15){hudT=0;hud();renderPrompt()}
  const cp=Math.cos(look.pitch);camera.position.set(P.x+Math.sin(look.yaw)*cp*look.dist,P.y+1.5+Math.sin(look.pitch)*look.dist,P.z+Math.cos(look.yaw)*cp*look.dist);camera.lookAt(P.x,P.y+1.3,P.z);
  renderer.render(scene,camera);requestAnimationFrame(loop)}
ov.innerHTML=`<div class="overlay"><div class="panel"><div class="ph"><h2 class="out">LADRONES DE BRAINROTS</h2></div><div class="pb">
  <p>Colecciona brainrots: criaturas absurdas que dan dinero cada segundo en tu base.</p>
  <ul><li>Por la <b>alfombra roja</b> pasan brainrots. Acércate y pulsa <b>E</b> para comprarlos.</li><li>Entra en las bases de Lola, Max y Kiko y <b>róbales</b> los suyos. Corre a tu base antes de que te pillen.</li>
  <li>Ellos también vendrán a por los tuyos. Tócales para recuperarlo o <b>bloquea tu base</b> 45 segundos.</li><li>Cuanto más raro, más dinero da.</li></ul>
  <div class="rar">${Object.values(RAR).map(r=>`<span style="background:${r[1]};color:${r[1]==='#111111'?'#fff':'#000'}">${r[0]}</span>`).join('')}</div>
  <button class="btn g out" data-act="close" style="width:100%;font-size:18px">¡A ROBAR!</button></div></div></div>`;
if(window.CubiAudio)CubiAudio.gameMusic('fiesta');
Sala.init({game:'ladrones',scene,me,scale:.75,emotes:true,getState:()=>({x:+P.x.toFixed(2),y:+P.y.toFixed(2),z:+P.z.toFixed(2),ry:+P.face.toFixed(2),air:!P.ground}),board:{label:'Dinero'},shared:'Estáis en el mismo mapa y os veis; cada uno tiene su base y su dinero.'});
setInterval(()=>Sala.score(Math.floor(cash),'$'+Math.floor(cash)),1000);
hud();requestAnimationFrame(loop);
addEventListener('beforeunload',persist);
if(window.CubiPases&&window.CubiAvatar&&location.hash==='#plataforma'){
  CubiPases.init({game:'ladrones',onChange(){hud()},onClaim(id){if(id!=='paellon')return true;const i=freeSlot(ME);if(i<0){toast('BASE LLENA','Vende algún brainrot y reclama el Dragón Paellón en Pases');return false}
    setSlot(ME,i,'paellon');persist();hud();toast('¡DRAGÓN PAELLÓN!','Tu brainrot exclusivo ya está en tu base','#ff7a00');return true}});
  document.getElementById('pasesbtn').hidden=false;
}
</script>
