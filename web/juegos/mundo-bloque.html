<script>
const K=Kit,J=Juego,$=s=>document.querySelector(s);
addEventListener('touchstart',()=>document.body.classList.add('k-touch'),{once:true,passive:true});
/* Mundo Bloque 2: mundo infinito por trozos, biomas, estructuras (aldeas, pirámides, torres, cabañas), animales y monstruos de noche. Todo de diseño propio. */
const {renderer,scene,camera}=K.setup({sky:0x8fd0ff,fogNear:30,fogFar:70,shadows:false});
camera.fov=72;camera.near=.05;camera.updateProjectionMatrix();scene.children.filter(o=>o.isLight).forEach(l=>scene.remove(l));
const avLight=new THREE.HemisphereLight(0xffffff,0x667755,1.1);scene.add(avLight);
const CH=16,H=64,SEA=26,RD=4;
/* ---------- bloques ---------- */
// [nombre, tile arriba, tile lado, tile abajo, transparente(0 no,1 recorte,2 cristal/agua), dureza]
const B=[null,
 ['Hierba',0,1,2,0,.6],['Tierra',2,2,2,0,.5],['Piedra',3,3,3,0,1.2],['Arena',4,4,4,0,.5],['Tronco',5,6,5,0,.9],['Hojas',7,7,7,1,.2],['Tablas',8,8,8,0,.8],
 ['Cristal',9,9,9,2,.3],['Ladrillo',10,10,10,0,1.4],['Agua',11,11,11,2,0],['Nieve',12,13,2,0,.3],['Lana roja',14,14,14,0,.4],['Lana azul',15,15,15,0,.4],
 ['Lana amarilla',16,16,16,0,.4],['Lana verde',17,17,17,0,.4],['Lámpara',18,18,18,0,.3],['Roca base',19,19,19,0,1e9],['Mineral de oro',20,20,20,0,1.6],
 ['Piedra lisa',21,21,21,0,1.2],['Mineral azul',22,22,22,0,1.8],['Cactus',23,24,23,0,.4],['Calabaza',25,26,25,0,.6],['Lana blanca',27,27,27,0,.4],['Lana negra',28,28,28,0,.4],
 ['Camino',29,2,2,0,.5],['Arenisca',30,30,30,0,1],['Hojas de pino',31,31,31,1,.2],['Antorcha',36,36,36,1,.05],['Mesa de trabajo',32,33,8,0,.8],['Cama',34,35,8,0,.3]];
const TORCH=28,MESA=29,BED=30;
const WATER=10,LAMP=16,BASE=17,LEAVES=6,PINE=27,LOG=5,PLANK=7,GLASS=8,BRICK=9,SMOOTH=19,SANDST=26,PATH=25,PUMPKIN=22,GOLD=18,BLUE=20,SNOW=11,SAND=4,STONE=3,DIRT=2,GRASS=1;
const solid=id=>id&&id!==WATER&&id!==TORCH;const opaque=id=>id&&!B[id][4];
/* ---------- texturas pixeladas (16x16) ---------- */
const TS=16,AC=8,AR=8,atlas=document.createElement('canvas');atlas.width=TS*AC;atlas.height=TS*AR;const ag=atlas.getContext('2d');
let rs=1;const rr=()=>(rs=(rs*16807)%2147483647)/2147483647;
function tile(i,fn){const ox=(i%AC)*TS,oy=Math.floor(i/AC)*TS;rs=i*977+13;for(let y=0;y<TS;y++)for(let x=0;x<TS;x++){const c=fn(x,y);if(!c)continue;ag.fillStyle=c;ag.fillRect(ox+x,oy+y,1,1)}}
const sh=(hex,k)=>{const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;r=Math.max(0,Math.min(255,r*k|0));g=Math.max(0,Math.min(255,g*k|0));b=Math.max(0,Math.min(255,b*k|0));return `rgb(${r},${g},${b})`};
const noisy=(base,a)=>()=>sh(base,1-a/2+rr()*a);
// ruido suave por casilla para que las texturas tengan manchas y no puntos sueltos
const sn=(i,x,y,f)=>{const h=(a,b)=>{let n=(a*73856093^b*19349663^i*83492791)>>>0;n=(n^(n>>>13))*1274126177>>>0;return (n%1000)/1000};const X=x/f,Y=y/f,xi=Math.floor(X),yi=Math.floor(Y),xf=X-xi,yf=Y-yi;
  const w=(a,b)=>h(((a%Math.ceil(16/f))+99)%Math.ceil(16/f),((b%Math.ceil(16/f))+99)%Math.ceil(16/f));const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const A=w(xi,yi),B2=w(xi+1,yi),C=w(xi,yi+1),D2=w(xi+1,yi+1);return A+(B2-A)*u+(C-A)*v+(A-B2-C+D2)*u*v};
const PAL=(cols,t)=>cols[Math.max(0,Math.min(cols.length-1,Math.floor(t*cols.length)))];
const GR=['#3f8f2c','#4ba332','#57b53a','#63c544','#71d04f'],DI=['#5e3b22','#6e4529','#7d5131','#8c5d39','#9a6a44'],ST=['#6d7179','#7b8088','#888d95','#959aa1','#a3a7ad'];
// hierba arriba: matas de tonos con tréboles y alguna florecita
tile(0,(x,y)=>{const t=sn(0,x,y,4)*.7+rr()*.3;if((x*7+y*3)%29===0)return '#f5e663';if((x*5+y*11)%37===0)return '#ffffff';return PAL(GR,t)});
// hierba de lado: tierra con borde de hierba ondulado
tile(1,(x,y)=>{const edge=3+Math.round(Math.sin(x*1.3)*1.2+(x%3===0?1:0));if(y<edge)return PAL(GR,sn(1,x,y,3)*.6+rr()*.4);if(y===edge)return '#356e25';const t=sn(2,x,y,4)*.6+rr()*.4;return (x*3+y*7)%23===0?'#b9a58a':PAL(DI,t)});
// tierra con piedrecitas
tile(2,(x,y)=>{const t=sn(2,x,y,4)*.6+rr()*.4;return (x*3+y*7)%23===0?'#b9a58a':(x*11+y*5)%31===0?'#4a2e1a':PAL(DI,t)});
// piedra en capas con grietas
tile(3,(x,y)=>{const band=Math.floor((y+Math.round(sn(3,x,0,8)*2))/5);const t=sn(3+band,x,y,3)*.65+rr()*.35;const crack=(y===((x*2+5)%16)&&x>3&&x<10)||(x===12&&y>8&&y<13);
  return crack?'#4c5057':((y+Math.round(sn(3,x,0,8)*2))%5===4?'#646870':PAL(ST,t))});
// arena con ondas
tile(4,(x,y)=>{const w=Math.sin((x+y*2.2)*.7)>.82;const t=sn(4,x,y,3)*.5+rr()*.5;return w?'#cdb877':PAL(['#d8c487','#e2d095','#ebdaa2','#f2e3b0'],t)});
// tronco por arriba: anillos y corteza
tile(5,(x,y)=>{const d=Math.hypot(x-7.5,y-7.5)+sn(5,x,y,4)*1.2;if(d>7.2)return PAL(['#4a3220','#5a3d26','#664629'],rr());return Math.floor(d*1.1)%2?'#c09060':'#a87a4c'});
// tronco de lado: corteza con surcos
tile(6,(x,y)=>{const g=(x+Math.round(sn(6,0,y,5)*2))%4===0;const t=sn(6,x,y,3)*.5+rr()*.5;return g?'#3e2a1a':PAL(['#5a3d26','#664629','#73502f','#7f5a35'],t)});
// hojas: racimos con huecos y brillos
tile(7,(x,y)=>{const t=sn(7,x,y,3);if(t<.22&&rr()<.7)return null;if((x*5+y*3)%19===0)return '#9be070';return PAL(['#24692a','#2e7d32','#38913b','#43a047','#4caf50'],t*.7+rr()*.3)});
// tablas: vetas y clavos
tile(8,(x,y)=>{const row=Math.floor(y/4),off=(row%2)*8;if(y%4===3)return '#6b4a26';if((x+off)%16===0)return '#7a5530';if(y%4===1&&((x+off)%16===2||(x+off)%16===13))return '#3a3a3a';
  const vet=Math.sin((x+row*5)*.9+sn(8,x,row,4)*3)>.75;return vet?'#b0844b':PAL(['#c39456','#cc9e5f','#d4a868'],sn(8+row,x,y,4)*.6+rr()*.4)});
tile(9,(x,y)=>(x===0||y===0||x===15||y===15)?'rgba(225,242,255,.95)':(x===y+2||x===y+3)&&x>3&&x<12?'rgba(255,255,255,.75)':(x===y-6&&x>2&&x<7)?'rgba(255,255,255,.55)':'rgba(190,225,255,.16)');
// ladrillo con mortero y desgaste
tile(10,(x,y)=>{const row=Math.floor(y/4),off=(row%2)*4;if(y%4===3||(x+off)%8===0)return sh('#d9d2c3',.92+rr()*.12);const t=sn(10+row*3+Math.floor((x+off)/8),x,y,3);return PAL(['#8f3424','#a13d2a','#b04530','#bd5038'],t*.6+rr()*.4)});
tile(11,(x,y)=>{const w=Math.sin(x*.8+y*.35)*.5+Math.sin(y*1.1-x*.3)*.5;return `rgba(${40+w*18|0},${105+w*25|0},${215+w*15|0},${.66+w*.06})`});
// nieve con brillos azulados
tile(12,(x,y)=>(x*7+y*13)%41===0?'#ffffff':PAL(['#dfe9f5','#e8f0fa','#f1f6fd','#f8fbff'],sn(12,x,y,4)*.6+rr()*.4));
tile(13,(x,y)=>{const edge=4+Math.round(Math.sin(x*1.1)*1.3);if(y<edge)return PAL(['#e8f0fa','#f1f6fd','#f8fbff'],rr());if(y===edge)return '#c9d8ea';return PAL(DI,sn(13,x,y,4)*.6+rr()*.4)});
// lanas: tejido en cuadritos
[[14,'#d23c3c'],[15,'#3657c9'],[16,'#e9c33a'],[17,'#4caf45'],[27,'#eef0f2'],[28,'#2a2c33']].forEach(([i,c])=>tile(i,(x,y)=>{const k=(x%4<2)!==(y%4<2)?.9:1.02;return sh(c,k*(.95+rr()*.08)*(x%4===3||y%4===3?.86:1))}));
// lámpara: marco de madera y cristal con brillo
tile(18,(x,y)=>{if(x<2||y<2||x>13||y>13)return PAL(['#5a3d26','#6b4a2a'],rr());if(x===7||x===8||y===7||y===8)return '#6b4a2a';const d=Math.hypot(x-7.5,y-7.5);return d<3?'#fffbe0':PAL(['#ffd54a','#ffe27a','#ffeb99'],1-d/8+rr()*.2)});
tile(19,(x,y)=>PAL(['#26262b','#303036','#3b3b42','#47474e'],sn(19,x,y,2)*.7+rr()*.3));
// minerales: cristales tallados metidos en la piedra

    if(mode==='aventura'&&hp<10&&(regenT+=dt)>5){regenT=0;hp++;drawHearts()}
    let fx=0,fz=0;if(keys.w||keys.arrowup)fz-=1;if(keys.s||keys.arrowdown)fz+=1;if(keys.a||keys.arrowleft)fx-=1;if(keys.d||keys.arrowright)fx+=1;if(joy){fx+=joy.dx/50;fz+=joy.dy/50}

    const breaking=((mouseDown===0&&locked)||tBreak)&&!(mm&&(!h||mm.t<h.t));
    if(breaking&&h){const key=h.x+','+h.y+','+h.z;if(brk.key!==key){brk.key=key;brk.t=0}brk.t+=dt;const need=mode==='creativo'?.18:mineTime(h.id);
      crack.visible=true;crack.position.copy(sel3.position);crack.material.opacity=Math.min(.6,brk.t/need*.6);if(brk.t>=need){breakAt(h);brk.t=0;brk.key=''}}else{crack.visible=false;if(!breaking)brk.t=0}

  }

  const light=Math.max(.16,Math.min(1,.32+sun*1.15));

  if(started){const tb=terrain(Math.floor(P.x),Math.floor(P.z)).b;let near='';const S=structure(Math.floor(P.x/RG),Math.floor(P.z/RG));if(S&&Math.hypot(S.x-P.x,S.z-P.z)<30)near=S.name;
    J.hud([[mode==='creativo'?'Creativo':'Aventura',P.fly?'Volando':''],[sunUp?'Día':'Noche',''],[near||BIO[tb],''],['Posición',`${Math.floor(P.x)} ${Math.floor(P.y)} ${Math.floor(P.z)}`],mode==='aventura'&&kills?['Monstruos',kills]:null])}
  renderer.render(scene,camera);requestAnimationFrame(loop)}
