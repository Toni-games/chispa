<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Caída Libre</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
body{background:#0c1630}
.pad{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:20;display:none;gap:12px}
body.k-touch .pad{display:flex}
.pad button{width:74px;height:74px;border-radius:50%;border:3px solid #000;font:900 26px system-ui;color:#000;touch-action:none;box-shadow:inset 0 -5px 0 rgba(0,0,0,.25)}

</style>
</head>
<body>
<canvas id="c"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../graficos.js"></script>
<script src="../avatar.js"></script>
<script src="../kit.js"></script>
<script src="../audio.js"></script>
<script src="comun.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="../multi.js"></script>
<script src="../sala.js"></script>
<script>
const K=Kit,J=Juego,$=s=>document.querySelector(s);
addEventListener('touchstart',()=>document.body.classList.add('k-touch'),{once:true,passive:true});

/* Caída Libre: caes por un pozo enorme. Muévete para pasar por los huecos de las placas y coger aros. Cada vez caes más rápido. */
const {renderer,scene,camera,sun,hemi}=K.setup({sky:0x0c1630,fogNear:20,fogFar:90,shadows:false});hemi.intensity=1.05;
const S=7;// medio ancho del pozo
const walls=new THREE.Group();scene.add(walls);
const WC=[0x3fa7ff,0xb48cff,0xff6fae,0x3fd15c];
for(let i=0;i<12;i++){const y=-i*8,c=K.M(WC[i%4]);[[S+.5,0,1,8,2*S+2],[-S-.5,0,1,8,2*S+2],[0,S+.5,2*S+2,8,1],[0,-S-.5,2*S+2,8,1]].forEach(([x,z,w,h,d])=>K.box(w,h,d,c,x,y,z,walls));
  [[S,S],[S,-S],[-S,S],[-S,-S]].forEach(([x,z])=>K.box(.6,8,.6,new THREE.MeshBasicMaterial({color:0xffffff}),x,y,z,walls))}
const a=K.person(scene,null,null,.75);a.root.rotation.x=Math.PI/2;
const ctl=K.controls(renderer.domElement,{joystick:true,jumpLabel:'FRENAR'});
let px=0,pz=0,vx=0,vz=0,depth=0,speed=14,running=false,lives=3,inv=0,rings=0,plates=[],nextY=-40,R=Math.random,brake=1;
const PM=[K.M(0xe5484d),K.M(0xff9f1c),K.M(0xffd166),K.M(0x1f2937)];
function plate(y){const g=new THREE.Group();const hs=Math.max(2.1,3.4-depth/900),hx=(R()*2-1)*(S-hs),hz=(R()*2-1)*(S-hs),m=PM[Math.floor(R()*3)];
  const x0=-S,x1=S,z0=-S,z1=S;const add=(ax,bx,az,bz)=>{if(bx-ax<.05||bz-az<.05)return;K.box(bx-ax,.6,bz-az,m,(ax+bx)/2,0,(az+bz)/2,g)};
  add(x0,hx-hs,z0,z1);add(hx+hs,x1,z0,z1);add(hx-hs,hx+hs,z0,hz-hs);add(hx-hs,hx+hs,hz+hs,z1);
  const edge=new THREE.Mesh(new THREE.RingGeometry(hs*1.05,hs*1.3,4,1),new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide}));edge.rotation.set(Math.PI/2,0,Math.PI/4);edge.position.set(hx,.32,hz);g.add(edge);
  g.position.y=y;scene.add(g);const p={g,y,hx,hz,hs,passed:false};
  if(depth>250&&R()<.35){p.move=(R()<.5?1:-1)*(1+R()*1.5);p.hx0=hx}
  plates.push(p);
  if(R()<.7){const r=new THREE.Mesh(new THREE.TorusGeometry(1,.15,8,20),new THREE.MeshBasicMaterial({color:0xffd54a}));r.rotation.x=Math.PI/2;const rx=(R()*2-1)*(S-1.5),rz=(R()*2-1)*(S-1.5);r.position.set(rx,y+6,rz);scene.add(r);plates.push({ring:r,y:y+6,x:rx,z:rz})}}
function reset(sd){R=sd?Sala.rng(sd):Math.random;plates.forEach(p=>scene.remove(p.g||p.ring));plates=[];px=pz=vx=vz=0;depth=0;speed=14;lives=3;inv=0;rings=0;nextY=-40;for(let y=-40;y>-160;y-=14)plate(y);nextY=-160}
function hit(){if(inv>0)return;lives--;inv=1.6;J.sfx('hit');K.toast('¡AY!',lives>0?'Te quedan '+lives+(lives===1?' vida':' vidas'):'','#e5484d');if(lives<=0)over()}
function over(){running=false;J.sfx('lose');const score=Math.floor(depth)+rings*20;const rec=J.saveBest('caida',score,true);if(window.Sala)Sala.score(score);
  setTimeout(()=>J.end({title:'¡AL SUELO!',col:'#3fa7ff',lines:[`Profundidad: <b style="color:#ffcc33">${Math.floor(depth)} m</b> · Aros: ${rings}`,`Puntos: <b style="color:#ffcc33">${score}</b>`,`Récord: ${J.best('caida')}`],record:rec,onAgain(){reset();running=true}}),700)}
let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;
  if(running){speed=Math.min(40,speed+dt*.45);brake=ctl.jump()?.55:1;const dy=speed*brake*dt;depth+=dy;inv=Math.max(0,inv-dt);
    const mv=ctl.move();// el control va en pantalla: arriba = -z
    let mx=mv.x,mz=mv.z;vx+=(mx*11-vx)*Math.min(1,dt*8);vz+=(mz*11-vz)*Math.min(1,dt*8);px=Math.max(-S+.6,Math.min(S-.6,px+vx*dt));pz=Math.max(-S+.6,Math.min(S-.6,pz+vz*dt));
    walls.children.forEach(m=>{m.position.y+=dy;if(m.position.y>8)m.position.y-=96});
    for(let i=plates.length-1;i>=0;i--){const p=plates[i];p.y+=dy;
      if(p.ring){p.ring.position.y=p.y;p.ring.visible=p.y<1.5&&!p.got;p.ring.rotation.z+=dt*2;if(!p.got&&Math.abs(p.y)<.8&&Math.hypot(px-p.x,pz-p.z)<1.3){p.got=true;rings++;J.sfx('coin');scene.remove(p.ring)}if(p.y>10){scene.remove(p.ring);plates.splice(i,1)}continue}
      if(p.move){p.hx=p.hx0+Math.sin(t/1000*p.move)*2;p.g.children.forEach(()=>{});p.g.position.x=p.hx-p.hx0}
      p.g.position.y=p.y;p.g.visible=p.y<1.2;
      if(!p.passed&&p.y>-.2){p.passed=true;const inside=Math.abs(px-p.hx)<p.hs-.35&&Math.abs(pz-p.hz)<p.hs-.35;if(!inside)hit();else J.sfx('whoosh')}
      if(p.y>12){scene.remove(p.g);plates.splice(i,1)}}
    nextY+=dy;while(nextY>-160){plate(nextY-Math.max(9,14-depth/300));nextY-=Math.max(9,14-depth/300)}
    if(window.Sala&&Math.floor(depth/30)!==Math.floor((depth-dy)/30))Sala.score(Math.floor(depth)+rings*20);
    J.hud([['Profundidad',Math.floor(depth)+' m'],['Aros',rings],['Vidas','♥'.repeat(Math.max(0,lives))]])}
  a.root.position.set(px,.0,pz);a.root.visible=!(inv>0&&Math.floor(t/90)%2);
  a.armL.rotation.z=-1.2+Math.sin(t/120)*.15;a.armR.rotation.z=1.2-Math.sin(t/120)*.15;a.legL.rotation.x=Math.sin(t/150)*.3;a.legR.rotation.x=-Math.sin(t/150)*.3;
  camera.position.set(px*.35,9,pz*.35+2.5);camera.lookAt(px*.5,-10,pz*.5);
  renderer.render(scene,camera);requestAnimationFrame(loop)}
Sala.init({game:'caida',remote:false,board:{label:'Puntos'},shared:'Al empezar todos a la vez, las placas salen igual para todos.',onStart(sd){J.closePanels();reset(sd);running=true}});
reset();J.music('neon');
J.start({title:'CAÍDA LIBRE',col:'#3fa7ff',sub:'Caes por un pozo sin fondo. Colócate encima del hueco de cada placa para pasar sin chocar y coge los aros dorados.',
  howto:['<b>WASD</b> / flechas o joystick para moverte','<b>ESPACIO</b> o el botón FRENAR para caer más despacio','Tienes 3 vidas. Cada aro vale 20 puntos'],
  record:J.best('caida')!=null?J.best('caida')+' puntos':null,onStart(){running=true}});
requestAnimationFrame(loop);

</script>
</body>
</html>
