<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a1d24">
<meta name="description" content="Plataforma de juegos con avatar, catálogo, pases y multijugador con amigos.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<title>Cubiverso</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=Rubik+Mono+One&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: plataforma de juegos. Barra superior fija, menú lateral (abajo en móvil), contenido por secciones; los juegos se abren a pantalla completa */
:root{
  --bg:#111318; --panel:#1a1d24; --panel2:#242833; --line:rgba(255,255,255,.08); --fg:#f1f3f7; --muted:#9aa2b4;
  --brand:#ffb020; --brand-ink:#2a1a00; --play:#21c063; --play-ink:#032b14; --danger:#ff5a5f; --sel:#4b93ff;
  --f-ui:"Rubik","Segoe UI",system-ui,sans-serif; --f-logo:"Rubik Mono One","Arial Black",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#eef0f4; --panel:#ffffff; --panel2:#f2f4f8; --line:rgba(17,19,24,.1); --fg:#151821; --muted:#5d6577;
  --brand:#f29d00; --brand-ink:#2a1a00; --play:#16a34a; --play-ink:#ffffff; --danger:#e23b41; --sel:#2563eb; color-scheme:light}}
:root[data-theme="light"]{--bg:#eef0f4; --panel:#ffffff; --panel2:#f2f4f8; --line:rgba(17,19,24,.1); --fg:#151821; --muted:#5d6577;
  --brand:#f29d00; --brand-ink:#2a1a00; --play:#16a34a; --play-ink:#ffffff; --danger:#e23b41; --sel:#2563eb; color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
button:disabled{opacity:.5;cursor:not-allowed}
a{color:inherit}
.cube{width:1.1em;height:1.1em;vertical-align:-.18em;flex:none}
/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.top .in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-family:var(--f-logo);font-size:17px;letter-spacing:.02em;white-space:nowrap}
.logo .cube{width:30px;height:30px}
.search{flex:1;min-width:0;max-width:440px;margin-inline:auto;position:relative}
.search input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px 9px 36px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;fill:none;stroke:var(--muted);stroke-width:2.2}
.pill{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;font-variant-numeric:tabular-nums;text-decoration:none;white-space:nowrap}
.me{width:38px;height:38px;border-radius:50%;background:var(--panel2);border:2px solid var(--line);overflow:hidden;flex:none;display:block}
.me img{width:100%;height:100%;object-fit:cover;display:block}
/* estructura */
.shell{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);align-self:start;display:flex;flex-direction:column;gap:4px}
.side a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;text-decoration:none;font-weight:500;color:var(--muted)}
.side a svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;flex:none}
.side a:hover{background:var(--panel2);color:var(--fg)}
.side a.on{background:var(--panel2);color:var(--fg);font-weight:700}
.side a.on svg{stroke:var(--brand)}
main{min-width:0}
h1{font-size:28px;font-weight:800;margin:0 0 4px;text-wrap:balance}
h2{font-size:19px;font-weight:700;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 18px}
.sec{display:flex;flex-direction:column;gap:12px;margin-bottom:28px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-h a{color:var(--sel);font-weight:500;text-decoration:none;font-size:14px}
/* tarjetas de juego */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.gcard{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:8px;border-radius:12px}
.gcard .th{aspect-ratio:16/9;width:100%;max-width:100%;border-radius:12px;background:var(--panel2) center/cover no-repeat;transition:transform .15s}
.gcard:hover .th{transform:translateY(-3px)}
.gcard .th{position:relative}
.gcard .new{position:absolute;top:8px;left:8px;background:var(--brand);color:var(--brand-ink);font-size:11px;font-weight:800;border-radius:999px;padding:2px 9px}
.gcard b{font-size:15px}
.studio{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;border-radius:16px;padding:20px;background:linear-gradient(120deg,#0b4f86,#00a2ff 60%,#43c6ff);color:#fff;overflow:hidden;position:relative}
.studio h2{margin:0 0 4px;font-size:24px}.studio p{margin:0;opacity:.92;max-width:52ch}
.studio .btn{background:#fff;color:#0b4f86;border-color:transparent;font-size:16px;padding:12px 20px}
.studio svg.big{position:absolute;right:-20px;bottom:-30px;width:170px;height:170px;opacity:.18;pointer-events:none}
@media (max-width:560px){.studio{grid-template-columns:1fr}}
.gcard .by{position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px}
.cmine{display:flex;flex-direction:column;gap:6px}.cmine .btn{padding:5px 10px;font-size:12px;align-self:flex-start}
.gcard span{color:var(--muted);font-size:13px;margin-top:-6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:500;color:var(--muted)}
.chip.ok{color:var(--play);border-color:color-mix(in srgb,var(--play) 40%,transparent)}
/* inicio */
.hello{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:28px}
.hello .face{width:84px;height:84px;border-radius:50%;background:var(--panel2);overflow:hidden}
.hello .face img{width:100%;height:100%;display:block}
.daily{display:flex;flex-direction:column;align-items:flex-end;gap:6px;text-align:right}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;background:var(--panel2);border:1px solid var(--line)}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn.play{background:var(--play);color:var(--play-ink);border-color:transparent}
.btn.brand{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.btn.danger{background:var(--danger);color:#fff;border-color:transparent}
.btn.big{padding:14px 26px;font-size:17px;border-radius:12px;display:inline-flex;align-items:center;gap:10px}
.btn.big svg{width:20px;height:20px}
/* avatar */
.av{display:grid;grid-template-columns:minmax(260px,380px) minmax(0,1fr);gap:24px;align-items:start}
.stage{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);aspect-ratio:3/4;width:100%;max-width:100%;border-radius:16px;overflow:hidden;background:radial-gradient(120% 80% at 50% 10%,var(--panel2),var(--panel));border:1px solid var(--line);touch-action:none}
.stage canvas{width:100%;height:100%;display:block;cursor:grab}
.stage .hint{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:12px;color:var(--muted);pointer-events:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 14px;font-weight:500;font-size:14px;color:var(--muted)}
.tab.on{background:var(--fg);color:var(--bg);border-color:transparent;font-weight:700}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px}
.item{position:relative;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;text-align:left}
.item:hover{border-color:color-mix(in srgb,var(--sel) 50%,var(--line))}
.item.on{border-color:var(--sel)}
.item .pic{aspect-ratio:1;width:100%;max-width:100%;border-radius:8px;background:var(--panel2) center/contain no-repeat}
.item .sw{aspect-ratio:1;width:100%;border-radius:8px}
.item b{font-size:13px;font-weight:500;line-height:1.25}
.item .pr{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.item .pr.free{color:var(--muted);font-weight:500}
.item .pr.own{color:var(--play)}
.item .eqd{position:absolute;top:12px;right:12px;background:var(--sel);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:2px 8px}
/* cubos */
.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.pack{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;position:relative}
.pack .stack{height:64px;display:flex;align-items:flex-end;justify-content:center}
.pack .amt{font-size:22px;font-weight:800;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.pack .tagp{position:absolute;top:-10px;background:var(--brand);color:var(--brand-ink);font-size:11px;font-weight:800;border-radius:999px;padding:2px 10px}
.pack .btn{width:100%}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-transform:uppercase}
.field.nocase{text-transform:none}
.hist{display:flex;flex-direction:column}
.hist div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.hist div:first-child{border-top:0}
.hist b{font-variant-numeric:tabular-nums}
.pos{color:var(--play)}.neg{color:var(--danger)}
.test{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--brand) 14%,transparent);border:1px solid color-mix(in srgb,var(--brand) 45%,transparent);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:16px}
/* modal */
.ov{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:100%;max-width:560px;max-height:90vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.5)}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.modal .mb{padding:16px;display:flex;flex-direction:column;gap:12px}
.x{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-size:18px;line-height:1}
.banner{aspect-ratio:16/9;width:100%;max-width:100%;border-radius:12px;background:var(--panel2) center/cover}
.pass-row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel2)}
.pass-row small{display:block;color:var(--muted);font-size:13px;line-height:1.35}
.pass-ic{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.method{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
.method.on{border-color:var(--sel)}
.method input{margin-top:4px}
.method small{display:block;color:var(--muted)}
.sum{display:flex;justify-content:space-between;font-weight:700;font-variant-numeric:tabular-nums}
.big-ok{font-size:40px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--play)}
/* juego abierto */
#play{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column}
#play .bar{flex:none;display:flex;align-items:center;gap:10px;background:#0b0c10;color:#f1f3f7;padding:6px max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px));padding-top:calc(6px + env(safe-area-inset-top,0px))}
#play .bar b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#play .bar .btn{padding:6px 12px;font-size:13px;background:#242833;border-color:rgba(255,255,255,.1);color:#f1f3f7}
#play .bar .pill{background:#242833;border-color:rgba(255,255,255,.1);color:#f1f3f7;padding:4px 10px}
#play iframe{flex:1;width:100%;border:0;background:#000}
#gpanel{position:absolute;top:calc(52px + env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));background:#1a1d24;color:#f1f3f7;border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:4px;min-width:220px;box-shadow:0 16px 40px rgba(0,0,0,.5)}
#gpanel button{background:none;border:0;text-align:left;padding:10px 12px;border-radius:8px;font-weight:500;color:#f1f3f7}
#gpanel button:hover{background:#242833}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 16px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:calc(100vw - 32px)}
/* música */
.musb{width:38px;height:38px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;flex:none;padding:0}
.musb svg{width:18px;height:18px;fill:none;stroke:var(--fg);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.musb.on{background:var(--brand);border-color:transparent}.musb.on svg{stroke:var(--brand-ink)}
.musb.on svg{animation:pulse 1s ease-in-out infinite alternate}@keyframes pulse{to{transform:scale(1.15)}}
.now{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center}
.now .disc{width:64px;height:64px;border-radius:14px;background:conic-gradient(from 0deg,var(--brand),var(--sel),var(--play),var(--brand));display:grid;place-items:center}
.now .disc svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.now.playing .disc{animation:spin 6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.now b{display:block;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.now small{color:var(--muted)}
.ctl{display:flex;gap:6px}.ctl .btn{padding:10px 12px;min-width:44px}
.tracks{display:flex;flex-direction:column;gap:6px}
.trk{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--panel)}
.trk.on{border-color:var(--brand)}
.trk .pb{width:40px;height:40px;border-radius:50%;border:0;background:var(--panel2);display:grid;place-items:center;padding:0}
.trk.on .pb{background:var(--brand);color:var(--brand-ink)}
.trk .pb svg{width:16px;height:16px}
.trk b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.trk small{color:var(--muted)}
.sl{display:grid;grid-template-columns:110px minmax(0,1fr) 44px;gap:10px;align-items:center}
.sl input{width:100%;accent-color:var(--brand)}
.sel{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--fg);font:inherit;max-width:100%}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.board .btn{padding:12px 8px;font-size:13px}
.upl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:2px dashed var(--line);border-radius:12px;padding:14px}
.upl.drag{border-color:var(--brand)}
.demo{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;justify-content:center}.demo .btn{padding:7px 12px;font-size:13px}.demo .btn.on{background:var(--sel);color:#fff;border-color:transparent}
.item .desc{font-size:11px;color:var(--muted);line-height:1.3}
/* cuentas */
#gate{position:fixed;inset:0;z-index:80;background:var(--bg);overflow:auto;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
#gate .gbox{width:min(420px,100%);display:flex;flex-direction:column;gap:16px}
#gate .glogo{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
#gate .glogo svg{width:72px;height:72px}#gate .glogo b{font-family:var(--f-logo);font-size:26px;letter-spacing:.03em}
#gate .glogo span{color:var(--muted)}
.gtabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--panel2);border-radius:12px;padding:4px}
.gtabs button{border:0;background:none;border-radius:9px;padding:9px 4px;font-weight:700;font-size:13px;color:var(--muted)}
.gtabs button[aria-selected=true]{background:var(--panel);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.gform{display:flex;flex-direction:column;gap:12px}
.gform label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px}
.gform input,.gform textarea{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--fg);font:inherit;font-weight:500;width:100%;box-sizing:border-box}
.gform textarea{min-height:90px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all}
.gform .btn{padding:13px;font-size:16px}
.gmsg{min-height:20px;font-size:14px;color:var(--danger);margin:0}.gmsg.ok{color:var(--play)}
.gnote{font-size:13px;color:var(--muted);margin:0;line-height:1.5}
.gnote b{color:var(--fg)}
.cloudtag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--panel2)}
.cloudtag i{width:8px;height:8px;border-radius:50%;background:var(--muted)}.cloudtag.ok i{background:var(--play)}.cloudtag.err i{background:var(--danger)}.cloudtag.sync i{background:var(--brand)}
.codebox{width:100%;box-sizing:border-box;min-height:80px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--fg);font-family:ui-monospace,Menlo,monospace;font-size:11px;word-break:break-all}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr);padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
  .side{position:fixed;inset:auto 0 0 0;top:auto;z-index:25;flex-direction:row;justify-content:space-around;background:var(--panel);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));gap:0}
  .side a{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 2px;min-width:0;flex:1;justify-content:center;text-align:center}
  .av{grid-template-columns:minmax(0,1fr)}
  .stage{position:relative;top:0;aspect-ratio:1;max-height:56vh;margin-inline:auto}
  .hello{grid-template-columns:auto minmax(0,1fr)}
  .daily{grid-column:1/-1;align-items:flex-start;text-align:left}
  #toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}

function dispose(o){o.traverse(m=>{if(m.geometry)m.geometry.dispose();if(m.material){(Array.isArray(m.material)?m.material:[m.material]).forEach(mt=>{if(mt.map)mt.map.dispose();mt.dispose()})}})}
const VIEWS={head:[[.55,2.0,2.1],[0,1.97,0]],hat:[[.6,2.25,2.5],[0,2.12,0]],torso:[[.7,1.25,2.7],[0,1.15,0]],legs:[[.6,.6,2.5],[0,.45,0]],back:[[-1.3,1.45,-2.7],[0,1.15,0]],full:[[1.4,1.6,5],[0,1.05,0]]};
const CATVIEW={piel:'head',cara:'head',cabeza:'hat',accesorio:'head',camiseta:'torso',pantalon:'legs',espalda:'back',animacion:'full',gesto:'full'};
function renderThumb(eq,view,pose){if(!TR&&webgl)thumbSetup();if(!webgl)return '';const av=A.makeAvatar(THREE,eq);TSc.add(av.root);if(pose)try{pose(av)}catch(e){}
  const[p,l]=VIEWS[view]||VIEWS.full;TC.position.set(...p);TC.lookAt(...l);TR.render(TSc,TC);const url=String(TR.domElement.toDataURL()||'');TSc.remove(av.root);dispose(av.root);return url}
const thumbs={};
function itemThumb(it){if(thumbs[it.id]!==undefined)return thumbs[it.id];const eq=Object.assign({},A.DEF_EQ,{[it.cat]:it.id});let pose=null;
  if(it.cat==='animacion')pose=av=>{av.root.rotation.y=-.6;A.animate(av,{walk:1.25,moving:1,dt:.016,pack:it.id})};
  if(it.cat==='gesto')pose=av=>{av.root.rotation.y=-.4;A.emote(av,it.id);const n=Math.round((it.dur||2.5)*.42/.1);for(let k=0;k<n;k++)A.animate(av,{dt:.1,moving:0})};
  return thumbs[it.id]=renderThumb(eq,CATVIEW[it.cat],pose)}

async function gateSubmit(e){e.preventDefault();const k=e.target.dataset.k,msg=$('#gmsg'),btn=e.target.querySelector('button[type=submit]');
  const name=($('#acname')||{}).value,pass=$('#gpass').value;msg.className='gmsg';

  btn.disabled=true;const old=btn.textContent;btn.textContent='Un momento…';msg.textContent='';
  try{let r;
    if(k==='crear'){try{await CC.crear(name,pass)}catch(err){if(CC.nube&&/conexión/.test(CC.nice(err))){msg.innerHTML='No hay conexión con el servidor. <button type="button" class="btn" id="glocal" style="padding:6px 10px;font-size:13px">Crearla solo en este dispositivo</button>';
        $('#glocal').onclick=async()=>{await CC.crear(name,pass,true);gateDone('¡Cuenta creada!')};throw null}throw err}
      gateDone('¡Cuenta creada! Bienvenido, '+name.trim())}

  }catch(err){if(err){msg.textContent=CC.nice(err).replace(/^Algo ha fallado: /,'');if(Au)Au.sfx('error')}}

let pendingPack=null,method='gift';

function redeem(code){code=(code||'').trim().toUpperCase();if(!code){toast('Escribe un código');return}

function blankGrid(){return new Array(1024).fill(null)}
function hexRGB(h){h=String(h).replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h.slice(0,6),16)||0;return [n>>16&255,n>>8&255,n&255]}

function nearestIdx(pal,c){const[r,g,b]=hexRGB(c);let bi=0,bd=1e9;pal.forEach((p,i)=>{const[R,G,B]=hexRGB(p);const d=(r-R)**2+(g-G)**2+(b-B)**2;if(d<bd){bd=d;bi=i}});return bi}
function gridToArt(gr){if(!gr||!gr.some(Boolean))return null;const freq={};gr.forEach(c=>{if(c)freq[c]=(freq[c]||0)+1});
  const pal=Object.keys(freq).sort((a,b)=>freq[b]-freq[a]).slice(0,62);let px='';
  for(let i=0;i<1024;i++){const c=gr[i];if(!c){px+='.';continue}let n=pal.indexOf(c);if(n<0)n=nearestIdx(pal,c);px+=A.ART_ABC[n]}return {pal,px}}
function artToGrid(art){const g=blankGrid();if(!art)return g;for(let i=0;i<1024;i++){const ch=art.px[i];if(ch==='.')continue;g[i]=art.pal[A.ART_ABC.indexOf(ch)]||null}return g}

function drawPainter(){const cv=$('#pcv');if(!cv)return;const g=cv.getContext('2d'),k=10,flat=FLAT[TW.d.cat];
  const bg=TW.d.cat==='cara'?skinCol():flat?TW.d.col:null;
  for(let y=0;y<32;y++)for(let x=0;x<32;x++){g.fillStyle=bg||(((x+y)&1)?'#c9ced8':'#e6e9ef');g.fillRect(x*k,y*k,k,k)}
  TW.grid.forEach((c,i)=>{if(c){g.fillStyle=c;g.fillRect((i%32)*k,Math.floor(i/32)*k,k,k)}});
  g.strokeStyle='rgba(0,0,0,.09)';g.lineWidth=1;g.beginPath();for(let i=1;i<32;i++){g.moveTo(i*k+.5,0);g.lineTo(i*k+.5,320);g.moveTo(0,i*k+.5);g.lineTo(320,i*k+.5)}g.stroke();
  g.strokeStyle='rgba(0,0,0,.25)';g.beginPath();g.moveTo(160.5,0);g.lineTo(160.5,320);g.stroke()}
function pushUndo(){TW.undo.push(TW.grid.slice());if(TW.undo.length>40)TW.undo.shift()}
function cellAt(e,cv){const r=cv.getBoundingClientRect();const x=Math.floor((e.clientX-r.left)/r.width*32),y=Math.floor((e.clientY-r.top)/r.height*32);return x<0||y<0||x>31||y>31?null:[x,y]}
function setCell(x,y,c){TW.grid[y*32+x]=c;if(TW.mirror)TW.grid[y*32+31-x]=c}
function flood(x,y,c){const t=TW.grid[y*32+x];if(t===c)return;const q=[[x,y]];while(q.length){const[a,b]=q.pop();if(a<0||b<0||a>31||b>31||TW.grid[b*32+a]!==t)continue;TW.grid[b*32+a]=c;q.push([a+1,b],[a-1,b],[a,b+1],[a,b-1])}}
function bindPainter(){const cv=$('#pcv');if(!cv)return;drawPainter();let down=false;
  const act=(e,first)=>{const p=cellAt(e,cv);if(!p)return;const[x,y]=p;
    if(TW.tool==='pick'){const c=TW.grid[y*32+x];if(c){TW.color=c;TW.tool='pen';render()}return}
    if(TW.tool==='fill'){if(first){flood(x,y,TW.color);if(TW.mirror)flood(31-x,y,TW.color)}}
    else setCell(x,y,TW.tool==='erase'?null:TW.color);drawPainter();pvSoon()};
  cv.addEventListener('pointerdown',e=>{e.preventDefault();down=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}if(TW.tool!=='pick')pushUndo();act(e,true)});
  cv.addEventListener('pointermove',e=>{if(down&&TW.tool!=='fill'&&TW.tool!=='pick')act(e,false)});
  const up=()=>{down=false};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up)}
function loadImage(file){if(!file||!/^image\//.test(file.type)){toast('Eso no parece una imagen');return}const rd=new FileReader();
  rd.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=32;const g=c.getContext('2d');const s=Math.min(32/im.width,32/im.height),w=im.width*s,h=im.height*s;
    g.drawImage(im,(32-w)/2,(32-h)/2,w,h);const px=g.getImageData(0,0,32,32).data;pushUndo();const q=v=>Math.round(v/32)*32;
    for(let i=0;i<1024;i++){const a=px[i*4+3];TW.grid[i]=a<110?null:toHex(q(px[i*4]),q(px[i*4+1]),q(px[i*4+2]))}drawPainter();pvSoon();toast('Imagen puesta. Puedes retocarla con el lápiz.')};
    im.onerror=()=>toast('No se ha podido abrir esa imagen');im.src=rd.result};rd.readAsDataURL(file)}
function tallerBind(){if(TW.step!=='edit'||!TW.d)return;const st0=$('#tstage');if(st0){mountPreview(st0);pvCam(TW.d.cat);pvDraft()}

/* --- guardar, publicar, compartir --- */
const newId=()=>'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function b64u(u8){let s='';for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function unb64u(t){t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const bs=atob(t),u=new Uint8Array(bs.length);for(let i=0;i<bs.length;i++)u[i]=bs.charCodeAt(i);return u}
async function gzip(u8,inv){if(!window.CompressionStream)return null;try{const cs=inv?new DecompressionStream('gzip'):new CompressionStream('gzip');return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(cs)).arrayBuffer())}catch(e){if(inv)throw e;return null}}
async function objCode(it){const d=A.clean(it);d.sold=0;const raw=new TextEncoder().encode(JSON.stringify(d));const z=await gzip(raw);return (z?'CUBIO1Z.':'CUBIO1.')+b64u(z||raw)}
async function readObjCode(c){c=String(c||'').replace(/\s+/g,'');const m=/^CUBIO1(Z?)\.(.+)$/.exec(c);if(!m)throw new Error('code');let u=unb64u(m[2]);if(m[1])u=await gzip(u,true);
  const d=A.clean(JSON.parse(new TextDecoder().decode(u)));if(!d)throw new Error('code');return d}
function clampInt(v,a,b,def){v=Math.round(+v);return isFinite(v)?Math.max(a,Math.min(b,v)):def}
async function tallerSave(){const msg=$('#tmsg'),d=TW.d;const name=String(d.name||'').trim();
  if(!name){msg.textContent='Ponle un nombre a tu objeto.';$('#tname').focus();return}
  const prev=TW.editing&&A.BY[TW.editing];
  let price=0,stock=0;if(TW.mode==='pub')price=clampInt(TW.price,0,2000,50);
  if(TW.mode==='lim'){price=clampInt(TW.lprice,100,5000,300);stock=prev&&prev.limited?prev.stock:clampInt(TW.stock,1,100,10);
    if(+TW.lprice<100){msg.textContent='Un objeto limitado cuesta como mínimo 100 Cubos.';return}}
  const def=Object.assign(draftDef(),{id:TW.editing||newId(),name,price,mode:TW.mode,stock,author:st.name||'Jugador',created:prev&&prev.created||Date.now()});
  const it=A.register(def);if(!it){msg.textContent='No se ha podido guardar.';return}
  st.custom[it.id]=A.clean(it);if(!st.mine.includes(it.id))st.mine.unshift(it.id);if(!st.owned.includes(it.id))st.owned.push(it.id);st.eq[it.cat]=it.id;
  delete thumbs[it.id];if(!TW.editing)addHist(`Taller: has creado «${it.name}»`,0);save();headKey='';
  let cloud='';if(CC&&CC.cfg&&CC.uid()){msg.textContent='Guardando…';try{if(it.mode==='me'){if(prev&&prev.mode!=='me')await cloudUnpub(it.id)}else await cloudPub(it);cloud=it.mode==='me'?'':'ok'}catch(e){cloud='err'}}
  if(Au)Au.sfx('levelup');TW={...TW,step:'home',d:null,grid:null,editing:null,undo:[]};if(PV)PV.eqOver=null;rebuildPV();
  if(view==='taller')render();doneModal(it,cloud)}
function doneModal(it,cloud){const u=itemThumb(it);
  const txt=it.mode==='me'?'Ya lo llevas puesto. Solo es tuyo: no sale en el catálogo.'
    :(cloud==='ok'?'Ya está en el catálogo para todos. Cada vez que alguien lo compre te llevas el 70%.':cloud==='err'?'Está en tu catálogo, pero no se ha podido subir a internet. Prueba a guardarlo otra vez más tarde.':'Ya lo llevas puesto y sale en tu catálogo. Para que tus amigos lo compren, pásales el código.')
    +(it.limited?` Es limitado: solo hay ${it.stock} unidades a ${fmtC(it.price)} Cubos.`:it.mode==='pub'?` Precio: ${it.price?fmtC(it.price)+' Cubos':'gratis'}.`:'');
  openModal('¡Objeto creado!',`<div style="display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;align-items:center"><span style="aspect-ratio:1;border-radius:14px;background:var(--panel2) center/contain no-repeat;${u?`background-image:url(${u})`:''}"></span>
    <div style="display:flex;flex-direction:column;gap:6px;min-width:0"><b style="font-size:18px">${esc(it.name)}</b>${limTag(it)}<span style="color:var(--muted)">${esc(txt)}</span></div></div>
    <div id="tcodebox"></div><div class="row"><button class="btn play" data-act="tseeav" data-id="${it.cat}">Verlo en mi avatar</button><button class="btn" data-act="tcode" data-id="${it.id}">Código para compartir</button><button class="btn" data-act="close">Cerrar</button></div>`)}
async function showCode(id){const it=A.BY[id];if(!it)return;const c=await objCode(it);if(!$('#tcodebox'))openModal('Código del objeto','<div id="tcodebox"></div><div class="row"><button class="btn" data-act="close">Cerrar</button></div>');
  $('#tcodebox').innerHTML=`<p style="margin:0 0 6px">Quien pegue este código en el <b>Catálogo → Creaciones → «Tengo un código de objeto»</b> podrá ${it.mode==='me'?'verlo (es solo tuyo, no se puede comprar)':it.price?`comprarlo por ${fmtC(it.price)} Cubos`:'llevárselo gratis'}.</p>
    <textarea class="field nocase" id="codetxt" readonly style="width:100%;min-height:90px;text-transform:none;font-family:ui-monospace,monospace;font-size:12px">${c}</textarea><div class="row" style="margin-top:6px"><button class="btn brand" data-act="copycode">Copiar código</button></div>`}

/* --- mercado en internet (solo si hay Firebase) --- */
const FSO=()=>`https://firestore.googleapis.com/v1/projects/${CC.cfg.projectId}/databases/(default)/documents/objetos`;
async function fsFetch(url,opt){const r=await fetch(url,opt);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error((j.error&&(j.error.status||j.error.message))||('HTTP '+r.status));return j}
function loadMercado(force){if(!CC||!CC.cfg||(MERC&&!force))return;MERC=MERC||{};
  fsFetch(FSO()+'?pageSize=200').then(j=>{(j.documents||[]).forEach(doc=>{const f=doc.fields||{};let d=null;try{d=JSON.parse(f.def.stringValue)}catch(e){}if(!d)return;
    const sold=+(f.sold&&f.sold.integerValue)||0;d.sold=sold;const it=A.register(d);if(!it)return;it.sold=sold;if(st.custom[it.id]){st.custom[it.id].sold=sold}
    MERC[it.id]={name:doc.name,sold,owner:f.owner&&f.owner.stringValue,updated:+(f.updated&&f.updated.integerValue)||0}});mercErr='';
    if(view==='catalogo'||view==='taller')render()}).catch(e=>{mercErr='No se ha podido cargar el catálogo de internet.'})}
async function cloudPub(it){const uid=CC.uid(),tok=await CC.token(),d=A.clean(it);delete d.sold;
  const F=['def','owner','author','name','cat','mode','price','stock','updated'];const q=F.map(k=>'updateMask.fieldPaths='+k).join('&');
  const body={fields:{def:{stringValue:JSON.stringify(d)},owner:{stringValue:uid},author:{stringValue:d.author},name:{stringValue:d.name},cat:{stringValue:d.cat},mode:{stringValue:d.mode},
    price:{integerValue:String(d.price)},stock:{integerValue:String(d.stock||0)},updated:{integerValue:String(Date.now())}}};
  await fsFetch(`${FSO()}/${uid}_${it.id}?${q}`,{method:'PATCH',headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify(body)});
  MERC=MERC||{};MERC[it.id]=MERC[it.id]||{name:`projects/${CC.cfg.projectId}/databases/(default)/documents/objetos/${uid}_${it.id}`,sold:0,owner:uid}}
async function cloudUnpub(id){const uid=CC.uid(),tok=await CC.token();await fsFetch(`${FSO()}/${uid}_${id}`,{method:'DELETE',headers:{Authorization:'Bearer '+tok}}).catch(()=>{});if(MERC)delete MERC[id]}
async function cloudBuy(it){const m=MERC[it.id],tok=await CC.token();const url='https://firestore.googleapis.com/v1/'+m.name;
  for(let k=0;k<4;k++){const doc=await fsFetch(url,{headers:{Authorization:'Bearer '+tok}});const sold=+(doc.fields.sold&&doc.fields.sold.integerValue)||0,stock=+(doc.fields.stock&&doc.fields.stock.integerValue)||0;
    if(it.limited&&sold>=stock){it.sold=m.sold=sold;throw new Error('agotado')}
    try{await fsFetch(`${url}?updateMask.fieldPaths=sold&currentDocument.updateTime=${encodeURIComponent(doc.updateTime)}`,{method:'PATCH',headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'},
      body:JSON.stringify({fields:{sold:{integerValue:String(sold+1)}}})});it.sold=m.sold=sold+1;return}catch(e){if(!/FAILED_PRECONDITION|ABORTED/.test(e.message))throw e}}
  throw new Error('ocupado')}

  fdel(fid){const f=window.CubiAmigos.data().list[fid];openModal('Eliminar amigo',`<p style="margin:0">¿Quitar a <b>${esc(f?f.name:'')}</b> de tus amigos?</p><div class="row"><button class="btn danger" data-act="fdelgo" data-id="${fid}">Sí, eliminar</button><button class="btn" data-act="close">Cancelar</button></div>`)},
  fdelgo(fid){window.CubiAmigos.remove(fid);delete FST[fid];closeModal();renderFriends();toast('Amigo eliminado')}
});
if(window.CubiAmigos){const F=CubiAmigos;F.provider=amigoProvider;
  F.on('request',p=>{toast(`${p.name} quiere ser tu amigo`);if(Au)Au.sfx('notify');renderFriends();badgeFriends()});
  F.on('new',p=>{toast(`¡${p.name||'Tu amigo'} y tú ya sois amigos!`);renderFriends()});
  F.on('change',()=>{renderFriends();badgeFriends()});
  setTimeout(()=>{F.start().then(ok=>{if(ok){refreshFriends()}})},600);
  setInterval(()=>{if(view==='amigos'&&!document.hidden&&$('#play').hidden)refreshFriends()},15000)}
function badgeFriends(){const a=document.querySelector('#side a[data-v=amigos]');if(!a||!window.CubiAmigos)return;const n=Object.keys(CubiAmigos.data().req).length;
  let b=a.querySelector('.nb');if(!n){if(b)b.remove();return}if(!b){b=document.createElement('span');b.className='nb';a.appendChild(b)}b.textContent=n}
badgeFriends();
document.addEventListener('submit',e=>{if(e.target.id==='addf'){e.preventDefault();ACT.addfriend()}});
async function buyCustom(it){if(it.mode==='me'){toast('Ese objeto no está a la venta');return}
  if(it.limited&&!stockLeft(it)){toast('Agotado: ya no quedan unidades');itemModal(it);return}
  const cloud=CC&&CC.cfg&&MERC&&MERC[it.id];
  if(cloud){if(!CC.uid()){if(it.limited){toast('Para comprar objetos limitados necesitas una cuenta en internet');return}}
    else{try{await cloudBuy(it)}catch(e){if(e.message==='agotado'){toast('¡Vaya! Se acaba de agotar');itemModal(it);if(view==='catalogo')render();return}toast('No se ha podido comprar. Prueba otra vez.');return}}}
  else if(it.limited)it.sold=(it.sold||0)+1;
  st=A.state();if(st.cubos<it.price){toast('No tienes Cubos suficientes');return}
  st.cubos-=it.price;st.owned.push(it.id);st.eq[it.cat]=it.id;st.custom[it.id]=Object.assign(A.clean(it),{sold:it.sold||0});
  addHist(`Creación de ${it.author}: ${it.name}`,-it.price);save();rebuildPV();closeModal();headKey='';if(Au)Au.sfx('buy');render();toast(`¡Comprado! Ya llevas puesto: ${it.name}`)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(!f)return;
  if(b.dataset.act==='ovclose'){f(e);return}e.preventDefault();f(b.dataset.id)});
$('#gmenubtn').addEventListener('click',()=>{const p=$('#gpanel');p.hidden=!p.hidden;$('#gmenubtn').setAttribute('aria-expanded',String(!p.hidden))});
$('#q').addEventListener('input',e=>{query=e.target.value;if(view!=='juegos')location.hash='#juegos';else render();setTimeout(()=>{const q=$('#q');q.focus()},0)});
addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').innerHTML)closeModal()});
route();
if(Au)Au.gameMusic('bienvenida');
if(CC){if(!CC.actual())gate();else CC.alAbrir().then(p=>{if(p){st=A.state();render();toast('Progreso traído de tu cuenta')}})}
window.Cubiverso={atras(){if(!$('#gate').hidden)return false;if(!$('#play').hidden){exitGame();return true}if($('#modal').innerHTML){closeModal();return true}if(view!=='inicio'){location.hash='#inicio';return true}return false}};
if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude\.ai|claudeusercontent/.test(location.hostname)&&!/CubiversoApp/.test(navigator.userAgent)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
