<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pesca Tranquila</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: lago 3D a pantalla completa; dinero arriba, botones a la izquierda, botón de pescar y minijuego abajo */
body{background:#9ad7f5}
#top{top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);text-align:center;pointer-events:none}
#money{font:400 clamp(30px,6vw,44px) "Lilita One","Arial Black",sans-serif;color:#3fd15c;line-height:1}
#bag{font-weight:900;font-size:14px}
#side{left:max(10px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px}
.sq{width:70px;height:70px;border-radius:14px;border:3px solid #000;font-weight:900;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.25)}
.sq b{font:400 22px "Lilita One",sans-serif;line-height:1}
#fish{left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);border:4px solid #000;border-radius:18px;background:#3fa7ff;font:400 24px "Lilita One",sans-serif;padding:12px 32px;box-shadow:inset 0 -7px 0 rgba(0,0,0,.25);touch-action:none;min-width:200px}
#fish small{display:block;font-family:"Nunito",sans-serif;font-size:12px;font-weight:900}
body.k-touch #fish{right:max(16px,env(safe-area-inset-right,0px));left:auto;transform:none;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);min-width:0;padding:12px 20px}
#power{left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 100px);width:min(280px,60vw);height:16px;border:3px solid #000;border-radius:10px;background:rgba(0,0,0,.35);overflow:hidden}
#power i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3fd15c,#ffcc33,#ff4f4f)}
#reel{left:50%;transform:translateX(-50%);top:62%;width:min(420px,86vw);background:rgba(10,30,50,.9);border:4px solid #000;border-radius:16px;padding:10px 12px}
#reel .lbl{font-weight:900;text-align:center;margin-bottom:6px}
#track{position:relative;height:34px;border:3px solid #000;border-radius:10px;background:linear-gradient(90deg,#0b3b5c,#1565a0,#0b3b5c);overflow:hidden}
#zone{position:absolute;top:0;bottom:0;background:rgba(63,209,92,.55);border-left:3px solid #3fd15c;border-right:3px solid #3fd15c}
#fishdot{position:absolute;top:4px;width:26px;height:20px;margin-left:-13px;border-radius:50% 40% 40% 50%;background:#ffcc33;border:2px solid #000}
#prog{margin-top:8px;height:12px;border:3px solid #000;border-radius:8px;background:rgba(0,0,0,.4);overflow:hidden}
#prog i{display:block;height:100%;background:#3fd15c}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;border:3px solid #000;border-radius:12px;background:#24304a}
.row .ic{width:52px;height:52px;border-radius:10px;border:2px solid #000;display:grid;place-items:center;font:400 18px "Lilita One",sans-serif}
.row b{display:block}.row span{display:block;font-size:12px;color:#c9d3e6;font-weight:700}
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.book div{border:3px solid #000;border-radius:12px;background:#24304a;padding:8px;text-align:center;font-size:12px;font-weight:800}
.book .dot{width:46px;height:26px;border-radius:50% 40% 40% 50%;margin:2px auto 6px;border:2px solid #000}
.book .no{opacity:.4}
.x{position:absolute;right:14px;top:12px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top" class="k-ui"><div id="money" class="k-out">$0</div><div id="bag" class="k-out"></div></div>
<div id="side" class="k-ui">
  <button class="sq k-out" style="background:#3fd15c" data-act="sell"><b>$</b>Vender</button>
  <button class="sq k-out" style="background:#ffcc33;color:#3a2600" data-act="shop"><b>⚒</b>Tienda</button>
  <button class="sq k-out" style="background:#9c6bff" data-act="book"><b>▤</b>Peces</button>
</div>
<div id="power" class="k-ui" hidden><i></i></div>
<div id="reel" class="k-ui" hidden><div class="lbl k-out" id="reellbl">¡Mantén pulsado para subir la zona verde!</div><div id="track"><div id="zone"></div><div id="fishdot"></div></div><div id="prog"><i></i></div></div>
<button id="fish" class="k-ui k-out">PESCAR<small>Mantén pulsado para lanzar más lejos</small></button>
<div id="ov"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../graficos.js"></script>
<script src="../avatar.js"></script>
<script src="../kit.js"></script>
<script src="../audio.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="../multi.js"></script>
<script src="../sala.js"></script>
<script>
const K=Kit,{M,box,cyl,sph}=K;
const W=K.setup({sky:0x9ad7f5,fogNear:90,fogFar:220});const {scene,camera,renderer,sun}=W;
const ctl=K.controls(W.canvas,{yaw:Math.PI,pitch:.35,dist:8,min:4,max:18});
const $=s=>document.querySelector(s);
/* ================= PECES (inventados) ================= */
const RAR={c:['Común','#b0bec5'],pc:['Poco común','#3fd15c'],r:['Raro','#3fa7ff'],e:['Épico','#ab47bc'],l:['Legendario','#ffca28'],m:['Mítico','#ff4f4f'],s:['Secreto','#111111']};
const FISH=[
 {id:'sardi',name:'Sardinilla Saltarina',r:'c',val:5,kg:[.1,.4],col:'#c0cfd8',w:30,diff:.8},
 {id:'carpa',name:'Carpa Bigotuda',r:'c',val:8,kg:[1,4],col:'#b58a4a',w:26,diff:.9},
 {id:'perca',name:'Perca Rayada',r:'c',val:10,kg:[.5,2],col:'#8bc34a',w:22,diff:1},
 {id:'trucha',name:'Trucha Plateada',r:'pc',val:22,kg:[1,5],col:'#9fb2c8',w:12,diff:1.2},
 {id:'lucio',name:'Lucio Gruñón',r:'pc',val:30,kg:[2,9],col:'#5d7a3a',w:10,diff:1.35},
 {id:'globo',name:'Pez Globo Risueño',r:'r',val:65,kg:[.5,3],col:'#ffd23f',w:5,diff:1.5},
 {id:'siluro',name:'Siluro Gigante',r:'r',val:85,kg:[10,40],col:'#5a4a3a',w:4,diff:1.7},
 {id:'linterna',name:'Pez Linterna',r:'e',val:220,kg:[1,4],col:'#22d3ee',w:1.6,diff:1.9},
 {id:'anguila',name:'Anguila Chispeante',r:'e',val:280,kg:[2,8],col:'#c6ff00',w:1.3,diff:2.1},
 {id:'dorada',name:'Carpa Dorada Real',r:'l',val:950,kg:[4,15],col:'#ffb300',w:.45,diff:2.3},
 {id:'pulpo',name:'Pulpo Abuelo',r:'l',val:1300,kg:[8,25],col:'#ff6f91',w:.35,diff:2.5},
 {id:'ballena',name:'Ballenita de Cristal',r:'m',val:5200,kg:[30,90],col:'#b3e5fc',w:.08,diff:2.8},
 {id:'cubipez',name:'Pez Cubiverso',r:'s',val:25000,kg:[5,10],col:'#ffb020',w:.012,diff:3.1}
];
const RODS=[
 {id:'bambu',name:'Caña de bambú',cost:0,dist:12,zone:.30,luck:1,col:'#c8a165'},
 {id:'fibra',name:'Caña de fibra',cost:300,dist:16,zone:.34,luck:1.4,col:'#3fa7ff'},
 {id:'carbono',name:'Caña de carbono',cost:1800,dist:20,zone:.38,luck:2,col:'#37474f'},
 {id:'dorada',name:'Caña dorada',cost:9000,dist:24,zone:.42,luck:3,col:'#ffcc33'},
 {id:'galactica',name:'Caña galáctica',cost:45000,dist:28,zone:.46,luck:4.5,col:'#9c6bff'}
];
const BAGS=[20,35,60,100];
let S={money:0,rod:'bambu',rods:['bambu'],bag:[],bagLv:0,bait:0,book:{}};
try{const s=JSON.parse(localStorage.getItem('cubi-pesca')||'null');if(s&&s.rods)S=Object.assign(S,s)}catch(e){}
const persist=()=>{try{localStorage.setItem('cubi-pesca',JSON.stringify(S))}catch(e){}};
const fmt=n=>'$'+(n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e4?(n/1e3).toFixed(1)+'K':Math.floor(n).toLocaleString('es-ES'));
const rod=()=>RODS.find(r=>r.id===S.rod);
/* ================= ESCENARIO ================= */
const LAKE={x:0,z:0,r:24};
const grass=new THREE.Mesh(new THREE.PlaneGeometry(200,200),M(0x6fcf4f,{map:K.studs([100,100])}));grass.rotation.x=-Math.PI/2;grass.receiveShadow=true;scene.add(grass);
const sand=new THREE.Mesh(new THREE.CircleGeometry(LAKE.r+3,48),M(0xe8d39a));sand.rotation.x=-Math.PI/2;sand.position.y=.01;scene.add(sand);
const water=new THREE.Mesh(new THREE.CircleGeometry(LAKE.r,48),new THREE.MeshLambertMaterial({color:0x2f8fd8,transparent:true,opacity:.92,emissive:0x0a2a50}));water.rotation.x=-Math.PI/2;water.position.y=.03;scene.add(water);
// muelle
const wood=M(0x9c6b3e),wood2=M(0x7a5230);
for(let k=0;k<14;k++){const zz=LAKE.r+2-k*1.2;box(3,.2,1.1,k%2?wood:wood2,0,.45,zz,scene).receiveShadow=true}
[[-1.4,LAKE.r+1],[1.4,LAKE.r+1],[-1.4,LAKE.r-6],[1.4,LAKE.r-6],[-1.4,LAKE.r-13.5],[1.4,LAKE.r-13.5]].forEach(([x,z])=>cyl(.15,.15,1.6,wood2,x,-.2,z,scene));
const DOCK={x0:-1.5,x1:1.5,z0:LAKE.r-13.8,z1:LAKE.r+2.6,y:.55};
// puesto de venta
const shop=new THREE.Group();shop.position.set(8,0,LAKE.r+8);scene.add(shop);box(4,1.2,2,M(0xfff3e0),0,.6,0,shop);box(4.4,.15,2.6,M(0xe53935),0,2.4,.2,shop);
[[-1.9,.8],[1.9,.8]].forEach(([x,z])=>cyl(.08,.08,2.4,M(0xffffff),x,1.2,z,shop));const ss=K.sprite(K.textTex([['PESCADERÍA',54,'#ffcc33',50]],420,100),4.4,1.05);ss.position.y=3.2;shop.add(ss);
// árboles y rocas
for(let i=0;i<60;i++){const a=Math.random()*Math.PI*2,r=LAKE.r+8+Math.random()*50;if(Math.abs(Math.cos(a)*r-8)<6&&Math.abs(Math.sin(a)*r-(LAKE.r+8))<6)continue;const t=new THREE.Group();t.position.set(Math.cos(a)*r,0,Math.sin(a)*r);scene.add(t);
  cyl(.3,.4,2.2,M(0x7a5232),0,1.1,0,t);const f=new THREE.Mesh(new THREE.ConeGeometry(1.8,4,8),M([0x2e7d32,0x43a047,0x388e3c][i%3]));f.position.y=4;t.add(f);K.shadows(t)}
for(let i=0;i<12;i++){const a=i/12*Math.PI*2+.3;const rk=new THREE.Mesh(new THREE.DodecahedronGeometry(.8+Math.random()*.6,0),M(0x9e9e9e));rk.position.set(Math.cos(a)*(LAKE.r+.6),.3,Math.sin(a)*(LAKE.r+.6));scene.add(rk)}
for(let i=0;i<10;i++){const lp=new THREE.Mesh(new THREE.CircleGeometry(.7,12),M(0x43a047));lp.rotation.x=-Math.PI/2;const a=Math.random()*6.28,r=6+Math.random()*14;lp.position.set(Math.cos(a)*r,.05,Math.sin(a)*r);scene.add(lp)}
/* ================= JUGADOR, CAÑA, SEDAL ================= */
const me=K.person(scene,null,window.CubiAvatar?CubiAvatar.state().name:'Tú');
const P={x:0,y:DOCK.y,z:LAKE.r-12,face:Math.PI,walk:0};
const rodG=new THREE.Group();me.armR.add(rodG);
function buildRod(){rodG.children.slice().forEach(c=>rodG.remove(c));const r=rod();const st=cyl(.04,.06,2.6,M(new THREE.Color(r.col)),0,-.3,.9,rodG,8);st.rotation.x=Math.PI/2-.5;cyl(.09,.09,.18,M(0x333333),0,-.75,.25,rodG,10).rotation.z=Math.PI/2}
buildRod();
const bobber=new THREE.Group();scene.add(bobber);sph(.16,M(0xff4f4f),0,.06,0,bobber);sph(.12,M(0xffffff),0,.22,0,bobber);bobber.visible=false;
const lineGeo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]);const line=new THREE.Line(lineGeo,new THREE.LineBasicMaterial({color:0xffffff}));scene.add(line);line.visible=false;
function rodTip(){const v=new THREE.Vector3(0,-.3,2.2);rodG.localToWorld(v);return v}
function inWater(x,z){return Math.hypot(x-LAKE.x,z-LAKE.z)<LAKE.r-1&&!(x>DOCK.x0-.5&&x<DOCK.x1+.5&&z>DOCK.z0&&z<DOCK.z1)}
function onDock(x,z){return x>DOCK.x0&&x<DOCK.x1&&z>DOCK.z0&&z<DOCK.z1}
/* ================= ESTADO DE PESCA ================= */
let st='idle',pow=0,cast=null,wait=0,biteT=0,fish=null,reel=null,held=false;
function fishModel(f,kg){const g=new THREE.Group();const c=new THREE.Color(f.col);const b=sph(.5,M(c),0,0,0,g);b.scale.set(1.4,.8,.5);const t=new THREE.Mesh(new THREE.ConeGeometry(.35,.5,4),M(c));t.rotation.z=Math.PI/2;t.position.x=-.8;g.add(t);
  sph(.08,M(0xffffff),.45,.12,.2,g);sph(.04,M(0x111111),.5,.12,.25,g);g.scale.setScalar(clamp(.5+Math.log10(1+kg)*.5,.5,2));return g}
const clamp=K.clamp;
function pickFish(){const r=rod(),luck=r.luck*(S.bait>0?1.6:1);const ws=FISH.map((f,i)=>f.w*Math.pow(luck,i*.32));let x=Math.random()*ws.reduce((a,b)=>a+b,0);for(let i=0;i<FISH.length;i++){x-=ws[i];if(x<=0)return FISH[i]}return FISH[0]}
function startCast(){if(st!=='idle'||$('#ov').innerHTML)return;if(!onDock(P.x,P.z)&&Math.hypot(P.x,P.z)>LAKE.r+2.5){K.toast('MUY LEJOS','Acércate al agua o ve al muelle','#ff4f4f');return}
  if(S.bag.length>=BAGS[S.bagLv]){K.toast('MOCHILA LLENA','Vende tus peces en la pescadería','#ff4f4f');return}st='charge';pow=0}
function releaseCast(){if(st==='charge'){const r=rod(),d=3+pow*r.dist;const yaw=ctl.look.yaw+Math.PI;P.face=yaw;const tx=P.x+Math.sin(yaw)*d,tz=P.z+Math.cos(yaw)*d;
    cast={t:0,from:rodTip(),to:new THREE.Vector3(tx,.05,tz)};st='flying';if(window.CubiAudio)CubiAudio.sfx('whoosh');bobber.visible=true;line.visible=true;$('#power').hidden=true;return}
  if(st==='bite'){hook();return}}
function hook(){fish=pickFish();const kg=+(fish.kg[0]+Math.random()*(fish.kg[1]-fish.kg[0])).toFixed(2);
  if(window.CubiAudio)CubiAudio.sfx('pop');reel={x:.5,v:0,zone:.5,zw:rod().zone,prog:.3,t:0,kg,dir:1,jit:0};st='reel';$('#reel').hidden=false;$('#reellbl').textContent='¡Mantén pulsado para subir la zona verde!';$('#fishdot').style.background=fish.col}
function endFish(caught){$('#reel').hidden=true;bobber.visible=false;line.visible=false;if(S.bait>0)S.bait--;
  if(window.CubiAudio)CubiAudio.sfx(caught?'fish':'lose');if(caught){const kg=reel.kg;const price=Math.round(fish.val*(1+kg/(fish.kg[1]||1)*.6));S.bag.push({id:fish.id,kg,price});const b=S.book[fish.id]||{n:0,best:0};b.n++;b.best=Math.max(b.best,kg);S.book[fish.id]=b;
    const m=fishModel(fish,kg);m.position.set(0,3.6,0);me.root.add(m);setTimeout(()=>me.root.remove(m),1800);
    K.toast(fish.name.toUpperCase(),`${RAR[fish.r][0]} · ${kg} kg · ${fmt(price)}`,RAR[fish.r][1]==='#111111'?'#ffb020':RAR[fish.r][1]);
    if(fish.id==='cubipez'&&window.CubiAvatar){const s=CubiAvatar.state();s.cubos+=20;(s.history=s.history||[]).unshift({t:Date.now(),txt:'Pez Cubiverso pescado',amt:20});CubiAvatar.save(s);setTimeout(()=>K.toast('+20 CUBOS','¡Premio por el Pez Cubiverso!'),1900)}}
  else K.toast('SE HA ESCAPADO','Vuelve a intentarlo','#ff4f4f');
  persist();st='idle';fish=null;reel=null}
/* ================= TIENDA, VENTA, LIBRO ================= */
const ov=$('#ov');
function nearShop(){return Math.hypot(P.x-shop.position.x,P.z-shop.position.z)<6}
function sellAll(){if(!S.bag.length){K.toast('NO TIENES PECES','Pesca primero','#ff4f4f');return}if(!nearShop()){K.toast('VE A LA PESCADERÍA','Está en la orilla, a la derecha del muelle','#ffcc33');return}
  const v=S.bag.reduce((a,f)=>a+f.price,0);S.money+=v;S.bag=[];persist();if(window.CubiAudio)CubiAudio.sfx('cash');K.toast('VENDIDO','+'+fmt(v),'#3fd15c')}
function shopHTML(){return K.panel('TIENDA','#ffcc33',`<p>Tienes <b style="color:#3fd15c">${fmt(S.money)}</b>.</p>
  ${RODS.map(r=>{const own=S.rods.includes(r.id),on=S.rod===r.id;return `<div class="row"><div class="ic" style="background:${r.col}"></div><div><b>${r.name}</b><span>Lanza ${r.dist} m · zona ${Math.round(r.zone*100)}% · suerte x${r.luck}</span></div>
  ${on?'<button class="k-btn k-out" disabled>EN USO</button>':own?`<button class="k-btn b k-out" data-act="userod" data-id="${r.id}">USAR</button>`:`<button class="k-btn y k-out" data-act="buyrod" data-id="${r.id}" ${S.money<r.cost?'disabled':''}>${fmt(r.cost)}</button>`}</div>`}).join('')}
  <div class="row"><div class="ic" style="background:#ff6fb5">✦</div><div><b>Cebo brillante ×10</b><span>Pican antes y salen peces más raros. Te quedan ${S.bait}.</span></div><button class="k-btn y k-out" data-act="bait" ${S.money<150?'disabled':''}>${fmt(150)}</button></div>
  ${S.bagLv<BAGS.length-1?`<div class="row"><div class="ic" style="background:#8d6e63">▤</div><div><b>Mochila más grande</b><span>Caben ${BAGS[S.bagLv+1]} peces en vez de ${BAGS[S.bagLv]}.</span></div><button class="k-btn y k-out" data-act="bag" ${S.money<bagCost()?'disabled':''}>${fmt(bagCost())}</button></div>`:''}
  <button class="k-btn k-out" data-act="close">Cerrar</button>`)}
const bagCost=()=>[500,3000,15000][S.bagLv];
function bookHTML(){const n=Object.keys(S.book).length;return K.panel(`PECES ${n}/${FISH.length}`,'#9c6bff',`<div class="book">${FISH.map(f=>{const b=S.book[f.id];return `<div class="${b?'':'no'}"><div class="dot" style="background:${b?f.col:'#555'}"></div>${b?f.name:'???'}<br><span style="color:${RAR[f.r][1]==='#111111'?'#ffb020':RAR[f.r][1]}">${RAR[f.r][0]}</span>${b?`<br>${b.n} pescados · máx ${b.best} kg`:''}</div>`}).join('')}</div>
  <p>Mochila: ${S.bag.length}/${BAGS[S.bagLv]} peces, valen ${fmt(S.bag.reduce((a,f)=>a+f.price,0))}.</p><button class="k-btn k-out" data-act="close">Cerrar</button>`)}
const ACT={close(){ov.innerHTML=''},sell:sellAll,shop(){ov.innerHTML=shopHTML()},book(){ov.innerHTML=bookHTML()},
  buyrod(id){const r=RODS.find(x=>x.id===id);if(S.money<r.cost)return;S.money-=r.cost;if(window.CubiAudio)CubiAudio.sfx('buy');S.rods.push(id);S.rod=id;buildRod();persist();ov.innerHTML=shopHTML()},
  userod(id){S.rod=id;buildRod();persist();ov.innerHTML=shopHTML()},
  bait(){if(S.money<150)return;S.money-=150;if(window.CubiAudio)CubiAudio.sfx('buy');S.bait+=10;persist();ov.innerHTML=shopHTML()},
  bag(){const c=bagCost();if(S.money<c)return;S.money-=c;if(window.CubiAudio)CubiAudio.sfx('buy');S.bagLv++;persist();ov.innerHTML=shopHTML()},
  start(){ov.innerHTML=''}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;ACT[b.dataset.act]&&ACT[b.dataset.act](b.dataset.id)});
const fb=$('#fish');fb.addEventListener('pointerdown',e=>{e.preventDefault();held=true;if(st==='idle')startCast();else if(st==='bite')hook()});
['pointerup','pointercancel','pointerleave'].forEach(t=>fb.addEventListener(t,()=>{held=false;releaseCast()}));
addEventListener('keydown',e=>{if(e.key==='f'||e.key==='F'||e.key==='Enter'){if(e.repeat)return;held=true;if(st==='idle')startCast();else if(st==='bite')hook()}});
addEventListener('keyup',e=>{if(e.key==='f'||e.key==='F'||e.key==='Enter'){held=false;releaseCast()}});
/* ================= BUCLE ================= */
let last=performance.now(),T=0;
function loop(t){const dt=Math.min((t-last)/1000,.05);last=t;T+=dt;
  // andar (solo sin estar pescando)
  if(st==='idle'&&!ov.innerHTML){const mv=ctl.move(),sp=7;let nx=P.x+mv.x*sp*dt,nz=P.z+mv.z*sp*dt;
    if(inWater(nx,nz)&&!onDock(nx,nz)){nx=P.x;nz=P.z}P.x=clamp(nx,-90,90);P.z=clamp(nz,-90,90);P.y=onDock(P.x,P.z)?DOCK.y:0;if(mv.len>.1){P.face=Math.atan2(mv.x,mv.z);P.walk+=dt*sp*1.4}else P.walk*=.8}
  else P.walk*=.8;
  me.root.position.set(P.x,P.y,P.z);let df=P.face-me.root.rotation.y;df=Math.atan2(Math.sin(df),Math.cos(df));me.root.rotation.y+=df*Math.min(1,dt*12);K.walkAnim(me,P.walk,false);
  me.armR.rotation.x=st==='charge'?-2.4-pow*.6:st==='idle'?-.5:-1.1;
  if(st==='charge'){pow=Math.min(1,pow+dt*.8);$('#power').hidden=false;$('#power i').style.width=pow*100+'%'}
  if(st==='flying'){cast.t+=dt*1.6;const p=Math.min(1,cast.t);const v=cast.from.clone().lerp(cast.to,p);v.y+=Math.sin(p*Math.PI)*3;bobber.position.copy(v);
    if(p>=1){if(inWater(cast.to.x,cast.to.z)){if(window.CubiAudio)CubiAudio.sfx('splash');st='wait';wait=(2+Math.random()*5)*(S.bait>0?.55:1)}else{K.toast('AHÍ NO HAY AGUA','Apunta al lago','#ff4f4f');st='idle';bobber.visible=false;line.visible=false}}}
  if(st==='wait'){wait-=dt;bobber.position.y=.05+Math.sin(T*3)*.03;if(wait<=0){st='bite';biteT=1.2;if(window.CubiAudio)CubiAudio.sfx('bite');K.toast('¡PICA!','¡Pulsa PESCAR ya!','#3fd15c')}}
  if(st==='bite'){biteT-=dt;bobber.position.y=-.12+Math.sin(T*30)*.06;if(biteT<=0){K.toast('SE HA IDO','Hay que pulsar más rápido','#ff4f4f');st='wait';wait=2+Math.random()*3}}
  if(st==='reel'){const r=reel;r.t+=dt;r.jit-=dt;if(r.jit<=0){r.jit=.4+Math.random()*.8/fish.diff;r.dir=(Math.random()-.5)*2*fish.diff}
    r.x=clamp(r.x+r.dir*dt*.45,0.03,.97);if(r.x<=.03||r.x>=.97)r.dir*=-1;
    r.v+=(held?1.6:-1.6)*dt;r.v*=.92;r.zone=clamp(r.zone+r.v*dt*1.8,r.zw/2,1-r.zw/2);if(r.zone<=r.zw/2||r.zone>=1-r.zw/2)r.v*=-.3;
    const inside=Math.abs(r.x-r.zone)<r.zw/2;r.prog=clamp(r.prog+(inside?.32:-.22/Math.max(.7,1/fish.diff))*dt,0,1);
    $('#zone').style.left=(r.zone-r.zw/2)*100+'%';$('#zone').style.width=r.zw*100+'%';$('#fishdot').style.left=r.x*100+'%';$('#prog i').style.width=r.prog*100+'%';
    bobber.position.y=-.1+Math.sin(T*18)*.08;bobber.position.x+=Math.sin(T*4)*.01;
    if(r.prog>=1)endFish(true);else if(r.prog<=0)endFish(false)}
  if(line.visible){const a=rodTip();const pos=line.geometry.attributes.position;pos.setXYZ(0,a.x,a.y,a.z);pos.setXYZ(1,bobber.position.x,bobber.position.y+.1,bobber.position.z);pos.needsUpdate=true}
  water.material.color.setHSL(.57,.65,.5+Math.sin(T*.6)*.02);
  if(ctl.keys.q)ctl.look.yaw+=dt*2;if(ctl.keys.e)ctl.look.yaw-=dt*2;
  $('#money').textContent=fmt(S.money);$('#bag').textContent=`Mochila ${S.bag.length}/${BAGS[S.bagLv]} · ${rod().name}${S.bait?` · cebo ${S.bait}`:''}`;
  fb.firstChild.textContent=st==='bite'?'¡TIRA!':st==='reel'?'TIRA':'PESCAR';
  ctl.camera(camera,P.x,P.y,P.z,1.4);renderer.render(scene,camera);requestAnimationFrame(loop)}
ov.innerHTML=K.panel('PESCA TRANQUILA','#3fa7ff',`<p>Un lago tranquilo lleno de peces raros. ¿Conseguirás pescar los 13?</p>
  <ul><li>Mira hacia el agua y <b>mantén pulsado PESCAR</b> (o F) para lanzar más lejos.</li><li>Cuando el corcho se hunda y salga <b>¡PICA!</b>, pulsa rápido.</li>
  <li>Mantén pulsado para mover la <b>zona verde</b> y que el pez se quede dentro hasta llenar la barra.</li><li>Vende en la <b>pescadería</b> y compra cañas mejores. El Pez Cubiverso da 20 Cubos.</li></ul>
  <button class="k-btn g k-out" data-act="start">¡A PESCAR!</button>`);
K.emotes(me);if(window.CubiAudio)CubiAudio.gameMusic('lago');
Sala.init({game:'pesca',scene,me,getState:()=>({x:+P.x.toFixed(2),y:+P.y.toFixed(2),z:+P.z.toFixed(2),ry:+P.face.toFixed(2)}),board:{label:'Dinero'},shared:'Pescáis juntos en el mismo lago; cada uno guarda sus peces y su dinero.'});
setInterval(()=>Sala.score(S.money,fmt(S.money)),1000);
setInterval(()=>{if(st==='reel'&&window.CubiAudio)CubiAudio.sfx('reel')},120);
requestAnimationFrame(loop);
</script>
