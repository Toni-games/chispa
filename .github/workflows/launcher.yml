name: Cubiverso Launcher
on:
  push:
    branches: [cubiverso-launcher]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar Electron
        run: npm install --no-audit --no-fund
      - name: Incluir las librerías (para que el 3D funcione sin internet)
        shell: bash
        run: |
          mkdir -p lib
          curl -sSfL https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js -o lib/three.min.js
          curl -sSfL https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js -o lib/peerjs.min.js
      - name: Crear el instalador
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Leer la versión
        shell: bash
        run: echo "VL=$(node -p "require('./package.json').version")" >> $GITHUB_ENV
      - name: Publicar para descargar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cubiverso-launcher-v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Cubiverso Launcher ${{ env.VL }} (compilación ${{ github.run_number }})
          body: |
            **Cubiverso-Launcher-Instalador.exe**: instala el launcher con acceso directo en el escritorio.
            **Cubiverso-Launcher-Portable.exe**: se abre sin instalar nada.
            Elige cualquier versión de Cubiverso, descárgala y juega con tu cuenta.
            Windows puede avisar de que la app no es conocida: pulsa «Más información» y luego «Ejecutar de todas formas».
          files: |
            salida/Cubiverso-Launcher-Instalador.exe
            salida/Cubiverso-Launcher-Portable.exe
          make_latest: false
