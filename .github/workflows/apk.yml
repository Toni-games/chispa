name: Crear APK de Cubiverso

on:
  push:
    branches: [cubiverso-apk]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android (ya viene instalado en GitHub)
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar las dos APK (gratis y Pro)
        run: gradle assembleGratisRelease assembleProRelease --no-daemon --stacktrace

      - name: Preparar los archivos
        run: |
          cp app/build/outputs/apk/gratis/release/app-gratis-release.apk Cubiverso.apk
          cp app/build/outputs/apk/pro/release/app-pro-release.apk Cubiverso-Pro.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Cubiverso-apk
          path: |
            Cubiverso.apk
            Cubiverso-Pro.apk

      - name: Publicar la APK para descargar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cubiverso-v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Cubiverso para Android (versión ${{ github.run_number }})
          body: |
            **Cubiverso.apk**: versión gratis, con anuncios.
            **Cubiverso-Pro.apk**: versión Pro, sin anuncios.
            Descarga la que quieras desde el móvil o la tablet y ábrela para instalarla.
            Si Android lo pide, permite «Instalar aplicaciones de origen desconocido» para tu navegador.
            La app necesita internet para cargar los gráficos 3D y para jugar con amigos.
          files: |
            Cubiverso.apk
            Cubiverso-Pro.apk
          make_latest: false
