name: Cubiverso Launcher para Android

on:
  push:
    branches: [cubiverso-launcher-android]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android (ya viene instalado en GitHub)
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Incluir las librerías (para que el 3D funcione sin internet)
        run: |
          mkdir -p app/src/main/assets/lib
          curl -sSfL https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js -o app/src/main/assets/lib/three.min.js
          curl -sSfL https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js -o app/src/main/assets/lib/peerjs.min.js

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar la APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Preparar el archivo
        run: cp app/build/outputs/apk/release/app-release.apk Cubiverso-Launcher.apk

      - name: Leer la versión
        run: echo "VL=$(sed -n "s/.*versionName '\(.*\)'.*/\1/p" app/build.gradle)" >> $GITHUB_ENV

      - name: Publicar la APK para descargar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cubiverso-launcher-android-v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Cubiverso Launcher Android ${{ env.VL }} (compilación ${{ github.run_number }})
          body: |
            Descarga **Cubiverso-Launcher.apk** desde el móvil o la tablet y ábrelo para instalarlo.
            Elige cualquier versión de Cubiverso, descárgala y juega con tu cuenta.
            Si Android lo pide, permite «Instalar aplicaciones de origen desconocido» para tu navegador.
          files: Cubiverso-Launcher.apk
          make_latest: false
