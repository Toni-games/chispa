name: Picaterra Android
on:
  push:
    branches: [picaterra-android]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      # Firma: si existe el secreto ANDROID_KEYSTORE (base64) se usa siempre la misma, y así las
      # actualizaciones se instalan encima. Si no existe, se crea una firma nueva para esta compilación.
      - name: Preparar la firma
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > app/firma.jks; else
            keytool -genkeypair -keystore app/firma.jks -alias picaterra -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${ANDROID_KEY_PASS:-android}" -keypass "${ANDROID_KEY_PASS:-android}" -dname "CN=Toni-games, O=Picaterra, C=ES"; fi
      - name: Crear la APK
        env:
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: gradle :app:assembleRelease --no-daemon
      - name: Preparar
        run: cp app/build/outputs/apk/release/app-release.apk Picaterra-Launcher.apk
      - name: Publicar para descargar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: picaterra-android-v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Picaterra Launcher para Android (compilación ${{ github.run_number }})
          body: |
            **Picaterra-Launcher.apk**: el launcher de Picaterra para móviles y tablets Android (7.0 o más nuevo).
            Descarga sola la última versión del juego, guarda los mundos aunque se actualice y deja añadir canciones y texturas.
            Al instalarla, Android puede pedir permiso para «instalar apps de origen desconocido».
          files: Picaterra-Launcher.apk
          make_latest: false
